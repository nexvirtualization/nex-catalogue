# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Minecraft Magma
  summary: Run legacy Magma Forge and Bukkit plugins
  description: >-
    Keep the server folders on This host and choose a registered primary network that players can
    reach. Join using the app’s Primary address on TCP 25565 in Java Edition. Includes the archived
    Magma Maintained build b4bdd80 for Minecraft 1.20.1. Use Java Edition 1.20.1 clients and match
    any client-side Forge mods. Keep access limited to trusted players. Make a stopped backup before
    applying updates.
  category: games
  website: https://github.com/magmamaintained/MagmaMaintained-1.20.1
  source: https://github.com/itzg/docker-minecraft-server
  docs: https://docker-minecraft-server.readthedocs.io/en/latest/types-and-platforms/server-types/hybrids/#magma-maintained
  license: Minecraft EULA and upstream server license
  architectures: [amd64, arm64]
  tags: [minecraft, sandbox]
  options:
    EULA:
      label: Accept the Minecraft EULA
      type: bool
      help: >-
        Read https://www.minecraft.net/eula and turn this on to start the server.
    PLAYERS:
      label: Allowed Java players
      help: >-
        Comma-separated Java Edition usernames. Edit this list in Nex to grant or revoke access.
    DATA:
      label: World, extensions and settings
      help: >-
        Choose This host and include this folder in stopped backups.
services:
  minecraft-magma:
    image: ghcr.io/itzg/minecraft-server:java17
    environment:
      EULA: ${EULA}
      TYPE: CUSTOM
      MEMORY: 3G
      ENABLE_RCON: 'false'
      ONLINE_MODE: 'true'
      ENABLE_WHITELIST: 'true'
      ENFORCE_WHITELIST: 'true'
      EXISTING_WHITELIST_FILE: SYNCHRONIZE
      WHITELIST: ${PLAYERS}
      VERSION: 1.20.1
      HYBRIDTYPE: forge
      CUSTOM_SERVER: https://github.com/magmamaintained/MagmaMaintained-1.20.1/releases/download/b4bdd80/magma-1.20.1-47.2.20-b4bdd80-server.jar
    expose:
      - 25565/tcp
    volumes:
      - ${DATA}:/data
    stop_grace_period: 90s
    deploy:
      replicas: 1
    healthcheck:
      start_period: 15m
