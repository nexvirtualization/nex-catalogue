# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Featbit
  summary: Manage feature flags and evaluate release rules
  description: Prepare PostgreSQL and apply the schema supplied with the matching FeatBit release. Route
    the dashboard, API and evaluation server through their configured HTTPS addresses. Rotate the upstream
    initial administrator credentials before exposure.
  category: development
  website: https://www.featbit.co/
  source: https://github.com/featbit/featbit
  docs: https://github.com/featbit/featbit/blob/main/docker-compose.yml
  primary_service: featbit
  post_install: Prepare PostgreSQL and apply the schema supplied with the matching FeatBit release. Route
    the dashboard, API and evaluation server through their configured HTTPS addresses. Rotate the upstream
    initial administrator credentials before exposure.
  license: MIT
  architectures:
  - amd64
  - arm64
  web:
    port: 80
  options:
    API_URL:
      label: Api url
      help: Enter the deployment value described in the upstream setup guide.
    EVALUATION_URL:
      label: Evaluation url
      help: Enter the deployment value described in the upstream setup guide.
    POSTGRES_CONNECTION:
      label: PostgreSQL connection string
      help: Use the format Host=db;Port=5432;Username=featbit;Password=…;Database=featbit.
      type: password
    SIGNING_SECRET:
      label: Signing secret
      help: Use Generate, which makes 32 letters and digits. It must be at least 32 characters. If Generate
        gives only 24 characters (older Nex), paste the output of openssl rand -hex 32 instead.
      type: password
      generate: {format: alnum, length: 32, min_length: 32}
    PORT:
      label: HTTP port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
    API_PORT:
      label: Backend API port
      help: The app listens on TCP port 5000 on its default Docker network. Nex does not publish it on host
        addresses.
    EVALUATION_PORT:
      label: Evaluation port
      help: The app listens on TCP port 5100 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  featbit:
    image: docker.io/library/caddy:latest
    ports:
    - ${PORT:-80}:80/tcp
    - ${API_PORT:-5000}:5000/tcp
    - ${EVALUATION_PORT:-5100}:5100/tcp
    entrypoint:
    - /bin/sh
    command:
    - -ec
    - |-
      printf '%s\n' '{
        auto_https off
      }
      :80 {
        reverse_proxy ui:80
      }
      :5000 {
        reverse_proxy api-server:5000
      }
      :5100 {
        reverse_proxy evaluation-server:5100
      }' | exec caddy run --config - --adapter caddyfile
    deploy:
      replicas: 1
  ui:
    image: docker.io/featbit/featbit-ui:6.1.2
    environment:
      API_URL: ${API_URL}
      EVALUATION_URL: ${EVALUATION_URL}
      BASE_HREF: /
    deploy:
      replicas: 1
  api-server:
    image: docker.io/featbit/featbit-api-server:6.1.2
    environment:
      DbProvider: Postgres
      MqProvider: Postgres
      CacheProvider: None
      Postgres__ConnectionString: ${POSTGRES_CONNECTION}
      Jwt__Algorithm: HS256
      Jwt__Key: ${SIGNING_SECRET}
    deploy:
      replicas: 1
  evaluation-server:
    image: docker.io/featbit/featbit-evaluation-server:6.1.2
    environment:
      DbProvider: Postgres
      MqProvider: Postgres
      CacheProvider: None
      Postgres__ConnectionString: ${POSTGRES_CONNECTION}
    deploy:
      replicas: 1
