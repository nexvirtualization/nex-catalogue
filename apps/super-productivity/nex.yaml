# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Super Productivity
  summary: Plan tasks, block time and track work in your browser
  description: This package runs the web editor. Tasks, work sessions and preferences are stored in browser
    storage. Connect your own sync backend if you need access across devices.
  category: productivity
  website: https://super-productivity.com
  source: https://github.com/super-productivity/super-productivity
  docs: https://github.com/super-productivity/super-productivity/blob/master/docs/wiki/2.13-Run-with-Docker.md
  license: MIT
  primary_service: super-productivity
  architectures:
  - amd64
  - arm64
  post_install: Open the app, configure sync if needed, and export backups from the app. Nex server backups
    do not capture browser data.
  web:
    port: 80
  scale:
  - super-productivity
  options:
    PORT:
      label: HTTP port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  super-productivity:
    image: docker.io/johannesjo/super-productivity:latest
    ports:
    - ${PORT:-80}:80/tcp
    deploy:
      replicas: 1
