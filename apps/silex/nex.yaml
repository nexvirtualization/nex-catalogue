# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Silex
  summary: Build and export websites through a visual editor
  description: Silex uses local filesystem storage and lets you download exported site files. Keep the editing
    interface behind an authenticating HTTPS proxy.
  category: development
  website: https://www.silex.me/
  source: https://github.com/silexlabs/Silex
  docs: https://docs.silex.me/developer/self-hosting/docker/
  primary_service: silex
  post_install: Use the configured public address to open the editor. Download the resulting website when
    ready and back up the managed Site data folder.
  license: AGPL-3.0
  architectures:
  - amd64
  web:
    port: 6805
  options:
    PUBLIC_URL:
      label: Editor address
      help: Full browser-facing URL including scheme.
    SESSION_SECRET:
      label: Session signing secret
      help: Random key of at least 32 characters.
      type: password
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 6805 inside Nex.
    DATA:
      label: Site data
      help: Managed directory mounted at /data. Choose storage writable by the application.
services:
  silex:
    image: docker.io/silexlabs/silex-platform:latest
    ports:
    - ${PORT:-20262}:6805/tcp
    volumes:
    - ${DATA}:/data
    environment:
      SILEX_URL: ${PUBLIC_URL}
      SILEX_SESSION_SECRET: ${SESSION_SECRET}
      SILEX_HOST: 0.0.0.0
      STORAGE_CONNECTORS: fs
      HOSTING_CONNECTORS: fs,download
      SILEX_FS_ROOT: /data/storage
      SILEX_FS_HOSTING_ROOT: /data/hosting
    deploy:
      replicas: 1
