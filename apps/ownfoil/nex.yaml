# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Ownfoil
  summary: Organize a library of Nintendo Switch game files
  description: Ownfoil indexes your locally held library and serves its browser interface. Library content
    is mounted read-only.
  category: media
  website: https://github.com/a1ex4/ownfoil
  source: https://github.com/a1ex4/ownfoil
  docs: https://github.com/a1ex4/ownfoil
  primary_service: ownfoil
  post_install: Sign in as the configured administrator and choose the Games folder as the library source.
    Use a trusted network and only content you are authorized to use.
  license: AGPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 8465
  options:
    USER:
      label: Email or login name
      help: Account identifier supplied to the application.
    PASSWORD:
      label: Account password
      help: Choose a strong password for this deployment.
      type: password
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 8465 inside Nex.
    GAMES:
      label: Game library
      help: Managed directory mounted at /games. Choose storage readable by the application.
    CONFIG:
      label: Account settings
      help: Managed directory mounted at /app/config. Choose storage writable by the application.
    DATA:
      label: Library index
      help: Managed directory mounted at /app/data. Choose storage writable by the application.
services:
  ownfoil:
    image: docker.io/a1ex4/ownfoil:latest
    ports:
    - ${PORT:-20245}:8465/tcp
    volumes:
    - ${GAMES}:/games:ro
    - ${CONFIG}:/app/config
    - ${DATA}:/app/data
    environment:
      USER_ADMIN_NAME: ${USER:-admin}
      USER_ADMIN_PASSWORD: ${PASSWORD}
    deploy:
      replicas: 1
