# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Squad 44
  summary: Host World War II multiplayer battles
  description: >-
    Keep the game folders on This host and choose a registered primary network that players can reach.
    Connect through the server browser. The game uses UDP 10027–10028 and Steam queries use UDP 10037–10038.
    First boot downloads the server through SteamCMD. Restarts check for updates. Make a stopped backup
    before applying game updates.
  category: games
  website: https://store.steampowered.com/app/736220/
  source: https://github.com/GameServerManagers/docker-gameserver
  docs: https://linuxgsm.com/servers/squad44server/
  license: Proprietary game server
  architectures:
    - amd64
  tags:
    - steam
    - fps
  options:
    DATA:
      label: Server data
      help: Choose This host and include this folder in stopped backups.
services:
  squad-44:
    image: ghcr.io/gameservermanagers/gameserver:squad44
    environment:
      UPDATE_CHECK: '0'
      UPDATE_ON_START: 'true'
    expose:
      - 10027/udp
      - 10028/udp
      - 10037/udp
      - 10038/udp
    volumes:
      - ${DATA}:/data
    healthcheck:
      start_period: 25m
    stop_grace_period: 90s
    deploy:
      replicas: 1
