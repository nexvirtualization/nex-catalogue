# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Reitti
  summary: Map and review your location history
  description: PostGIS and Valkey (Redis) run inside this app. Open the site on a private HTTPS origin,
    replace the initial administrator password, and connect location sources.
  category: home-automation
  website: https://www.dedicatedcode.com/projects/reitti
  source: https://github.com/dedicatedcode/reitti
  docs: https://www.dedicatedcode.com/projects/reitti/latest/infrastructure/docker-config/
  primary_service: reitti
  post_install: PostGIS and Valkey (Redis) run inside this app. Open the site on a private HTTPS origin,
    replace the initial administrator password, and connect location sources.
  license: AGPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 8080
  options:
    DB_PASSWORD:
      label: Database password
      help: Use Generate to create a unique secret for the PostGIS database that runs inside this app.
      type: password
    DB_DATA:
      label: Database folder
      help: Select This host. Stores the PostGIS database. Include this folder in a stopped Nex backup.
    PORT:
      label: HTTP port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Location data and imports
      help: Select This host. Stores imports and application files. Include this folder in a stopped Nex
        backup.
    TILE_DATA:
      label: Map tile cache
      help: Select This host. Caches map tiles and can be discarded.
services:
  reitti:
    image: docker.io/dedicatedcode/reitti:5
    entrypoint:
    - /bin/sh
    - -c
    - |
      until nc -z db 5432; do sleep 2; done
      exec /entrypoint.sh
    ports:
    - ${PORT:-8080}:8080/tcp
    volumes:
    - ${DATA}:/data
    environment:
      POSTGIS_HOST: db
      POSTGIS_PORT: '5432'
      POSTGIS_DB: reittidb
      POSTGIS_USER: reitti
      POSTGIS_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      TILES_CACHE: http://tile-cache
    deploy:
      replicas: 1
    healthcheck:
      # The first start waits for the database to be created and migrated.
      start_period: 15m
  db:
    image: docker.io/postgis/postgis:latest
    environment:
      POSTGRES_USER: reitti
      POSTGRES_DB: reittidb
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
    - ${DB_DATA}:/var/lib/postgresql
    deploy:
      replicas: 1
  redis:
    image: docker.io/valkey/valkey:latest
    deploy:
      replicas: 1
  tile-cache:
    image: docker.io/dedicatedcode/reitti-tile-cache:5
    volumes:
    - ${TILE_DATA}:/var/cache/nginx
    deploy:
      replicas: 1
