x-nex:
  name: Anubis
  summary: Protect your own web service with an HTTP proof-of-work proxy
  description: Set the destination to your own reachable upstream service, then configure the reverse
    proxy to send traffic through Anubis.
  category: networking
  website: https://github.com/TecharoHQ/anubis
  source: https://github.com/TecharoHQ/anubis
  docs: https://anubis.techaro.lol/docs/admin/installation/docker/
  primary_service: anubis
  scalable: false
  license: MIT
  web:
    port: 8923
  options:
    USE_REMOTE_ADDRESS:
      label: Use connection address
      help: Leave empty for true, which takes the client address from the connection. Enter false only behind a
        reverse proxy that sends X-Real-IP, otherwise Anubis refuses every request.
    TARGET:
      label: Upstream website URL
      help: Full http:// or https:// URL of the service Anubis protects, reachable from the application network.
        Verified visitors are proxied there; Anubis answers with an error while it is unreachable.
    PORT:
      label: Web port
      help: The app listens on TCP port 8923 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  anubis:
    image: ghcr.io/techarohq/anubis:latest
    environment:
      TARGET: ${TARGET}
      BIND: :8923
      USE_REMOTE_ADDRESS: ${USE_REMOTE_ADDRESS:-true}
    ports:
    - ${PORT:-8923}:8923/tcp
    deploy:
      replicas: 1
