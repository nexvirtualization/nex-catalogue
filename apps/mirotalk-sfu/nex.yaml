# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: MiroTalk SFU
  summary: Host WebRTC meetings with server-side media forwarding
  description: Choose a dedicated Primary network reachable by participants. Route the web interface through
    HTTPS and allow TCP and UDP 40000 to the app address. Set the public browser URL and announced address
    before opening rooms.
  category: communication
  website: https://sfu.mirotalk.com
  source: https://github.com/miroslavpejic85/mirotalksfu
  docs: https://github.com/miroslavpejic85/mirotalksfu/blob/main/.env.template
  scalable: false
  primary_service: mirotalk-sfu
  architectures:
  - amd64
  - arm64
  web:
    service: mirotalk-sfu
    scheme: http
    port: 3010
  options:
    PUBLIC_URL:
      label: Public web address
      help: Full URL clients will open, including scheme and any non-default port.
    RTC_ADDRESS:
      label: Rtc Address
      help: Client-reachable IP address or DNS name announced for RTC.
    HOST_USERNAME:
      label: Host login username
      help: Username that opens and manages rooms. Must not be admin, guest or username.
    HOST_PASSWORD:
      label: Host login password
      type: password
      help: Password for the host login, 1 to 36 characters.
    SIGNING_SECRET:
      label: Session signing secret
      type: password
      help: Any long secret; Nex Generate works. MiroTalk's own signing key is derived from it. Keep it
        across upgrades and restores.
    PORT:
      label: Web port
      help: The app listens on TCP port 3010 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  mirotalk-sfu:
    image: mirotalk/sfu:latest
    environment:
      SERVER_HOST_URL: ${PUBLIC_URL}
      SFU_ANNOUNCED_IP: ${RTC_ADDRESS}
      SFU_LISTEN_IP: 0.0.0.0
      SFU_MIN_PORT: '40000'
      SFU_MAX_PORT: '40000'
      SFU_NUM_WORKERS: '1'
      SFU_SERVER: 'true'
      HOST_PROTECTED: 'true'
      HOST_USER_AUTH: 'true'
      HOST_USERNAME: ${HOST_USERNAME}
      HOST_PASSWORD: ${HOST_PASSWORD}
      SIGNING_SECRET: ${SIGNING_SECRET}
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - |
      export JWT_SECRET="$$(printf %s "$$SIGNING_SECRET" | sha256sum | cut -d' ' -f1)"
      export HOST_USERS="$$(node -e 'process.stdout.write(JSON.stringify([{username: process.env.HOST_USERNAME, password: process.env.HOST_PASSWORD, displayname: process.env.HOST_USERNAME, allowed_rooms: ["*"]}]))')"
      exec docker-entrypoint.sh node app/src/Server.js
    ports:
    - ${PORT:-3010}:3010/tcp
    expose:
    - 40000/tcp
    - 40000/udp
    deploy:
      replicas: 1
