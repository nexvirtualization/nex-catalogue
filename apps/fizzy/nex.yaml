x-nex:
  name: Fizzy
  summary: Track projects using Kanban cards
  description: Fizzy keeps its database and attached files in managed storage. HTTPS terminates at your reverse
    proxy.
  category: productivity
  website: https://www.fizzy.do/
  source: https://github.com/basecamp/fizzy
  docs: https://github.com/basecamp/fizzy/blob/main/docs/docker-deployment.md
  primary_service: fizzy
  post_install: Set up the HTTPS route for the configured base address. Create an account and retrieve the
    sign-in code from the application log until you configure an SMTP provider.
  license: O'Saasy License
  architectures:
  - amd64
  - arm64
  web:
    port: 80
  options:
    PUBLIC_URL:
      label: Public HTTPS address
      help: Full URL browsers use, including scheme.
    SECRET_KEY_BASE:
      label: Rails signing secret
      help: Generate and retain a strong random signing secret.
      type: password
    PORT:
      label: HTTP port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Cards and attachments
      help: Managed directory mounted at /rails/storage. Choose storage writable by the application.
services:
  fizzy:
    image: ghcr.io/basecamp/fizzy:latest
    ports:
    - ${PORT:-80}:80/tcp
    volumes:
    - ${DATA}:/rails/storage
    environment:
      BASE_URL: ${PUBLIC_URL}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    deploy:
      replicas: 1
