# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Manticore Search
  summary: Run a full-text and vector search service
  description: Connect clients over the private SQL or HTTP API. Restrict network access to known clients
    and review the upgrade path before replacing the image.
  category: development
  website: https://github.com/manticoresoftware/manticoresearch/
  source: https://github.com/manticoresoftware/manticoresearch/
  docs: https://manual.manticoresearch.com/Installation/Docker
  primary_service: manticore-search
  scalable: false
  license: GPL-3.0
  options:
    DATA:
      label: Search indexes
      help: Keep search indexes in this managed folder between restarts.
    PORT:
      label: Service port
      help: Host-published TCP port. With a dedicated Primary network and host publishing off, use the
        application address on port 9308.
    SQL_PORT:
      label: SQL API port
      help: Host-published TCP port. With a dedicated Primary network and host publishing off, use the
        application address on port 9306.
services:
  manticore-search:
    image: docker.io/manticoresearch/manticore:latest
    volumes:
    - ${DATA}:/var/lib/manticore
    ports:
    - ${PORT:-9308}:9308/tcp
    - ${SQL_PORT:-9306}:9306/tcp
    deploy:
      replicas: 1
