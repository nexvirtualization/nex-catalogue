x-nex:
  name: ZoneMinder
  summary: Monitor and record network video cameras
  description: MariaDB runs inside this app and the zm database is created on first start. Configure network
    cameras and user permissions from the web interface on a trusted network.
  category: home-automation
  website: https://www.zoneminder.com/
  source: https://github.com/ZoneMinder/ZoneMinder
  docs: https://github.com/zoneminder-containers/zoneminder-base
  scalable: false
  primary_service: zoneminder
  architectures:
  - amd64
  - arm64
  web:
    service: zoneminder
    scheme: http
    port: 80
  options:
    DB_ROOT_PASSWORD:
      label: Database root password
      help: Use Generate. Root password of the MariaDB service inside this app. Keep it unchanged after the
        first start.
      type: password
    DB_PASSWORD:
      label: Database password
      help: Use Generate. Password of the zmuser database account. Keep it unchanged after the first start.
      type: password
    TZ:
      label: Tz
      help: IANA time zone for camera footage and logs.
    PORT:
      label: Web port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Camera media
      help: Select This host. Stores recordings and camera data. Include this folder in a stopped Nex
        backup.
    CONFIG:
      label: Camera settings
      help: Select This host. Stores application configuration. Include this folder in a stopped Nex backup.
    LOGS:
      label: Recorder logs
      help: Select This host. Stores application logs. Include this folder in a stopped Nex backup.
    DB_DATA:
      label: Database data
      help: Select This host. Stores the MariaDB database. Include this folder in a stopped Nex backup.
services:
  zoneminder:
    image: ghcr.io/zoneminder-containers/zoneminder-base:latest
    environment:
      MYSQL_HOST: db
      MYSQL_USER: zmuser
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-Etc/UTC}
    ports:
    - ${PORT:-80}:80/tcp
    volumes:
    - ${DATA}:/data
    - ${CONFIG}:/config
    - ${LOGS}:/log
    tmpfs:
    - /dev/shm:size=1000000000
    stop_grace_period: 45s
    deploy:
      replicas: 1
  db:
    image: docker.io/library/mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: zm
      MARIADB_USER: zmuser
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: '1'
    volumes:
    - ${DB_DATA}:/var/lib/mysql
    deploy:
      replicas: 1
