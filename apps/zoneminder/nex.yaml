x-nex:
  name: ZoneMinder
  summary: Monitor and record network video cameras
  description: Prepare MariaDB and a dedicated ZoneMinder database. Configure network cameras and user
    permissions from the web interface on a trusted network.
  category: home-automation
  website: https://www.zoneminder.com/
  source: https://github.com/ZoneMinder/ZoneMinder
  docs: https://github.com/zoneminder-containers/zoneminder-base
  scalable: false
  primary_service: zoneminder
  architectures:
  - amd64
  - arm64
  web:
    service: zoneminder
    scheme: http
    port: 80
  works_with:
  - mariadb
  options:
    DB_HOST:
      label: Database host
      help: Host or Nex application name of the prepared database service. It must be reachable on internal
        port 3306.
    DB_USER:
      label: Database user
      help: Create a dedicated non-root database user for this application.
    DB_NAME:
      label: Database name
      help: Create a database owned by the configured user first. The default is zm.
    DB_PASSWORD:
      label: Database password
      help: Password for the dedicated database account.
      type: password
    TZ:
      label: Tz
      help: IANA time zone for camera footage and logs.
    PORT:
      label: Web port
      help: Host-published HTTP port when publishing is enabled. With a dedicated Primary network, use
        the application address on port 80.
    DATA:
      label: Camera media
      help: Select This host. Stores recordings and camera data. Include this folder in a stopped Nex
        backup.
    CONFIG:
      label: Camera settings
      help: Select This host. Stores application configuration. Include this folder in a stopped Nex backup.
    LOGS:
      label: Recorder logs
      help: Select This host. Stores application logs. Include this folder in a stopped Nex backup.
services:
  zoneminder:
    image: ghcr.io/zoneminder-containers/zoneminder-base:latest
    environment:
      MYSQL_HOST: ${DB_HOST}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-zm}
      TZ: ${TZ:-Etc/UTC}
    ports:
    - ${PORT:-8895}:80/tcp
    volumes:
    - ${DATA}:/data
    - ${CONFIG}:/config
    - ${LOGS}:/log
    tmpfs:
    - /dev/shm:size=1000000000
    stop_grace_period: 45s
    deploy:
      replicas: 1
