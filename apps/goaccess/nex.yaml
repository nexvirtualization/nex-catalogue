x-nex:
  name: GoAccess
  summary: Read web-server access logs in a live report
  description: >-
    GoAccess reads access.log in COMBINED format from the Logs folder. Select the folder an application
    you administer writes its access log to; if no access.log exists yet, an empty one is created on
    first start and the report fills in as lines arrive. The report folder receives index.html. Serve
    that file through a separate web server and configure the report to reach the WebSocket port.
  category: monitoring
  website: https://github.com/allinurl/goaccess
  source: https://github.com/allinurl/goaccess
  docs: https://goaccess.io/get-started
  primary_service: goaccess
  scalable: false
  license: MIT
  options:
    LOGS:
      label: Access logs
      help: Folder holding access.log in COMBINED format. Configure the web server to write its access log
        there. An empty access.log is created on first start if the folder has none.
    REPORT:
      label: Generated report
      help: Keep generated report in this managed folder between restarts.
    PORT:
      label: Service port
      help: The app listens on TCP port 7890 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  goaccess:
    image: docker.io/allinurl/goaccess:latest
    entrypoint:
    - /bin/sh
    - -ec
    - |
      [ -e /srv/logs/access.log ] || : > /srv/logs/access.log
      exec /usr/bin/goaccess /srv/logs/access.log --log-format=COMBINED --real-time-html --port=7890 -o /srv/report/index.html
    volumes:
    - ${LOGS}:/srv/logs
    - ${REPORT}:/srv/report
    ports:
    - ${PORT:-7890}:7890/tcp
    deploy:
      replicas: 1
