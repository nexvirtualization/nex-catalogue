# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: LocalAI
  summary: Run an OpenAI-compatible model API locally
  description: This image runs inference on CPU and stores model downloads in a managed folder. Model memory
    requirements vary.
  category: ai
  website: https://localai.io/
  source: https://github.com/mudler/LocalAI
  docs: https://localai.io/basics/getting_started/
  primary_service: localai
  post_install: Open the UI on a trusted network and install a model suitable for the host. Then configure
    a client to use the Nex application address.
  license: MIT
  architectures:
  - amd64
  - arm64
  web:
    port: 8080
  options:
    API_KEY:
      label: API key
      help: Require this key on model API requests.
      type: password
    PORT:
      label: HTTP port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
    MODELS:
      label: Local models
      help: Managed directory mounted at /models. Choose storage writable by the application.
services:
  localai:
    image: docker.io/localai/localai:latest
    ports:
    - ${PORT:-8080}:8080/tcp
    volumes:
    - ${MODELS}:/models
    environment:
      LOCALAI_API_KEY: ${API_KEY}
    deploy:
      replicas: 1
