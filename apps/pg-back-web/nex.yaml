# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: PG Back Web
  summary: Schedule and restore PostgreSQL backups
  description: Prepare a separate PostgreSQL database for the backup scheduler’s metadata. Set the encryption
    key and keep it with the backups. Configure target databases and destinations in the web UI.
  category: development
  website: https://github.com/eduardolat/pgbackweb
  source: https://github.com/eduardolat/pgbackweb
  docs: https://github.com/eduardolat/pgbackweb#readme
  scalable: false
  primary_service: pg-back-web
  architectures:
  - amd64
  - arm64
  web:
    service: pg-back-web
    scheme: http
    port: 8085
  works_with:
  - postgresql
  options:
    DATABASE_URL:
      label: Database connection string
      help: Create the database and its dedicated user first. Supply a complete PostgreSQL URI with a
        percent-encoded password. Nex applications can use the database app connection name and port 5432.
      type: password
    ENCRYPTION_KEY:
      label: Backup encryption key
      help: Use Generate to create a unique secret for this installation.
      type: password
    PORT:
      label: Web port
      help: Host-published HTTP port when publishing is enabled. With a dedicated Primary network, use
        the application address on port 8085.
    DATA:
      label: Local backups
      help: Select This host. Choose managed storage appropriate for the backup retention policy. Include
        this folder in a stopped Nex backup.
services:
  pg-back-web:
    image: eduardolat/pgbackweb:latest
    environment:
      PBW_POSTGRES_CONN_STRING: ${DATABASE_URL}
      PBW_ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    ports:
    - ${PORT:-8461}:8085/tcp
    volumes:
    - ${DATA}:/backups
    deploy:
      replicas: 1
