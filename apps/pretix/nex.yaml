# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Pretix
  summary: Manage event registration and ticketing
  description: Provision PostgreSQL and Redis, prepare pretix.cfg in Configuration, and follow the upstream
    first-run administrator setup. Use HTTPS at the client-facing endpoint.
  category: productivity
  website: https://pretix.eu/
  source: https://github.com/pretix/pretix
  docs: https://docs.pretix.eu/self-hosting/installation/docker_smallscale.html
  primary_service: pretix
  post_install: Provision PostgreSQL and Redis, prepare pretix.cfg in Configuration, and follow the upstream
    first-run administrator setup. Use HTTPS at the client-facing endpoint.
  license: AGPL-3.0
  architectures:
  - amd64
  web:
    port: 80
  options:
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 80 inside Nex.
    CONFIG:
      label: Prepared Pretix configuration
      help: Managed directory mounted at /etc/pretix. Choose storage readable by the application.
    DATA:
      label: Pretix files
      help: Managed directory mounted at /data. Choose storage writable by the application.
services:
  pretix:
    image: docker.io/pretix/standalone:stable
    ports:
    - ${PORT:-23589}:80/tcp
    volumes:
    - ${CONFIG}:/etc/pretix:ro
    - ${DATA}:/data
    deploy:
      replicas: 1
