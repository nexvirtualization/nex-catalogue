# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Pretix
  summary: Manage event registration and ticketing
  description: Provision PostgreSQL and Redis, prepare pretix.cfg in Configuration, and follow the upstream
    first-run administrator setup. Use HTTPS at the client-facing endpoint.
  category: productivity
  website: https://pretix.eu/
  source: https://github.com/pretix/pretix
  docs: https://docs.pretix.eu/self-hosting/installation/docker_smallscale.html
  primary_service: pretix
  post_install: Provision PostgreSQL and Redis, prepare pretix.cfg in Configuration, and follow the upstream
    first-run administrator setup. Use HTTPS at the client-facing endpoint.
  license: AGPL-3.0
  architectures:
  - amd64
  web:
    port: 80
  options:
    PUBLIC_URL:
      label: Public address
      help: Full address people use to open Pretix, such as https://tickets.example.com. Pretix answers
        only requests addressed to this host name and rejects others as a bad request. Put an HTTPS
        reverse proxy in front for internet access.
    PORT:
      label: HTTP port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
    CONFIG:
      label: Prepared Pretix configuration
      help: Managed directory mounted at /etc/pretix. Choose storage readable by the application.
    DATA:
      label: Pretix files
      help: Managed directory mounted at /data. Choose storage writable by the application.
services:
  pretix:
    image: docker.io/pretix/standalone:stable
    environment:
      PRETIX_PRETIX_URL: ${PUBLIC_URL}
    # The image starts supervisord through sudo, which Nex refuses (no-new-privileges). Start it as root
    # here instead: it runs nginx, and migrations and the Pretix workers run as the image user.
    user: 0:0
    entrypoint:
    - /bin/sh
    - -ec
    - |
      cd /pretix/src
      export DJANGO_SETTINGS_MODULE=production_settings DATA_DIR=/data/ HOME=/pretix
      mkdir -p /data/logs /data/media
      chown -R 15371:15371 /data
      setpriv --reuid=15371 --regid=15371 --init-groups python3 -m pretix migrate --noinput
      AUTOMIGRATE=skip exec /usr/bin/supervisord -n -c /etc/supervisord.all.conf
    ports:
    - ${PORT:-80}:80/tcp
    volumes:
    - ${CONFIG}:/etc/pretix:ro
    - ${DATA}:/data
    deploy:
      replicas: 1
