x-nex:
  name: Viseron
  summary: Record security cameras with local video processing
  description: Use the CPU profile with network cameras. Open the configuration editor to set up camera
    streams and user access. Keep the direct listener on a trusted network.
  category: home-automation
  website: https://viseron.netlify.app/
  source: https://github.com/roflcoopter/viseron
  docs: https://viseron.netlify.app/docs/documentation/installation/
  scalable: false
  primary_service: viseron
  architectures:
  - amd64
  - arm64
  web:
    service: viseron
    scheme: http
    port: 8888
  options:
    TZ:
      label: Tz
      help: IANA time zone for recordings.
    PORT:
      label: Web port
      help: The app listens on TCP port 8888 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Camera and application configuration
      help: Select This host. Stores Viseron configuration and database. Include this folder in a stopped
        Nex backup.
    RECORDINGS:
      label: Recordings
      help: Select This host. Stores recorded camera video. Include this folder in a stopped Nex backup.
    SNAPSHOTS:
      label: Snapshots
      help: Select This host. Stores camera snapshots. Include this folder in a stopped Nex backup.
    SEGMENTS:
      label: Video segments
      help: Select This host. Stores recording segments. Include this folder in a stopped Nex backup.
    THUMBNAILS:
      label: Thumbnails
      help: Select This host. Stores generated image thumbnails. Include this folder in a stopped Nex
        backup.
    CLIPS:
      label: Event clips
      help: Select This host. Stores saved event video. Include this folder in a stopped Nex backup.
services:
  viseron:
    image: roflcoopter/viseron:latest
    environment:
      TZ: ${TZ:-Etc/UTC}
    ports:
    - ${PORT:-8888}:8888/tcp
    volumes:
    - ${DATA}:/config
    - ${RECORDINGS}:/recordings
    - ${SNAPSHOTS}:/snapshots
    - ${SEGMENTS}:/segments
    - ${THUMBNAILS}:/thumbnails
    - ${CLIPS}:/event_clips
    tmpfs:
    - /dev/shm:size=536870912
    deploy:
      replicas: 1
