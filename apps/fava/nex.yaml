# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Fava
  summary: Web frontend of Beancount, a text based double-entry accounting system
  description: Web frontend of Beancount, a text based double-entry accounting system.
  category: finance
  source: https://github.com/beancount/fava
  website: https://beancount.github.io/fava/
  docs: https://hub.docker.com/r/thekevjames/fava
  primary_service: fava
  options:
    LEDGER:
      label: Ledger folder
      help: Choose the Nex-managed folder mounted at /data.
    PORT:
      label: Published 5000/tcp port
      help: Host port for application listener 5000/tcp. Leave host publishing off to use only the assigned
        app address.
  post_install: Place your main ledger at /data/index.beancount before you install. The web interface holds
    private financial data. Use a dedicated trusted network or put it behind an authenticating proxy.
  web:
    port: 5000
services:
  fava:
    image: docker.io/thekevjames/fava:latest
    deploy:
      replicas: 1
    volumes:
    - ${LEDGER}:/data
    ports:
    - ${PORT:-19948}:5000/tcp
    command:
    - /data/index.beancount
