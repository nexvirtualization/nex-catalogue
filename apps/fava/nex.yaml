# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Fava
  summary: Web frontend of Beancount, a text based double-entry accounting system
  description: Web frontend of Beancount, a text based double-entry accounting system.
  category: finance
  source: https://github.com/beancount/fava
  website: https://beancount.github.io/fava/
  docs: https://hub.docker.com/r/thekevjames/fava
  primary_service: fava
  options:
    LEDGER:
      label: Ledger folder
      help: Before installing, put a readable index.beancount at the root of the folder mounted at /data.
    PORT:
      label: Port 5000/tcp
      help: The app listens on TCP port 5000 on its default Docker network. Nex does not publish it on host
        addresses.
  post_install: The web interface holds private financial data. Use a dedicated trusted network or put it
    behind an authenticating proxy.
  web:
    port: 5000
services:
  fava:
    image: docker.io/thekevjames/fava:latest
    deploy:
      replicas: 1
    volumes:
    - ${LEDGER}:/data
    ports:
    - ${PORT:-5000}:5000/tcp
    command:
    - /data/index.beancount
