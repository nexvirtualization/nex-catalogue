# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Beaver Habit Tracker
  summary: Track and review your daily habits
  description: Open the application on a trusted network and register your own account. The package uses
    local user files. Add authenticated HTTPS access before sharing the service over an untrusted network.
  category: productivity
  website: https://github.com/daya0576/beaverhabits
  source: https://github.com/daya0576/beaverhabits
  docs: https://github.com/daya0576/beaverhabits/wiki/Environment-variables
  scalable: false
  primary_service: beaver-habit-tracker
  architectures:
  - amd64
  - arm64
  web:
    service: beaver-habit-tracker
    scheme: http
    port: 8080
  options:
    PORT:
      label: Web port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Habit data
      help: Select This host. Holds habit files and local account data. Include this folder in a stopped
        Nex backup.
services:
  beaver-habit-tracker:
    image: daya0576/beaverhabits:latest
    user: "0:0"
    entrypoint: [/bin/sh, -ec]
    command:
    - |
      chown -h nobody:nogroup /app/.user
      exec setpriv --reuid=nobody --regid=nogroup --clear-groups --no-new-privs sh /app/start.sh prd
    environment:
      HABITS_STORAGE: USER_DISK
      GUNICORN_CMD_ARGS: --control-socket /tmp/gunicorn.ctl
    ports:
    - ${PORT:-8080}:8080/tcp
    volumes:
    - ${DATA}:/app/.user
    deploy:
      replicas: 1
