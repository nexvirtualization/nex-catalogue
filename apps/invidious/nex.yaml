# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Invidious
  summary: Browse videos through the Invidious web interface
  description: Provision PostgreSQL with the Invidious schema and configure a compatible Invidious Companion.
    Place config.yml in Configuration with both connection settings and expose the browser endpoint via HTTPS.
  category: media
  website: https://github.com/iv-org/invidious
  source: https://github.com/iv-org/invidious
  docs: https://docs.invidious.io/installation/
  primary_service: invidious
  post_install: Provision PostgreSQL with the Invidious schema and configure a compatible Invidious Companion.
    Place config.yml in Configuration with both connection settings and expose the browser endpoint via HTTPS.
  license: AGPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 3000
  options:
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 3000 inside Nex.
    CONFIG:
      label: Prepared Invidious configuration
      help: Managed directory mounted at /invidious/config. Choose storage readable by the application.
services:
  invidious:
    image: quay.io/invidious/invidious:latest
    ports:
    - ${PORT:-23481}:3000/tcp
    volumes:
    - ${CONFIG}:/invidious/config:ro
    deploy:
      replicas: 1
