# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Flyimg
  summary: Resize and encode images through an HTTP service
  description: Transform and optimize images on demand. This package requires a prepared Flyimg parameters.yml
    so you can limit allowed image sources before the HTTP service starts.
  category: development
  website: https://flyimg.io
  source: https://github.com/flyimg/flyimg
  docs: https://docs.flyimg.io/install/
  license: AGPL-3.0
  primary_service: flyimg
  architectures:
  - amd64
  - arm64
  post_install: If the folder was created during install, upload parameters.yml under Files → Prepared configuration,
    then restart Flyimg. Start from the upstream parameters.yml, enable restricted_domains and set whitelist_domains
    to hostnames you control. Keep the service accessible only to trusted callers.
  web:
    port: 80
  options:
    CONFIG:
      label: Prepared configuration
      help: Choose a folder containing a complete, readable Flyimg parameters.yml. An empty folder prevents startup.
    PORT:
      label: HTTP port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  flyimg:
    image: docker.io/flyimg/flyimg:latest
    ports:
    - ${PORT:-80}:80/tcp
    volumes:
    - ${CONFIG}:/nex-config:ro
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - |
      test -s /nex-config/parameters.yml || { echo 'Provide a non-empty parameters.yml in Prepared configuration.' >&2; exit 1; }
      cp /nex-config/parameters.yml /var/www/html/config/parameters.yml
      exec docker-entrypoint /init
    deploy:
      replicas: 1
