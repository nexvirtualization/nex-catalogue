# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: mame
  summary: Run MAME in a browser-based desktop
  description: The LinuxServer MAME image runs a desktop with managed emulator configuration and ROM storage.
    Hardware acceleration is not required for this profile.
  category: media
  website: https://github.com/mamedev/mame
  source: https://github.com/mamedev/mame
  docs: https://docs.linuxserver.io/images/docker-mame/
  primary_service: mame
  post_install: Open the browser desktop over a trusted HTTPS endpoint. Add your own authorized ROM files
    under the MAME configuration folder.
  license: GNU General Public License v2.0 only
  architectures:
  - amd64
  - arm64
  web:
    port: 3000
  options:
    USER:
      label: Email or login name
      help: Account identifier supplied to the application.
    PASSWORD:
      label: Account password
      help: Choose a strong password for this deployment.
      type: password
    PORT:
      label: HTTP port
      help: The app listens on TCP port 3000 on its default Docker network. Nex does not publish it on host
        addresses.
    CONFIG:
      label: MAME configuration and contents
      help: Managed directory mounted at /config. Choose storage writable by the application.
services:
  mame:
    image: lscr.io/linuxserver/mame:latest
    ports:
    - ${PORT:-3000}:3000/tcp
    volumes:
    - ${CONFIG}:/config
    environment:
      CUSTOM_USER: ${USER:-mame}
      PASSWORD: ${PASSWORD}
    deploy:
      replicas: 1
