# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: DOCAT
  summary: Publish versioned static documentation sites
  description: Put an authenticating reverse proxy in front of the documentation server when publishing
    or browsing private material.
  category: documents
  website: https://github.com/docat-org/docat
  source: https://github.com/docat-org/docat
  docs: https://github.com/docat-org/docat
  primary_service: docat
  scalable: false
  license: MIT
  web:
    port: 80
  options:
    DATA:
      label: Documentation and settings
      help: Keep documentation and settings in this managed folder between restarts.
    PORT:
      label: Web port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  docat:
    image: ghcr.io/docat-org/docat:latest
    volumes:
    - ${DATA}:/var/docat
    ports:
    - ${PORT:-80}:80/tcp
    deploy:
      replicas: 1
