# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Pocket ID
  summary: Sign in to OIDC applications with passkeys
  description: Pocket ID stores identities and passkey registration data in a managed folder. Browser passkeys
    require an HTTPS application URL.
  category: security
  website: https://pocket-id.org/
  source: https://github.com/pocket-id/pocket-id
  docs: https://github.com/pocket-id/pocket-id
  primary_service: pocket-id
  post_install: Route the configured HTTPS URL to the app, then open /setup to create the first administrator
    and register a passkey.
  license: BSD-2-Clause
  architectures:
  - amd64
  - arm64
  web:
    port: 1411
  options:
    APP_URL:
      label: HTTPS application URL
      help: Full public HTTPS origin used for WebAuthn and OIDC redirects.
    ENCRYPTION_KEY:
      label: Encryption key
      help: Use a base64-encoded random 32-byte key and keep it with your backup.
      type: password
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 1411 inside Nex.
    DATA:
      label: Identities and configuration
      help: Managed directory mounted at /app/data. Choose storage writable by the application.
services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:latest
    ports:
    - ${PORT:-20234}:1411/tcp
    volumes:
    - ${DATA}:/app/data
    environment:
      APP_URL: ${APP_URL}
      TRUST_PROXY: 'true'
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    deploy:
      replicas: 1
