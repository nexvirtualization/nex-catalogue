# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Roundcube
  summary: Access an existing email mailbox from a browser
  description: The Roundcube client connects to an existing IMAP and SMTP server. SQLite stores webmail preferences
    and contacts.
  category: communication
  website: https://roundcube.net
  source: https://github.com/roundcube/roundcubemail
  docs: https://github.com/roundcube/roundcubemail-docker
  primary_service: roundcube
  post_install: Use a trusted HTTPS address for sign-in. Sign in with your mailbox credentials and confirm
    both receiving and sending mail.
  license: GPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 80
  options:
    IMAP_HOST:
      label: IMAP server
      help: TLS endpoint for IMAP, such as ssl://mail.example.org.
    SMTP_SERVER:
      label: SMTP server
      help: Submission server, such as tls://mail.example.org.
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 80 inside Nex.
    DB:
      label: Roundcube SQLite database
      help: Managed directory mounted at /var/roundcube/db. Choose storage writable by the application.
services:
  roundcube:
    image: docker.io/roundcube/roundcubemail:latest
    ports:
    - ${PORT:-20222}:80/tcp
    volumes:
    - ${DB}:/var/roundcube/db
    environment:
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_DEFAULT_HOST: ${IMAP_HOST}
      ROUNDCUBEMAIL_SMTP_SERVER: ${SMTP_SERVER}
    deploy:
      replicas: 1
