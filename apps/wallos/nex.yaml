# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Wallos
  summary: Track recurring subscriptions, prices and renewal dates
  description: Create your account before sharing access. Include both folders in a stopped backup.
  category: finance
  website: https://github.com/ellite/wallos
  source: https://github.com/ellite/wallos
  docs: https://github.com/ellite/wallos
  primary_service: wallos
  scalable: false
  license: GPL-3.0
  web:
    port: 80
  options:
    DATABASE:
      label: Subscription database
      help: Wallos SQLite records and settings.
    LOGOS:
      label: Custom logos
      help: Uploaded subscription logos.
    PORT:
      label: Web port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  wallos:
    image: docker.io/bellamy/wallos:latest
    volumes:
    - ${DATABASE}:/var/www/html/db
    - ${LOGOS}:/var/www/html/images/uploads/logos
    ports:
    - ${PORT:-80}:80/tcp
    deploy:
      replicas: 1
