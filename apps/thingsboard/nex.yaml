# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Thingsboard
  summary: Collect and visualize device telemetry
  description: Use the standalone bundled PostgreSQL deployment, then open the dashboards to configure devices.
    Replace upstream sample credentials on a trusted network.
  category: home-automation
  website: https://thingsboard.io/
  source: https://github.com/thingsboard/thingsboard
  docs: https://thingsboard.io/docs/user-guide/install/docker/
  primary_service: thingsboard
  post_install: Use the standalone bundled PostgreSQL deployment, then open the dashboards to configure devices.
    Replace upstream sample credentials on a trusted network.
  license: Apache-2.0
  architectures:
  - amd64
  - arm64
  web:
    port: 9090
  options:
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 9090 inside Nex.
    MQTT_PORT:
      label: Published device MQTT port
      help: Host-published port for the internal 1883/tcp endpoint.
    DATA:
      label: Device and dashboard database
      help: Managed directory mounted at /data. Choose storage writable by the application.
    LOGS:
      label: Application logs
      help: Managed directory mounted at /var/log/thingsboard. Choose storage writable by the application.
services:
  thingsboard:
    image: docker.io/thingsboard/tb-postgres:latest
    ports:
    - ${PORT:-23538}:9090/tcp
    - ${MQTT_PORT:-24538}:1883/tcp
    volumes:
    - ${DATA}:/data
    - ${LOGS}:/var/log/thingsboard
    environment:
      TB_QUEUE_TYPE: in-memory
    deploy:
      replicas: 1
