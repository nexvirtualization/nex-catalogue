x-nex:
  name: Prefect
  summary: Schedule and observe Prefect workflows
  description: Provision PostgreSQL and deploy workers connected to this API. Configure basic authentication
    and HTTPS for access.
  category: development
  website: https://www.prefect.io/
  source: https://github.com/PrefectHQ/prefect
  docs: https://docs.prefect.io/v3/how-to-guides/self-hosted/server-cli
  primary_service: prefect
  post_install: Provision PostgreSQL and deploy workers connected to this API. Configure basic authentication
    and HTTPS for access.
  license: Apache-2.0
  architectures:
  - amd64
  - arm64
  web:
    port: 4200
  options:
    DATABASE_URL:
      label: Database url
      help: 'PostgreSQL connection URL, for example postgresql://user:password@host:5432/prefect. Prefect connects with its asyncpg driver, so a postgresql:// or postgresql+asyncpg:// scheme both work. Percent-encode special characters in credentials.'
      type: password
    AUTH_USER:
      label: Sign-in user
      help: User name for the basic authentication that protects the API and web interface. Leave empty for admin.
    AUTH_SECRET:
      label: Sign-in password
      help: Use Generate. Workers and the Prefect CLI authenticate with the user and password as user:password.
      type: password
    PORT:
      label: HTTP port
      help: The app listens on TCP port 4200 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  prefect:
    image: docker.io/prefecthq/prefect:3-latest
    ports:
    - ${PORT:-4200}:4200/tcp
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL}
      PREFECT_SERVER_API_AUTH_STRING: ${AUTH_USER:-admin}:${AUTH_SECRET}
    command:
    - /bin/sh
    - -ec
    - |
      case "$$DATABASE_URL" in
        postgresql://*) DATABASE_URL="postgresql+asyncpg://$${DATABASE_URL#postgresql://}" ;;
        postgres://*) DATABASE_URL="postgresql+asyncpg://$${DATABASE_URL#postgres://}" ;;
      esac
      export PREFECT_API_DATABASE_CONNECTION_URL="$$DATABASE_URL"
      exec prefect server start --host 0.0.0.0
    deploy:
      replicas: 1
