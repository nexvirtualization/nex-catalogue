# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Mere Medical
  summary: Organize and sync your personal health records
  description: Keep health records on an HTTPS endpoint restricted to your own account. Prepare the
    app key using the upstream setup utility and configure the authorized patient portal accounts you
    need.
  category: productivity
  website: https://github.com/cfu288/mere-medical
  source: https://github.com/cfu288/mere-medical
  docs: https://github.com/cfu288/mere-medical
  primary_service: mere-medical
  scalable: false
  license: MIT
  web:
    port: 8080
  options:
    APP_KEY:
      label: Mere application key
      type: password
      help: Provide an app key generated by the upstream utility.
    PUBLIC_URL:
      label: Public web address
      help: Full browser-facing URL, including scheme and any port.
    PORT:
      label: Web port
      help: Host-published TCP port. With a dedicated Primary network and host publishing off, use the
        application address on port 8080.
services:
  mere-medical:
    image: docker.io/cfu288/mere-medical:latest
    environment:
      ALLOW_PUBLIC_CONFIDENTIAL_CLIENTS: 'false'
      APP_KEY: ${APP_KEY}
      PUBLIC_URL: ${PUBLIC_URL}
    ports:
    - ${PORT:-8080}:8080/tcp
    deploy:
      replicas: 1
