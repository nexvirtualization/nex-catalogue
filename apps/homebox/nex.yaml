# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Homebox
  summary: Track household inventory, serial numbers and receipts
  description: Create an account on a trusted network. Review registration settings before you share
    access.
  category: management
  website: https://github.com/sysadminsmedia/homebox
  source: https://github.com/sysadminsmedia/homebox
  docs: https://homebox.software/en/quick-start/
  primary_service: homebox
  scalable: false
  license: AGPL-3.0
  web:
    port: 7745
  options:
    API_KEY_PEPPER:
      label: API key pepper
      type: password
      generate: {format: alnum, length: 32, min_length: 32}
      help: Use Generate, which makes 32 letters and digits. It must be at least 32 characters. If Generate
        gives only 24 characters (older Nex), paste the output of openssl rand -hex 32 instead. Keep it with
        your backups; changing it invalidates issued API keys.
    DATA:
      label: Inventory data
      help: Homebox records and attachments. Stop the app before copying the SQLite data.
    PORT:
      label: Web port
      help: The app listens on TCP port 7745 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:latest
    environment:
      HBOX_AUTH_API_KEY_PEPPER: ${API_KEY_PEPPER}
    volumes:
    - ${DATA}:/data
    ports:
    - ${PORT:-7745}:7745/tcp
    deploy:
      replicas: 1
