# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: OneDev
  summary: All-In-One DevOps Platform
  description: All-In-One DevOps Platform. With Git Management, Issue Tracking, and CI/CD. Simple yet Powerful.
  category: development
  source: https://github.com/theonedev/onedev
  website: https://onedev.io/
  docs: https://docs.onedev.io/installation-guide/run-as-docker-container
  primary_service: onedev
  options:
    DATA:
      label: Data folder
      help: Choose the Nex-managed folder mounted at /opt/onedev.
    PORT:
      label: Published 6610/tcp port
      help: Host port for application listener 6610/tcp. Leave host publishing off to use only the assigned
        app address.
  post_install: Finish the initial setup and configure the external URL. Configure remote build agents separately
    as this package does not mount the Docker socket.
  web:
    port: 6610
services:
  onedev:
    image: docker.io/1dev/server:latest
    deploy:
      replicas: 1
    volumes:
    - ${DATA}:/opt/onedev
    ports:
    - ${PORT:-19765}:6610/tcp
