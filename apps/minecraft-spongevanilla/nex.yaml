# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Minecraft SpongeVanilla
  summary: Run a Minecraft Java server for Sponge plugins
  description: >-
    Keep the server folders on This host and choose a registered primary network that players can
    reach. Join using the app’s Primary address on TCP 25565 in Java Edition. Uses the standalone
    SpongeVanilla release candidate for Minecraft 26.3 and Sponge API 21. Use plugins that target
    this API. Make a stopped backup before applying updates.
  category: games
  website: https://www.spongepowered.org/
  source: https://github.com/itzg/docker-minecraft-server
  docs: https://docs.spongepowered.org/stable/en/server/getting-started/implementations/spongevanilla.html
  license: Minecraft EULA and upstream server license
  architectures: [amd64, arm64, riscv64]
  tags: [minecraft, sandbox]
  options:
    EULA:
      label: Accept the Minecraft EULA
      type: bool
      help: >-
        Read https://www.minecraft.net/eula and turn this on to start the server.
    PLAYERS:
      label: Allowed Java players
      help: >-
        Comma-separated Java Edition usernames. Edit this list in Nex to grant or revoke access.
    DATA:
      label: World, extensions and settings
      help: >-
        Choose This host and include this folder in stopped backups.
services:
  minecraft-spongevanilla:
    image: ghcr.io/itzg/minecraft-server:latest
    environment:
      EULA: ${EULA}
      TYPE: CUSTOM
      MEMORY: 3G
      ENABLE_RCON: 'false'
      ONLINE_MODE: 'true'
      ENABLE_WHITELIST: 'true'
      ENFORCE_WHITELIST: 'true'
      EXISTING_WHITELIST_FILE: SYNCHRONIZE
      WHITELIST: ${PLAYERS}
      VERSION: '26.3'
      CUSTOM_SERVER: https://repo.spongepowered.org/repository/maven-releases/org/spongepowered/spongevanilla/26.3-21.0.0-RC2792/spongevanilla-26.3-21.0.0-RC2792-universal.jar
      FAMILY: SPONGE
    expose:
      - 25565/tcp
    volumes:
      - ${DATA}:/data
    stop_grace_period: 90s
    deploy:
      replicas: 1
    healthcheck:
      start_period: 15m
