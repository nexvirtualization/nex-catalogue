x-nex:
  name: VueTorrent
  summary: Use VueTorrent as the qBittorrent web interface
  description: This profile runs the LinuxServer qBittorrent image with the upstream VueTorrent Docker mod.
    App data and files are kept in managed storage.
  category: downloads
  website: https://vuetorrent.github.io/demo
  source: https://github.com/VueTorrent/VueTorrent
  docs: https://github.com/VueTorrent/VueTorrent/wiki/Installation
  primary_service: vuetorrent
  post_install: Use the temporary login shown in the logs and change the initial password. Enable the alternative
    Web UI in qBittorrent settings using the upstream VueTorrent directory.
  license: GPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 8080
  options:
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 8080 inside Nex.
    CONFIG:
      label: qBittorrent settings
      help: Managed directory mounted at /config. Choose storage writable by the application.
    DOWNLOADS:
      label: Download storage
      help: Managed directory mounted at /downloads. Choose storage writable by the application.
services:
  vuetorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    ports:
    - ${PORT:-20263}:8080/tcp
    volumes:
    - ${CONFIG}:/config
    - ${DOWNLOADS}:/downloads
    environment:
      DOCKER_MODS: ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
      WEBUI_PORT: '8080'
    deploy:
      replicas: 1
