# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Yopass
  summary: Share secrets with expiring, encrypted links
  description: Place the application behind an HTTPS reverse proxy before sharing secret links. The packaged
    Memcached companion keeps ciphertext temporarily on the private app network. Restarting it clears
    pending shares.
  category: security
  website: https://github.com/jhaals/yopass
  source: https://github.com/jhaals/yopass
  docs: https://yopass.se/docs/quickstart
  scalable: false
  primary_service: yopass
  architectures:
  - amd64
  - arm64
  web:
    service: yopass
    scheme: http
    port: 1337
  options:
    PORT:
      label: Web port
      help: The app listens on TCP port 1337 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  yopass:
    image: jhaals/yopass:latest
    command:
    - --memcached=cache:11211
    ports:
    - ${PORT:-1337}:1337/tcp
    deploy:
      replicas: 1
  cache:
    image: memcached:latest
    deploy:
      replicas: 1
