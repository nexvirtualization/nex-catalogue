# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Heimdall
  summary: Create a launch page for applications and bookmarks
  description: Set access controls in Heimdall or use an authenticating HTTPS proxy when needed.
  category: management
  website: https://github.com/linuxserver/Heimdall
  source: https://github.com/linuxserver/Heimdall
  docs: https://docs.linuxserver.io/images/docker-heimdall/
  primary_service: heimdall
  scalable: false
  license: MIT
  web:
    port: 80
  options:
    CONFIG:
      label: Dashboard configuration
      help: Heimdall settings and application tiles.
    PORT:
      label: Web port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  heimdall:
    image: lscr.io/linuxserver/heimdall:latest
    environment:
      PUID: '1000'
      PGID: '1000'
    volumes:
    - ${CONFIG}:/config
    ports:
    - ${PORT:-80}:80/tcp
    deploy:
      replicas: 1
