# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: LinkAce
  summary: Archive and organize bookmark collections
  description: Provision an external MariaDB database and finish LinkAce setup on a trusted network.
    Use an existing application key when restoring an installation.
  category: reading
  website: https://github.com/Kovah/LinkAce/
  source: https://github.com/Kovah/LinkAce/
  docs: https://www.linkace.org/docs/v2/setup/setup-with-docker/
  primary_service: linkace
  scalable: false
  license: GPL-3.0
  web:
    port: 80
  options:
    DB_HOST:
      label: Database hostname
      help: Reachable MariaDB server.
    DB_DATABASE:
      label: Database name
      help: Prepared LinkAce database.
    DB_USERNAME:
      label: Database username
      help: Dedicated MariaDB user.
    DB_PASSWORD:
      label: Database password
      type: password
      help: Password of the chosen database user.
    APP_KEY:
      label: Laravel application key
      type: password
      help: 'Supply base64: followed by the base64-encoded value of 32 random bytes.'
    PUBLIC_URL:
      label: Public web address
      help: Full browser-facing URL, including scheme and any port.
    BACKUPS:
      label: Bookmark backups
      help: Keep bookmark backups in this managed folder between restarts.
    PORT:
      label: Web port
      help: Host-published TCP port. With a dedicated Primary network and host publishing off, use the
        application address on port 80.
services:
  linkace:
    image: docker.io/linkace/linkace:latest
    environment:
      APP_ENV: production
      DB_CONNECTION: mysql
      APP_DEBUG: 'false'
      APP_SETUP_COMPLETED: 'false'
      DB_HOST: ${DB_HOST}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_KEY: ${APP_KEY}
      APP_URL: ${PUBLIC_URL}
    volumes:
    - ${BACKUPS}:/app/storage/app/backups
    ports:
    - ${PORT:-80}:80/tcp
    deploy:
      replicas: 1
