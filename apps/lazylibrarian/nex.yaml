# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: LazyLibrarian
  summary: Organize and automate an ebook and audiobook library
  description: LazyLibrarian stores its settings in a managed folder and connects to your media and downloads
    directories.
  category: reading
  website: https://gitlab.com/LazyLibrarian/LazyLibrarian
  source: https://gitlab.com/LazyLibrarian/LazyLibrarian
  docs: https://docs.linuxserver.io/images/docker-lazylibrarian/
  primary_service: lazylibrarian
  post_install: Set up authentication and metadata sources in the web UI. Configure /books and /downloads
    to match the selected folders.
  architectures:
  - amd64
  - arm64
  web:
    port: 5299
  options:
    PORT:
      label: HTTP port
      help: The app listens on TCP port 5299 on its default Docker network. Nex does not publish it on host
        addresses.
    CONFIG:
      label: LazyLibrarian settings
      help: Managed directory mounted at /config. Choose storage writable by the application.
    BOOKS:
      label: Book library
      help: Managed directory mounted at /books. Choose storage writable by the application.
    DOWNLOADS:
      label: Downloads
      help: Managed directory mounted at /downloads. Choose storage writable by the application.
services:
  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:latest
    ports:
    - ${PORT:-5299}:5299/tcp
    volumes:
    - ${CONFIG}:/config
    - ${BOOKS}:/books
    - ${DOWNLOADS}:/downloads
    deploy:
      replicas: 1
