# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Strapi
  summary: Create and publish structured content in Strapi
  description: Create an empty PostgreSQL database and dedicated role. Back up the database, content configuration
    and uploads together.
  category: development
  website: https://strapi.io/
  source: https://github.com/strapi/strapi
  docs: https://github.com/elestio-examples/strapi
  primary_service: strapi
  post_install: Create an empty PostgreSQL database and dedicated role. Back up the database, content configuration
    and uploads together.
  license: MIT Expat core; enterprise features separately licensed
  architectures:
  - amd64
  - arm64
  web:
    port: 1337
  options:
    DB_HOST:
      label: Db host
      help: Hostname or Nex connection name of the database service.
    DB_PORT:
      label: Db port
      help: Enter the deployment value described in the upstream setup guide.
    DB_NAME:
      label: Db name
      help: Enter the deployment value described in the upstream setup guide.
    DB_USER:
      label: Db user
      help: Enter the deployment value described in the upstream setup guide.
    DB_PASSWORD:
      label: Db password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    JWT_SECRET:
      label: Jwt secret
      help: Use the credential or secret required by the upstream configuration.
      type: password
    ADMIN_JWT_SECRET:
      label: Admin jwt secret
      help: Use the credential or secret required by the upstream configuration.
      type: password
    APP_KEYS:
      label: App keys
      help: Use the credential or secret required by the upstream configuration.
      type: password
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 1337 inside Nex.
    CONFIG:
      label: Strapi configuration
      help: Managed directory mounted at /opt/app/config. Choose storage writable by the application.
    SOURCE:
      label: Content definitions
      help: Managed directory mounted at /opt/app/src. Choose storage writable by the application.
    MEDIA:
      label: Uploaded media
      help: Managed directory mounted at /opt/app/public/uploads. Choose storage writable by the application.
services:
  strapi:
    image: docker.io/elestio/strapi-production:v5.33.0
    ports:
    - ${PORT:-23485}:1337/tcp
    volumes:
    - ${CONFIG}:/opt/app/config
    - ${SOURCE}:/opt/app/src
    - ${MEDIA}:/opt/app/public/uploads
    environment:
      NODE_ENV: production
      STRAPI_TELEMETRY_DISABLED: 'true'
      DATABASE_CLIENT: postgres
      DATABASE_HOST: ${DB_HOST}
      DATABASE_PORT: ${DB_PORT:-5432}
      DATABASE_NAME: ${DB_NAME:-strapi}
      DATABASE_USERNAME: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      APP_KEYS: ${APP_KEYS}
    deploy:
      replicas: 1
