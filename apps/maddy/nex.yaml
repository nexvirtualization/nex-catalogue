# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Maddy Mail Server
  summary: All-in-one mail server that implements SMTP (both MTA and MX) and IMAP
  description: >-
    All-in-one mail server that implements SMTP (both MTA and MX) and IMAP. Replaces Postfix, Dovecot,
    OpenDKIM, OpenSPF, OpenDMARC with single daemon. On first start it writes the standard single-domain
    maddy.conf into the data folder if there is none, and never overwrites one you edited. If fullchain.pem and
    privkey.pem are missing from the tls folder, the certificate line is switched to a self-signed
    certificate so the server starts. Mail clients and other servers do not trust it: put your real certificate
    in tls/ and set the line back to tls file in maddy.conf before real use. Enter a first account in the form
    to log in right away.
  category: communication
  source: https://github.com/foxcpp/maddy
  website: https://maddy.email/
  docs: https://maddy.email/tutorials/setting-up/
  primary_service: maddy
  options:
    MAIL_HOSTNAME:
      label: Mail hostname
      help: Name other servers connect to, such as mx.example.com. It must match your MX and reverse DNS records.
    MAIL_DOMAIN:
      label: Mail domain
      help: Domain of your addresses, such as example.com.
    MAIL_ACCOUNT:
      label: First account
      help: Address of an account to create on first start, such as me@example.com. Leave empty to use postmaster
        at the mail domain. Used only when a password is also set.
    MAIL_PASSWORD:
      label: First account password
      type: password
      help: Use Generate or enter a password. Leave empty to create no account. Add more accounts later
        with the maddy creds and imap-acct commands.
    DATA:
      label: Data folder
      help: Nex-managed folder mounted at /data. It holds maddy.conf, the mail and account databases, DKIM
        keys and tls/. Include it in backups.
    PORT:
      label: Port 25/tcp
      help: The app listens on TCP port 25 on its default Docker network. Nex does not publish it on host
        addresses.
    PORT_2:
      label: Port 465/tcp
      help: The app listens on TCP port 465 on its default Docker network. Nex does not publish it on host
        addresses.
    PORT_3:
      label: Port 587/tcp
      help: The app listens on TCP port 587 on its default Docker network. Nex does not publish it on host
        addresses.
    PORT_4:
      label: Port 993/tcp
      help: The app listens on TCP port 993 on its default Docker network. Nex does not publish it on host
        addresses.
  post_install: Publish the DKIM record from dkim_keys/ in the data folder and set up MX, SPF and reverse DNS
    records according to the upstream guide. Replace the self-signed certificate with your own in tls/ and
    maddy.conf. Use a dedicated primary IP for standard mail ports and leave the data folder private.
services:
  maddy:
    image: docker.io/foxcpp/maddy:latest
    entrypoint:
    - /bin/sh
    - -ec
    - |
      cd /data
      if [ ! -f maddy.conf ]; then
        cat > maddy.conf <<'CONF'
      tls file /data/tls/fullchain.pem /data/tls/privkey.pem

      $$(hostname) = {env:MADDY_HOSTNAME}
      $$(primary_domain) = {env:MADDY_DOMAIN}
      $$(local_domains) = $$(primary_domain)

      hostname $$(hostname)

      auth.pass_table local_authdb {
        table sql_table {
          driver sqlite3
          dsn credentials.db
          table_name passwords
        }
      }

      storage.imapsql local_mailboxes {
        driver sqlite3
        dsn imapsql.db
      }

      table.chain local_rewrites {
        optional_step regexp "(.+)\+(.+)@(.+)" "$$1@$$3"
        optional_step static {
          entry postmaster postmaster@$$(primary_domain)
        }
        optional_step file /etc/maddy/aliases
      }

      msgpipeline local_routing {
        destination postmaster $$(local_domains) {
          modify {
            replace_rcpt &local_rewrites
          }
          deliver_to &local_mailboxes
        }
        default_destination {
          reject 550 5.1.1 "User doesn't exist"
        }
      }

      smtp tcp://0.0.0.0:25 {
        limits {
          all rate 20 1s
          all concurrency 10
        }
        dmarc yes
        dmarc_reject_invalid_from yes
        check {
          require_mx_record
          dkim
          spf
        }
        source $$(local_domains) {
          reject 501 5.1.8 "Use Submission for outgoing SMTP"
        }
        default_source {
          destination postmaster $$(local_domains) {
            deliver_to &local_routing
          }
          default_destination {
            reject 550 5.1.1 "User doesn't exist"
          }
        }
      }

      submission tls://0.0.0.0:465 tcp://0.0.0.0:587 {
        limits {
          all rate 50 1s
        }
        auth &local_authdb
        source $$(local_domains) {
          check {
            authorize_sender {
              prepare_email &local_rewrites
              user_to_email identity
            }
          }
          destination postmaster $$(local_domains) {
            deliver_to &local_routing
          }
          default_destination {
            modify {
              dkim $$(primary_domain) $$(local_domains) default
            }
            deliver_to &remote_queue
          }
        }
        default_source {
          reject 501 5.1.8 "Non-local sender domain"
        }
      }

      target.remote outbound_delivery {
        limits {
          destination rate 20 1s
          destination concurrency 10
        }
        mx_auth {
          dane
          mtasts {
            cache fs
            fs_dir mtasts_cache/
          }
          local_policy {
            min_tls_level encrypted
            min_mx_level none
          }
        }
      }

      target.queue remote_queue {
        target &outbound_delivery
        autogenerated_msg_domain $$(primary_domain)
        bounce {
          destination postmaster $$(local_domains) {
            deliver_to &local_routing
          }
          default_destination {
            reject 550 5.0.0 "Refusing to send DSNs to non-local addresses"
          }
        }
      }

      imap tls://0.0.0.0:993 tcp://0.0.0.0:143 {
        auth &local_authdb
        storage &local_mailboxes
      }
      CONF
      fi
      if [ ! -f tls/fullchain.pem ] || [ ! -f tls/privkey.pem ]; then
        sed -i 's#^tls file /data/tls/fullchain.pem /data/tls/privkey.pem$$#tls self_signed#' maddy.conf
      fi
      if [ -n "$$MAIL_PASSWORD" ]; then
        account="$${MAIL_ACCOUNT:-postmaster@$$MADDY_DOMAIN}"
        if ! /bin/maddy creds list | grep -qxF "$$account"; then
          /bin/maddy creds create -p "$$MAIL_PASSWORD" "$$account"
          /bin/maddy imap-acct create "$$account"
        fi
      fi
      exec /bin/maddy -config /data/maddy.conf run
    environment:
      MADDY_HOSTNAME: ${MAIL_HOSTNAME}
      MADDY_DOMAIN: ${MAIL_DOMAIN}
      MAIL_ACCOUNT: ${MAIL_ACCOUNT:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    deploy:
      replicas: 1
    volumes:
    - ${DATA}:/data
    ports:
    - ${PORT:-25}:25/tcp
    - ${PORT_2:-465}:465/tcp
    - ${PORT_3:-587}:587/tcp
    - ${PORT_4:-993}:993/tcp
