# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Faved
  summary: Save and organize bookmarks
  description: Faved stores links, metadata and accounts in its managed App storage folder.
  category: productivity
  website: https://faved.to/
  source: https://github.com/denho/faved
  docs: https://faved.to/docs/getting-started/installation
  primary_service: faved
  post_install: Create the first account from a trusted network. Use HTTPS through a proxy and back up App
    storage.
  license: MIT
  architectures:
  - amd64
  - arm64
  web:
    port: 80
  options:
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 80 inside Nex.
    DATA:
      label: App storage
      help: Managed directory mounted at /var/www/html/storage. Choose storage writable by the application.
services:
  faved:
    image: docker.io/denho/faved:latest
    ports:
    - ${PORT:-20230}:80/tcp
    volumes:
    - ${DATA}:/var/www/html/storage
    deploy:
      replicas: 1
