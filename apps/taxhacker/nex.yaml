# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: TaxHacker
  summary: Organize invoices and receipts
  description: Provision PostgreSQL and set up the first local account. Add AI providers only if you want
    document extraction. Back up the data folder and keep it private.
  category: finance
  website: https://taxhacker.app/
  source: https://github.com/vas3k/TaxHacker
  docs: https://github.com/vas3k/TaxHacker#self-hosted
  primary_service: taxhacker
  post_install: Provision PostgreSQL and set up the first local account. Add AI providers only if you want
    document extraction. Back up the data folder and keep it private.
  license: MIT
  architectures:
  - amd64
  - arm64
  web:
    port: 7331
  options:
    DATABASE_URL:
      label: Database connection URL
      help: Include the PostgreSQL database name in the connection URL. Percent-encode special characters
        in credentials.
      type: password
    PORT:
      label: HTTP port
      help: The app listens on TCP port 7331 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Receipts, invoices and settings
      help: Managed directory mounted at /app/data. Choose storage writable by the application.
services:
  taxhacker:
    image: ghcr.io/vas3k/taxhacker:latest
    entrypoint:
    - /bin/sh
    - -ec
    - |
      if [ -z "$${PGDATABASE:-}" ]; then
        PGDATABASE=$$(node -p 'decodeURIComponent(new URL(process.env.DIRECT_URL || process.env.DATABASE_URL).pathname.slice(1))')
        export PGDATABASE
      fi
      exec docker-entrypoint.sh "$$@"
    - taxhacker
    command: [npm, start]
    ports:
    - ${PORT:-7331}:7331/tcp
    volumes:
    - ${DATA}:/app/data
    environment:
      SELF_HOSTED_MODE: 'true'
      UPLOAD_PATH: /app/data/uploads
      DATABASE_URL: ${DATABASE_URL}
    deploy:
      replicas: 1
