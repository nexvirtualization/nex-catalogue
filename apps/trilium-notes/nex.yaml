# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Trilium Notes
  summary: Build a hierarchical knowledge base with rich notes and links
  description: Create the first account or connect an existing Trilium database on a trusted network.
    Use one copy and stop it before a folder backup.
  category: productivity
  website: https://github.com/TriliumNext/Trilium
  source: https://github.com/TriliumNext/Trilium
  docs: https://docs.triliumnotes.org/user-guide/setup/server/installation
  primary_service: trilium-notes
  scalable: false
  license: AGPL-3.0
  web:
    port: 8080
  options:
    DATA:
      label: Notes and database
      help: Trilium document database, configuration and backups.
    PORT:
      label: Web port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  trilium-notes:
    image: ghcr.io/triliumnext/trilium:latest
    user: "1000:1000"
    volumes:
    # Docker gives an empty named volume the image directory's ownership.
    - ${DATA}:/home/node/trilium-data
    ports:
    - ${PORT:-8080}:8080/tcp
    deploy:
      replicas: 1
