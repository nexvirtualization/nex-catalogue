# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: SnapOtter
  summary: Convert and organize files in one browser interface
  description: The upstream bundled image provides file-processing tools and keeps application state in one
    managed data folder.
  category: tools
  website: https://snapotter.com
  source: https://github.com/snapotter-hq/SnapOtter
  docs: https://github.com/snapotter-hq/SnapOtter
  primary_service: snapotter
  post_install: Complete initial sign-in on a trusted network. Set your own administrator credentials at
    install time and back up Data.
  license: AGPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 1349
  options:
    ADMIN:
      label: Admin username
      help: Initial sign-in name.
    PASSWORD:
      label: Admin password
      help: Choose a strong password for first sign-in.
      type: password
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 1349 inside Nex.
    DATA:
      label: SnapOtter data
      help: Managed directory mounted at /data. Choose storage writable by the application.
services:
  snapotter:
    image: docker.io/snapotter/snapotter:latest
    ports:
    - ${PORT:-20220}:1349/tcp
    volumes:
    - ${DATA}:/data
    environment:
      AUTH_ENABLED: 'true'
      DEFAULT_USERNAME: ${ADMIN:-admin}
      DEFAULT_PASSWORD: ${PASSWORD}
    deploy:
      replicas: 1
