# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: CowAgent
  summary: Configure a private assistant and connect supported messaging channels
  description: Prepare your CowAgent configuration with a web password and bind its console to 0.0.0.0.
    Select the prepared folders before startup and keep the console private.
  category: ai
  website: https://github.com/zhayujie/CowAgent
  source: https://github.com/zhayujie/CowAgent
  docs: https://github.com/zhayujie/CowAgent
  primary_service: cow-agent
  scalable: false
  license: MIT
  architectures:
  - amd64
  web:
    port: 9899
  options:
    CONFIG:
      label: Prepared CowAgent configuration
      help: Keep prepared cowagent configuration in this managed folder between restarts.
    DATA:
      label: CowAgent state
      help: Keep cowagent state in this managed folder between restarts.
    PORT:
      label: Web port
      help: The app listens on TCP port 9899 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  cow-agent:
    image: docker.io/zhayujie/chatgpt-on-wechat:latest
    volumes:
    - ${CONFIG}:/home/agent/cow
    - ${DATA}:/home/agent/.cow
    ports:
    - ${PORT:-9899}:9899/tcp
    deploy:
      replicas: 1
