x-nex:
  name: Pydio
  summary: Share and synchronize files with Pydio Cells
  description: Pydio Cells connects to an existing supported database. The container keeps application files
    in managed storage.
  category: management
  website: https://pydio.com/
  source: https://github.com/pydio/cells
  docs: https://docs.linuxserver.io/images/docker-pydio-cells/
  primary_service: pydio-cells
  post_install: Provision a compatible MySQL server, then use the browser installer and enter your database
    details. Preserve the configured external HTTPS URL.
  license: AGPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 8080
  options:
    PUBLIC_URL:
      label: External URL
      help: Full browser-facing HTTPS URL for Cells.
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 8080 inside Nex.
    CONFIG:
      label: Pydio configuration and file data
      help: Managed directory mounted at /config. Choose storage writable by the application.
services:
  pydio-cells:
    image: lscr.io/linuxserver/pydio-cells:latest
    ports:
    - ${PORT:-20235}:8080/tcp
    volumes:
    - ${CONFIG}:/config
    environment:
      EXTERNALURL: ${PUBLIC_URL}
    deploy:
      replicas: 1
