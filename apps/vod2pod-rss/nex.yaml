# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: vod2pod-rss
  summary: Convert stream archives into podcast feeds
  description: Includes its own private Valkey cache, which holds only disposable data. Use a trusted
    network and a reachable feed address for podcast clients.
  category: media
  website: https://github.com/madiele/vod2pod-rss
  source: https://github.com/madiele/vod2pod-rss
  docs: https://github.com/madiele/vod2pod-rss
  primary_service: vod2pod-rss
  post_install: Open the app and provide a supported archive URL. Use a trusted network and a reachable feed
    address for podcast clients.
  license: MIT
  architectures:
  - amd64
  - arm64
  web:
    port: 8080
  options:
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    PORT:
      label: HTTP port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  vod2pod-rss:
    image: docker.io/madiele/vod2pod-rss:latest
    ports:
    - ${PORT:-8080}:8080/tcp
    environment:
      BASE_URL: ${PUBLIC_URL}
      REDIS_ADDRESS: cache
      REDIS_PORT: '6379'
    # vod2pod exits at once when the cache is not reachable yet.
    entrypoint:
    - /bin/bash
    - -c
    - until (exec 3<>/dev/tcp/cache/6379) 2>/dev/null; do sleep 1; done; exec vod2pod
    deploy:
      replicas: 1
  cache:
    image: docker.io/valkey/valkey:latest
    deploy:
      replicas: 1
