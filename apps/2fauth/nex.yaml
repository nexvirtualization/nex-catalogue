# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: 2FAuth
  summary: Manage one-time authentication codes in a web interface
  description: Use an HTTPS endpoint. Register the initial user on a trusted network, then disable registration
    in the app. Keep the application key with backups to decrypt stored tokens.
  category: security
  website: https://github.com/Bubka/2FAuth
  source: https://github.com/Bubka/2FAuth
  docs: https://docs.2fauth.app/getting-started/installation/docker/
  primary_service: 2fauth
  scalable: false
  license: AGPL-3.0
  web:
    port: 8000
  options:
    APP_KEY:
      label: Application key
      type: password
      generate: {format: base64, bytes: 32, prefix: 'base64:'}
      help: 'Use Generate, which makes base64: followed by 32 random bytes in Base64. If Generate gives
        letters and digits only (older Nex), paste the output of echo base64:$(openssl rand -base64 32)
        instead. Save this key securely for restores.'
    APP_URL:
      label: Public HTTPS URL
      help: Enter the exact HTTPS URL users will open, including any non-default port.
    DATA:
      label: 2FAuth data
      help: User accounts, encryption data and stored 2FA entries.
    PORT:
      label: Web port
      help: The app listens on TCP port 8000 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  2fauth:
    image: docker.io/2fauth/2fauth:latest
    environment:
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
    volumes:
    - ${DATA}:/2fauth
    ports:
    - ${PORT:-8000}:8000/tcp
    healthcheck:
      test: [CMD, wget, -q, -T, '3', -O, /dev/null, 'http://127.0.0.1:8000/up']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
