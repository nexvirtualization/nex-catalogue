# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: OpenSEO
  summary: Analyze search rankings and keyword visibility
  description: The upstream Docker profile runs local SEO tooling and can use DataForSEO. It trusts clients
    on the application endpoint.
  category: development
  website: https://openseo.so/
  source: https://github.com/every-app/open-seo
  docs: https://github.com/every-app/open-seo
  primary_service: openseo
  post_install: Keep host publishing disabled if using an authenticating proxy. Configure the allowed hostname
    and provide DataForSEO credentials before use.
  license: MIT
  architectures:
  - amd64
  - arm64
  web:
    port: 3001
  options:
    ALLOWED_HOST:
      label: Allowed hostname
      help: Specify the hostname users open in the browser.
    DATAFORSEO_API_KEY:
      label: DataForSEO API key
      help: API key used by keyword analytics.
      type: password
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 3001 inside Nex.
    DATA:
      label: Application state
      help: Managed directory mounted at /app/.wrangler. Choose storage writable by the application.
services:
  openseo:
    image: ghcr.io/every-app/open-seo:latest
    ports:
    - ${PORT:-20244}:3001/tcp
    volumes:
    - ${DATA}:/app/.wrangler
    environment:
      CLOUDFLARE_INCLUDE_PROCESS_ENV: 'true'
      PORT: '3001'
      AUTH_MODE: local_noauth
      ALLOWED_HOST: ${ALLOWED_HOST}
      OPENSEO_TELEMETRY_DISABLED: 'true'
      DATAFORSEO_API_KEY: ${DATAFORSEO_API_KEY}
    deploy:
      replicas: 1
