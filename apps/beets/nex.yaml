# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Beets
  summary: Organize and tag a digital music collection
  description: Beets stores its configuration and library index separately. Use the CLI import workflow or
    browse the configured web plugin.
  category: media
  website: https://beets.io/
  source: https://github.com/beetbox/beets
  docs: https://docs.linuxserver.io/images/docker-beets/
  primary_service: beets
  post_install: Prepare config.yaml with your preferred plugins and import settings. Map the music library
    to /music. Configure the web plugin to listen on 0.0.0.0:8337 if it is not already enabled.
  license: MIT
  architectures:
  - amd64
  - arm64
  web:
    port: 8337
  options:
    PORT:
      label: HTTP port
      help: The app listens on TCP port 8337 on its default Docker network. Nex does not publish it on host
        addresses.
    CONFIG:
      label: Beets configuration and database
      help: Managed directory mounted at /config. Choose storage writable by the application.
    MUSIC:
      label: Music collection
      help: Managed directory mounted at /music. Choose storage writable by the application.
    INBOX:
      label: Import folder
      help: Managed directory mounted at /downloads. Choose storage writable by the application.
services:
  beets:
    image: lscr.io/linuxserver/beets:latest
    ports:
    - ${PORT:-8337}:8337/tcp
    volumes:
    - ${CONFIG}:/config
    - ${MUSIC}:/music
    - ${INBOX}:/downloads
    deploy:
      replicas: 1
