x-nex:
  name: Easy!Appointments
  summary: Schedule appointments from a public booking page
  description: Create a MySQL database and run the web installer on a trusted network. Use the public
    HTTPS address in booking links and email reminders.
  category: productivity
  website: https://easyappointments.org/
  source: https://github.com/alextselegidis/easyappointments
  docs: https://github.com/alextselegidis/easyappointments#readme
  scalable: false
  primary_service: easyappointments
  architectures:
  - amd64
  - arm64
  web:
    service: easyappointments
    scheme: http
    port: 80
    path: /index.php/installation
  works_with:
  - mariadb
  options:
    DB_HOST:
      label: Database host
      help: Host or Nex application name of the prepared database service. It must be reachable on internal
        port 3306.
    DB_USER:
      label: Database user
      help: Create a dedicated non-root database user for this application.
    DB_NAME:
      label: Database name
      help: Create a database owned by the configured user first. The default is easyappointments.
    DB_PASSWORD:
      label: Database password
      help: Password for the dedicated database account.
      type: password
    PUBLIC_URL:
      label: Public web address
      help: Full URL clients will open, including scheme and any non-default port.
    PORT:
      label: Web port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Booking application files
      help: Select This host. Stores configuration and persistent site files. Include this folder in a
        stopped Nex backup.
services:
  easyappointments:
    image: alextselegidis/easyappointments:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME:-easyappointments}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      BASE_URL: ${PUBLIC_URL}
    ports:
    - ${PORT:-80}:80/tcp
    volumes:
    - ${DATA}:/var/www/html
    deploy:
      replicas: 1
