# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Gotify
  summary: Receive and browse push notifications
  description: Use the Nex administrator credentials to sign in. Create separate application tokens for
    each sender and use HTTPS to keep the tokens private in transit.
  category: communication
  website: https://gotify.net/
  source: https://github.com/gotify/server
  docs: https://gotify.net/docs/install
  scalable: false
  primary_service: gotify
  architectures:
  - amd64
  - arm64
  web:
    service: gotify
    scheme: http
    port: 80
  options:
    ADMIN_USERNAME:
      label: Administrator name
      help: Login created on first initialization.
    ADMIN_PASSWORD:
      label: Administrator password
      help: Use Generate to create a unique secret for this installation.
      type: password
    PORT:
      label: Web port
      help: Host-published HTTP port when publishing is enabled. With a dedicated Primary network, use
        the application address on port 80.
    DATA:
      label: Notifications and configuration
      help: Select This host. Stores the SQLite database, notifications and plugin data. Include this
        folder in a stopped Nex backup.
services:
  gotify:
    image: gotify/server:latest
    environment:
      GOTIFY_DEFAULTUSER_NAME: ${ADMIN_USERNAME:-admin}
      GOTIFY_DEFAULTUSER_PASS: ${ADMIN_PASSWORD}
    ports:
    - ${PORT:-8399}:80/tcp
    volumes:
    - ${DATA}:/app/data
    deploy:
      replicas: 1
