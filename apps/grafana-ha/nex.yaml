x-nex:
  name: Grafana HA
  summary: Run load-balanced Grafana dashboards with shared PostgreSQL
  description: >-
    Grafana OSS dashboard replicas use the same external PostgreSQL database. Provision an empty database
    first, then start one copy and sign in to initialize it. Raise Copies in Basics and publish the web port
    through the Docker network. This package disables Grafana Alerting and Live. Dashboard data, accounts and
    data source settings live in PostgreSQL. Specify custom plugins in the package settings so each copy
    installs the same versions on startup.
  category: monitoring
  website: https://grafana.com/oss/grafana/
  source: https://github.com/grafana/grafana
  docs: https://grafana.com/docs/grafana/latest/setup-grafana/set-up-for-high-availability/
  license: AGPL-3.0
  primary_service: grafana
  scale: [grafana]
  web: {port: 3000}
  first_sign_in: Sign in with the initial administrator credentials you supplied. If reusing a database, use the administrator already stored there.
  tags: [dashboards, metrics, high-availability]
  options:
    PORT:
      label: Web port
      help: Publish through the Docker network so each available Swarm node can forward traffic to a Grafana copy.
    PUBLIC_URL:
      label: Public web URL
      help: Full browser URL with scheme and port as needed. Use the TLS-terminating proxy URL when one is configured.
    DB_HOST:
      label: PostgreSQL address
      help: DNS name and port reachable from every eligible Nex node, such as postgres.example.internal:5432.
    DB_NAME:
      label: PostgreSQL database
      help: Pre-create a dedicated database. Back it up with the Grafana signing secret.
    DB_USER:
      label: PostgreSQL user
      help: This account must be able to create and migrate Grafana tables in the dedicated database.
    DB_PASSWORD:
      label: PostgreSQL password
      type: password
    DB_SSL_MODE:
      label: PostgreSQL TLS mode
      help: Use verify-full when the server certificate chains to a trusted CA. The default require encrypts traffic without verifying the hostname. Use disable only on a trusted private network.
    APP_SECRET:
      label: Grafana signing and encryption secret
      type: password
      help: Use Generate once and keep this value identical across all replicas and restores. Changing it can invalidate stored data source secrets.
    PLUGINS:
      label: Preinstalled plugins
      help: Optional comma-separated plugin IDs from the Grafana catalog. Pin each version with plugin_id@version so all copies load the same plugin.
    ADMIN_USER:
      label: Initial administrator username
      help: Applies when the database is first initialized.
    ADMIN_PASSWORD:
      label: Initial administrator password
      type: password
      help: Use Generate. Applies when the database is first initialized.
services:
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SERVER_ROOT_URL: "${PUBLIC_URL}"
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: "${DB_HOST}"
      GF_DATABASE_NAME: "${DB_NAME}"
      GF_DATABASE_USER: "${DB_USER}"
      GF_DATABASE_PASSWORD: "${DB_PASSWORD}"
      GF_DATABASE_SSL_MODE: "${DB_SSL_MODE:-require}"
      GF_DATABASE_MIGRATION_LOCKING: "true"
      GF_SECURITY_SECRET_KEY: "${APP_SECRET}"
      GF_PLUGINS_PREINSTALL_SYNC: "${PLUGINS:-}"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: "${ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_LIVE_MAX_CONNECTIONS: "0"
    ports:
      - "${PORT:-3012}:3000/tcp"
    deploy:
      replicas: 1
