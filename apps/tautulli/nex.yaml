# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Tautulli
  summary: Monitor usage and playback history for a Plex server
  description: Use the web wizard on a trusted network and connect a Plex server this app can reach.
  category: media
  website: https://github.com/Tautulli/Tautulli
  source: https://github.com/Tautulli/Tautulli
  docs: https://docs.linuxserver.io/images/docker-tautulli/
  primary_service: tautulli
  scalable: false
  license: GPL-3.0
  web:
    port: 8181
  options:
    CONFIG:
      label: Configuration and history
      help: Tautulli configuration, playback database and logs.
    PORT:
      label: Web port
      help: Host-published TCP port. With a dedicated Primary network and host publishing off, use the
        application address on port 8181.
services:
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    environment:
      PUID: '1000'
      PGID: '1000'
    volumes:
    - ${CONFIG}:/config
    ports:
    - ${PORT:-8181}:8181/tcp
    deploy:
      replicas: 1
