x-nex:
  name: KrakenD
  summary: Expose configured API routes through an independent gateway
  description: Select a prepared directory containing krakend.json. Define only the intended upstream
    services, then start the gateway and configure HTTPS at its ingress.
  category: development
  website: https://github.com/krakend/krakend-ce
  source: https://github.com/krakend/krakend-ce
  docs: https://www.krakend.io/docs/deploying/docker/
  primary_service: krakend
  scalable: false
  license: Apache-2.0
  options:
    CONFIG:
      label: Prepared gateway configuration
      help: Keep prepared gateway configuration in this managed folder between restarts.
    PORT:
      label: Service port
      help: Host-published TCP port. With a dedicated Primary network and host publishing off, use the
        application address on port 8080.
services:
  krakend:
    image: docker.io/library/krakend:latest
    command:
    - run
    - -c
    - /etc/krakend/krakend.json
    volumes:
    - ${CONFIG}:/etc/krakend
    ports:
    - ${PORT:-8080}:8080/tcp
    deploy:
      replicas: 1
