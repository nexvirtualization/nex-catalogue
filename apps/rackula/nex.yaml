# SPDX-License-Identifier: AGPL-3.0-only
# Deployment reference: https://github.com/RackulaLives/Rackula#readme
x-nex:
  name: Rackula
  summary: Designs rack layouts and saves them in a browser or a self-hosted server
  category: management
  description: Designs rack layouts and saves them in a browser or a self-hosted server.
  source: https://github.com/RackulaLives/Rackula
  website: https://racku.la/
  docs: https://racku.la/
  primary_service: app
  options:
    PORT:
      label: Published TCP port
      help: Host port for the listener on 8080/tcp.
  web:
    port: 8080
  post_install: Open Rackula to design and document a rack.
services:
  app:
    image: ghcr.io/rackulalives/rackula:latest
    deploy:
      replicas: 1
    ports:
    - ${PORT:-8080}:8080/tcp
