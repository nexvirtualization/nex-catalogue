# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Bytebase
  summary: Review and automate database schema changes
  description: Complete initial administrator setup on a trusted network. This single-node configuration
    stores its embedded database in its application folder. Configure the client-facing HTTPS address
    before connecting external users.
  category: development
  website: https://www.bytebase.com/
  source: https://github.com/bytebase/bytebase
  docs: https://docs.bytebase.com/get-started/install/deploy-with-docker
  scalable: false
  primary_service: bytebase
  architectures:
  - amd64
  - arm64
  web:
    service: bytebase
    scheme: http
    port: 8080
  options:
    PORT:
      label: Web port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Bytebase state
      help: Select This host. Holds the embedded database, settings and migration history. Include this
        folder in a stopped Nex backup.
services:
  bytebase:
    image: bytebase/bytebase:latest
    ports:
    - ${PORT:-8080}:8080/tcp
    volumes:
    - ${DATA}:/var/opt/bytebase
    deploy:
      replicas: 1
