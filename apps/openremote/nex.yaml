x-nex:
  name: OpenRemote
  summary: Manage IoT devices, data, and automation rules
  description: Use the configured browser hostname and route HTTPS and MQTTS as needed. Set the external
    HTTPS port to match Keycloak’s public URL. Sign in as admin with the supplied password and back up the
    database and manager data.
  category: home-automation
  website: https://openremote.io
  source: https://github.com/openremote/core
  docs: https://github.com/openremote/core/blob/main/docker-compose.yml
  primary_service: openremote
  post_install: Use the configured browser hostname and route HTTPS and MQTTS as needed. Set the external
    HTTPS port to match Keycloak’s public URL. Sign in as admin with the supplied password and back up the
    database and manager data.
  architectures:
  - amd64
  - arm64
  web:
    port: 443
    scheme: https
  options:
    PUBLIC_HOST:
      label: Public host
      help: Host name browsers use to reach OpenRemote, without scheme or port, for example iot.example.com.
        The proxy requests a Let's Encrypt certificate for it when port 80 is reachable from the internet;
        otherwise it serves a self-signed certificate.
    ACME_EMAIL:
      label: Let's Encrypt email
      help: Optional contact address for the Let's Encrypt account. Leave empty to skip it.
    ADMIN_PASSWORD:
      label: Admin password
      help: Use Generate. Password of the admin user for the manager and Keycloak.
      type: password
    DB_PASSWORD:
      label: Database password
      help: Use Generate. Password of the PostgreSQL service inside this app. Keep it unchanged after the first
        start.
      type: password
    EXTERNAL_HTTPS_PORT:
      label: External HTTPS port
      help: HTTPS port browsers use in the public URL. Leave empty for 443. Keycloak sign-in links are built
        from it, so it must match your proxy.
    PORT:
      label: HTTP port
      help: The app listens on TCP port 443 on its default Docker network. Nex does not publish it on host
        addresses.
    HTTP_PORT:
      label: HTTP or ACME port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
    MQTTS_PORT:
      label: MQTTS port
      help: The app listens on TCP port 8883 on its default Docker network. Nex does not publish it on host
        addresses.
    PROXY_DATA:
      label: TLS and proxy state
      help: Managed directory mounted at /deployment. Choose storage writable by the application.
    MANAGER_DATA:
      label: Manager data
      help: Managed writable directory mounted at /storage.
    DB_DATA:
      label: OpenRemote database
      help: Managed writable directory mounted at /var/lib/postgresql/data.
services:
  openremote:
    image: docker.io/openremote/proxy:latest
    ports:
    - ${PORT:-443}:443/tcp
    - ${HTTP_PORT:-80}:80/tcp
    - ${MQTTS_PORT:-8883}:8883/tcp
    volumes:
    - ${PROXY_DATA}:/deployment
    environment:
      DOMAINNAME: ${PUBLIC_HOST}
      LE_EMAIL: ${ACME_EMAIL:-}
    deploy:
      replicas: 1
  postgresql:
    image: docker.io/openremote/postgresql:latest-slim
    environment:
      POSTGRES_DB: openremote
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
    - ${DB_DATA}:/var/lib/postgresql/data
    deploy:
      replicas: 1
  keycloak:
    image: docker.io/openremote/keycloak:latest
    environment:
      KC_DB_URL_HOST: postgresql
      KC_DB_URL_DATABASE: openremote
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HOSTNAME: https://${PUBLIC_HOST}:${EXTERNAL_HTTPS_PORT:-443}/auth
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    # Keycloak exits when the database is not accepting connections yet.
    entrypoint:
    - /bin/bash
    - -c
    - |
      until (exec 3<>/dev/tcp/postgresql/5432) 2>/dev/null; do sleep 2; done
      exec /opt/keycloak/bin/kc.sh $${KEYCLOAK_START_COMMAND:-start} --spi-events-listener-self-register-user-configure-self-registered-user-roles="$${KEYCLOAK_SELF_REGISTERED_USER_ROLES:-}" $${KEYCLOAK_START_OPTS:-}
    deploy:
      replicas: 1
  manager:
    image: docker.io/openremote/manager:latest
    environment:
      OR_DB_HOST: postgresql
      OR_DB_NAME: openremote
      OR_DB_PASSWORD: ${DB_PASSWORD}
      OR_HOSTNAME: ${PUBLIC_HOST}
      OR_SSL_PORT: ${EXTERNAL_HTTPS_PORT:-443}
      OR_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OR_METRICS_ENABLED: 'false'
    # The manager exits when the database is not accepting connections yet.
    entrypoint:
    - /bin/bash
    - -c
    - |
      until (exec 3<>/dev/tcp/postgresql/5432) 2>/dev/null; do sleep 2; done
      exec /entrypoint.sh
    volumes:
    - ${MANAGER_DATA}:/storage
    deploy:
      replicas: 1
