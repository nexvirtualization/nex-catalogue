# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: LimeSurvey
  summary: Create surveys and collect responses
  description: Provision MariaDB before starting. Use the configured initial administrator and back up the
    database and survey uploads.
  category: productivity
  website: https://www.limesurvey.org
  source: https://github.com/LimeSurvey/LimeSurvey
  docs: https://github.com/adamzammit/limesurvey-docker
  primary_service: limesurvey
  post_install: Provision MariaDB before starting. Use the configured initial administrator and back up the
    database and survey uploads.
  license: GPL-2.0
  architectures:
  - amd64
  - arm64
  web:
    port: 80
  options:
    DB_HOST:
      label: Db host
      help: Hostname or Nex connection name of the database service.
    DB_USER:
      label: Db user
      help: Enter the deployment value described in the upstream setup guide.
    DB_PASSWORD:
      label: Db password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    DB_NAME:
      label: Db name
      help: Enter the deployment value described in the upstream setup guide.
    ADMIN_USER:
      label: Admin user
      help: Enter the deployment value described in the upstream setup guide.
    ADMIN_PASSWORD:
      label: Admin password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    ADMIN_EMAIL:
      label: Admin email
      help: Enter the deployment value described in the upstream setup guide.
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 80 inside Nex.
    UPLOADS:
      label: Survey attachments
      help: Managed directory mounted at /var/www/html/upload. Choose storage writable by the application.
services:
  limesurvey:
    image: docker.io/adamzammit/limesurvey:7.10.0
    ports:
    - ${PORT:-23500}:80/tcp
    volumes:
    - ${UPLOADS}:/var/www/html/upload
    environment:
      LIMESURVEY_DB_HOST: ${DB_HOST}
      LIMESURVEY_DB_USER: ${DB_USER}
      LIMESURVEY_DB_PASSWORD: ${DB_PASSWORD}
      LIMESURVEY_DB_NAME: ${DB_NAME:-limesurvey}
      LIMESURVEY_ADMIN_USER: ${ADMIN_USER:-admin}
      LIMESURVEY_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      LIMESURVEY_ADMIN_NAME: Administrator
      LIMESURVEY_ADMIN_EMAIL: ${ADMIN_EMAIL}
    deploy:
      replicas: 1
