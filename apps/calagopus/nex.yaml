# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Calagopus
  summary: Manage users, game servers, and remote Wings nodes
  description: Provision PostgreSQL and Redis or Valkey. Complete administrator setup per the panel guide
    and register a separately installed Wings node over HTTPS.
  category: management
  website: https://calagopus.com
  source: https://github.com/calagopus/panel
  docs: https://github.com/calagopus/panel/blob/main/compose.yml
  primary_service: calagopus
  post_install: Provision PostgreSQL and Redis or Valkey. Complete administrator setup per the panel guide
    and register a separately installed Wings node over HTTPS.
  license: MIT
  architectures:
  - amd64
  - arm64
  web:
    port: 8000
  options:
    REDIS_URL:
      label: Redis url
      help: Enter the deployment value described in the upstream setup guide.
    DATABASE_URL:
      label: Database url
      help: Connection URL for the database. Percent-encode special characters in credentials.
      type: password
    ENCRYPTION_KEY:
      label: Encryption key
      help: Use the credential or secret required by the upstream configuration.
      type: password
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 8000 inside Nex.
    DATA:
      label: Panel assets and data
      help: Managed directory mounted at /var/lib/calagopus. Choose storage writable by the application.
    LOGS:
      label: Panel logs
      help: Managed directory mounted at /var/log/calagopus. Choose storage writable by the application.
services:
  calagopus:
    image: docker.io/calagopus/panel:latest
    ports:
    - ${PORT:-23561}:8000/tcp
    volumes:
    - ${DATA}:/var/lib/calagopus
    - ${LOGS}:/var/log/calagopus
    environment:
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_MIGRATE: 'true'
      PORT: '8000'
      APP_DEBUG: 'false'
      APP_PRIMARY: 'true'
      APP_ENABLE_WINGS_PROXY: 'true'
      APP_ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      APP_USE_DECRYPTION_CACHE: 'false'
      APP_LOG_DIRECTORY: /var/log/calagopus
    deploy:
      replicas: 1
