x-nex:
  name: Nango
  summary: Connect external APIs and manage integration credentials
  description: Provision PostgreSQL. Use an authenticating HTTPS endpoint and configure integrations from
    their respective provider credentials.
  category: development
  website: https://nango.dev/
  source: https://github.com/NangoHQ/nango
  docs: https://docs.nango.dev/guides/self-hosting
  primary_service: nango
  post_install: Provision PostgreSQL. Use an authenticating HTTPS endpoint and configure integrations from
    their respective provider credentials.
  license: Elastic-2.0
  architectures:
  - amd64
  web:
    port: 3003
  options:
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    ENCRYPTION_KEY:
      label: Encryption key
      help: Use Generate, which makes 32 random bytes in Base64. If Generate gives letters and digits only
        (older Nex), paste the output of openssl rand -base64 32 instead. Keep it private; changing it makes
        stored credentials unreadable.
      type: password
      generate: {format: base64, bytes: 32}
    DB_HOST:
      label: Db host
      help: Hostname or Nex connection name of the database service.
    DB_PORT:
      label: Db port
      help: Enter the deployment value described in the upstream setup guide.
    DB_NAME:
      label: Db name
      help: Enter the deployment value described in the upstream setup guide.
    DB_USER:
      label: Db user
      help: Enter the deployment value described in the upstream setup guide.
    DB_PASSWORD:
      label: Db password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    PORT:
      label: HTTP port
      help: The app listens on TCP port 3003 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  nango:
    image: docker.io/nangohq/nango-server:latest
    ports:
    - ${PORT:-3003}:3003/tcp
    environment:
      NANGO_SERVER_URL: ${PUBLIC_URL}
      NANGO_ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NANGO_DB_HOST: ${DB_HOST}
      NANGO_DB_PORT: ${DB_PORT:-5432}
      NANGO_DB_NAME: ${DB_NAME:-nango}
      NANGO_DB_USER: ${DB_USER}
      NANGO_DB_PASSWORD: ${DB_PASSWORD}
    deploy:
      replicas: 1
