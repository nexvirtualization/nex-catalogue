# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Syslog-ng
  summary: Receive and route syslog messages
  description: The syslog-ng service reads and writes managed storage directories selected for configuration
    and collected logs.
  category: monitoring
  website: https://www.syslog-ng.com/
  source: https://github.com/syslog-ng/syslog-ng
  docs: https://docs.linuxserver.io/images/docker-syslog-ng/
  primary_service: syslog-ng
  post_install: Configure a source on TCP port 5514 in Configuration and point authorized senders at the
    app connection name. Use a dedicated network or a trusted proxy for access from outside Nex.
  license: GPL-3.0
  architectures:
  - amd64
  - arm64
  options:
    SYSLOG_PORT:
      label: Syslog TCP port
      help: The app listens on TCP port 5514 on its default Docker network. Nex does not publish it on host
        addresses.
    CONFIG:
      label: syslog-ng configuration
      help: Managed directory mounted at /config. Choose storage writable by the application.
    LOGS:
      label: Collected log files
      help: Managed directory mounted at /var/log. Choose storage writable by the application.
services:
  syslog-ng:
    image: lscr.io/linuxserver/syslog-ng:latest
    ports:
    - ${SYSLOG_PORT:-5514}:5514/tcp
    volumes:
    - ${CONFIG}:/config
    - ${LOGS}:/var/log
    deploy:
      replicas: 1
