# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: XWiki
  summary: Collaborate on an extensible wiki and knowledge base
  description: Provision a PostgreSQL database before starting XWiki. Complete the distribution wizard
    at /xwiki/ and restrict setup access to a trusted network.
  category: documents
  website: https://github.com/xwiki/xwiki-platform
  source: https://github.com/xwiki/xwiki-platform
  docs: https://hub.docker.com/_/xwiki
  primary_service: xwiki
  scalable: false
  license: LGPL-2.1
  web:
    port: 8080
  options:
    DB_HOST:
      label: Database hostname
      help: Reachable PostgreSQL server.
    DB_DATABASE:
      label: Database name
      help: Name of the prepared, empty PostgreSQL database that XWiki will use. Leave empty for xwiki.
    DB_PASSWORD:
      label: Database password
      type: password
      help: Password for the prepared XWiki database user.
    DB_USER:
      label: Database user
      help: Dedicated user that owns the prepared database.
    DATA:
      label: Wiki extensions and attachments
      help: Keep wiki extensions and attachments in this managed folder between restarts.
    PORT:
      label: Web port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  xwiki:
    image: docker.io/library/xwiki:stable-postgres-tomcat
    environment:
      DB_HOST: ${DB_HOST}
      DB_DATABASE: ${DB_DATABASE:-xwiki}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
    volumes:
    - ${DATA}:/usr/local/xwiki
    ports:
    - ${PORT:-8080}:8080/tcp
    deploy:
      replicas: 1
