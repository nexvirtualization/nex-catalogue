# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: FileBrowser Quantum
  summary: Browse and share managed files over the web
  description: This FileBrowser Quantum deployment mounts a selected folder for files and keeps configuration
    and file metadata separate.
  category: management
  website: https://github.com/gtsteffaniak/filebrowser
  source: https://github.com/gtsteffaniak/filebrowser
  docs: https://filebrowserquantum.com/en/docs/getting-started/
  primary_service: filebrowser-quantum
  post_install: Prepare the Quantum configuration in Application data and point its source to /srv. Complete
    sign-in on a trusted network before exposing sharing links.
  license: Apache-2.0
  architectures:
  - amd64
  - arm64
  web:
    port: 80
  options:
    PORT:
      label: HTTP port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Application data
      help: Holds the app data. Choose storage writable by the application.
    FILES:
      label: Files
      help: Managed directory mounted at /srv. Choose storage writable by the application.
services:
  filebrowser-quantum:
    image: ghcr.io/gtsteffaniak/filebrowser:stable
    ports:
    - ${PORT:-80}:80/tcp
    volumes:
    - ${DATA}:/home/filebrowser/data
    - ${FILES}:/srv
    deploy:
      replicas: 1
