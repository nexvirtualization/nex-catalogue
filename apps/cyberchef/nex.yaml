# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: CyberChef
  summary: Convert and transform data in the browser
  description: >-
    Build reusable recipes for encoding, decoding and data transformation. Each copy serves the same static
    app and the browser runs the recipes. No persistent folders are required.
  category: tools
  website: https://github.com/gchq/CyberChef#with-docker
  source: https://github.com/gchq/CyberChef
  docs: https://github.com/gchq/CyberChef#with-docker
  license: Apache-2.0
  primary_service: cyberchef
  scale:
    - cyberchef
  web:
    port: 8080
  options:
    PORT:
      label: Port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
  post_install: Use the Docker network and set Copies in Basics. Reach the shared endpoint through a proxy on
    the Nex application network.
services:
  cyberchef:
    image: ghcr.io/gchq/cyberchef:latest
    ports:
      - ${PORT:-8080}:8080/tcp
    deploy:
      replicas: 1
