# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: ONLYOFFICE
  summary: Edit office documents through a compatible host application
  description: Use this Document Server with an integration such as Nextcloud. The combined upstream image
    provides the required internal services.
  category: documents
  website: https://helpcenter.onlyoffice.com/faq/server-opensource.aspx
  source: https://github.com/ONLYOFFICE/DocumentServer
  docs: https://github.com/ONLYOFFICE/Docker-DocumentServer
  primary_service: onlyoffice-document-server
  post_install: Set up the Document Server URL and JWT secret in the compatible document host. Connect over
    HTTPS for browser access and verify reverse proxy WebSockets.
  license: AGPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 80
  options:
    JWT_SECRET:
      label: Integration secret
      help: Use the same secret in your document management integration.
      type: password
    PORT:
      label: HTTP port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Document Server data
      help: Managed directory mounted at /var/www/onlyoffice/Data. Choose storage writable by the application.
    LIB:
      label: Working state
      help: Managed directory mounted at /var/lib/onlyoffice. Choose storage writable by the application.
    DB:
      label: Internal database
      help: Managed directory mounted at /var/lib/postgresql. Choose storage writable by the application.
services:
  onlyoffice-document-server:
    image: docker.io/onlyoffice/documentserver:latest
    ports:
    - ${PORT:-80}:80/tcp
    volumes:
    - ${DATA}:/var/www/onlyoffice/Data
    - ${LIB}:/var/lib/onlyoffice
    - ${DB}:/var/lib/postgresql
    environment:
      JWT_ENABLED: 'true'
      JWT_SECRET: ${JWT_SECRET}
    deploy:
      replicas: 1
