# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Movary
  summary: Track movies watched and ratings
  description: Obtain a TMDB API key. Movary keeps its SQLite database in the application storage folder,
    so back that folder up. Create your first user using the upstream CLI if registration is disabled.
  category: media
  website: https://github.com/leepeuker/movary
  source: https://github.com/leepeuker/movary
  docs: https://movary.org/installation/docker/
  primary_service: movary
  scalable: false
  post_install: Create your first user using the upstream CLI if registration is disabled.
  license: MIT
  architectures:
  - amd64
  - arm64
  web:
    port: 8080
  options:
    TMDB_API_KEY:
      label: Tmdb api key
      help: Use the credential or secret required by the upstream configuration.
      type: password
    APPLICATION_SECRET:
      label: Application secret
      help: Use Generate, which makes 64 hexadecimal characters. If Generate gives letters and digits only
        (older Nex), paste the output of openssl rand -hex 32 instead. Do not change it after first use.
      type: password
      generate: {format: hex, length: 64}
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    PORT:
      label: HTTP port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Application storage
      help: Managed directory mounted at /app/storage. It holds the SQLite database (movary.sqlite) and
        poster images. A start-up step hands it to the application user.
services:
  movary:
    image: docker.io/leepeuker/movary:latest
    ports:
    - ${PORT:-8080}:8080/tcp
    volumes:
    - ${DATA}:/app/storage
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY}
      APPLICATION_SECRET: ${APPLICATION_SECRET}
      DATABASE_MODE: sqlite
      APP_ENV: production
      APP_URL: ${PUBLIC_URL}
    user: 0:0
    entrypoint:
    - /bin/sh
    - -ec
    - |
      chown -R application:application /app/storage
      chmod a+rw /dev/stdout /dev/stderr
      exec su -m -s /bin/sh application -c 'exec /usr/local/bin/entrypoint.sh /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf'
    deploy:
      replicas: 1
