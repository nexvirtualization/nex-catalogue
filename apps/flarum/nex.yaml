x-nex:
  name: Flarum
  summary: Host an extensible discussion forum
  description: Prepare MariaDB and set the full client-facing HTTPS URL. Complete the initial forum setup
    on a trusted network and configure permissions before welcoming users.
  category: communication
  website: https://flarum.org
  source: https://github.com/flarum/flarum
  docs: https://github.com/crazy-max/docker-flarum
  scalable: false
  primary_service: flarum
  architectures:
  - amd64
  - arm64
  web:
    service: flarum
    scheme: http
    port: 8000
  works_with:
  - mariadb
  options:
    DB_HOST:
      label: Database host
      help: Host or Nex application name of the prepared database service. It must be reachable on internal
        port 3306.
    DB_USER:
      label: Database user
      help: Create a dedicated non-root database user for this application.
    DB_NAME:
      label: Database name
      help: Create a database owned by the configured user first. The default is flarum.
    DB_PASSWORD:
      label: Database password
      help: Password for the dedicated database account.
      type: password
    PUBLIC_URL:
      label: Public web address
      help: Full URL clients will open, including scheme and any non-default port.
    PORT:
      label: Web port
      help: Host-published HTTP port when publishing is enabled. With a dedicated Primary network, use
        the application address on port 8000.
    DATA:
      label: Flarum state
      help: Select This host. Stores extensions, assets and local application configuration. Include this
        folder in a stopped Nex backup.
services:
  flarum:
    image: crazymax/flarum:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-flarum}
      FLARUM_BASE_URL: ${PUBLIC_URL}
    ports:
    - ${PORT:-8434}:8000/tcp
    volumes:
    - ${DATA}:/data
    deploy:
      replicas: 1
