# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: TileServer GL
  summary: Serve map tiles and styles over HTTP
  description: Starts with no preparation. When the map folder is empty, TileServer GL downloads its small
    Zurich demo dataset on first start, so the host needs internet access once. To serve your own maps,
    put .mbtiles files or a config.json in the folder and restart; an existing folder is never overwritten.
  category: development
  website: https://tileserver.readthedocs.io/
  source: https://github.com/maptiler/tileserver-gl
  docs: https://tileserver.readthedocs.io/en/latest/installation.html
  primary_service: tileserver-gl
  post_install: Open the preview and check that the demo map, or your own dataset, is visible.
  license: Apache-2.0
  architectures:
  - amd64
  - arm64
  web:
    port: 8080
  options:
    PORT:
      label: HTTP port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Map tiles and styles
      help: Choose storage the application can write to (user ID 1000). Nex mounts it at /data. It holds
        the demo dataset, or your own .mbtiles files and config.json.
services:
  tileserver-gl:
    image: docker.io/maptiler/tileserver-gl:latest
    ports:
    - ${PORT:-8080}:8080/tcp
    volumes:
    - ${DATA}:/data
    deploy:
      replicas: 1
