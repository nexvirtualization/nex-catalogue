# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: bolt.diy
  summary: Build and preview web apps with a configured AI model
  description: Use the browser workbench to generate and edit a project with a configured AI provider. The container
    serves the web workbench. Projects and local settings use browser storage.
  category: ai
  website: https://github.com/stackblitz-labs/bolt.diy
  source: https://github.com/stackblitz-labs/bolt.diy
  docs: https://github.com/stackblitz-labs/bolt.diy#running-with-docker
  license: MIT
  primary_service: bolt-diy
  architectures:
  - amd64
  - arm64
  post_install: Keep access private or use an authenticating HTTPS proxy. Choose a model provider in Settings,
    and export projects you want to keep.
  web:
    port: 5173
  options:
    PORT:
      label: Published HTTP port
      help: Internal HTTP port 5173. This setting is used when host port publishing is enabled.
services:
  bolt-diy:
    image: ghcr.io/stackblitz-labs/bolt.diy:latest
    ports:
    - ${PORT:-18122}:5173/tcp
    deploy:
      replicas: 1
