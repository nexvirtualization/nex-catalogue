x-nex:
  name: Wiki.js
  summary: Publish team knowledge and documentation
  description: Provision a PostgreSQL database and finish initial site setup on a trusted network. Choose
    the external HTTPS address in the installer and create the wiki administrator.
  category: productivity
  website: https://js.wiki/
  source: https://github.com/Requarks/wiki
  docs: https://docs.requarks.io/install/docker
  scalable: false
  primary_service: wiki-js
  architectures:
  - amd64
  - arm64
  web:
    service: wiki-js
    scheme: http
    port: 3000
  works_with:
  - postgresql
  options:
    DB_HOST:
      label: Database host
      help: Host or Nex application name of the prepared database service. It must be reachable on internal
        port 5432.
    DB_USER:
      label: Database user
      help: Create a dedicated non-root database user for this application.
    DB_NAME:
      label: Database name
      help: Create a database owned by the configured user first. The default is wiki.
    DB_PASSWORD:
      label: Database password
      help: Password for the dedicated database account.
      type: password
    PORT:
      label: Web port
      help: Host-published HTTP port when publishing is enabled. With a dedicated Primary network, use
        the application address on port 3000.
services:
  wiki-js:
    image: ghcr.io/requarks/wiki:2
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-wiki}
      DB_TYPE: postgres
      DB_PORT: '5432'
    ports:
    - ${PORT:-8402}:3000/tcp
    deploy:
      replicas: 1
