x-nex:
  name: SRS
  summary: Simple, high efficiency and real-time video server, supports RTMP, WebRTC, HLS, HTTP-FLV and SRT
  description: Simple, high efficiency and real-time video server, supports RTMP, WebRTC, HLS, HTTP-FLV and
    SRT.
  category: media
  source: https://github.com/ossrs/srs
  website: https://ossrs.io/
  docs: https://ossrs.io/lts/en-us/docs/v6/doc/getting-started
  primary_service: srs
  options:
    PORT:
      label: Port 8080/tcp
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
    PORT_2:
      label: Port 1935/tcp
      help: The app listens on TCP port 1935 on its default Docker network. Nex does not publish it on host
        addresses.
    PORT_3:
      label: Port 1985/tcp
      help: The app listens on TCP port 1985 on its default Docker network. Nex does not publish it on host
        addresses.
  post_install: Publish RTMP on 1935 and use 8080 for HTTP playback. Keep the HTTP API on a trusted network
    or restrict it at a reverse proxy. WebRTC is outside this TCP profile.
  web:
    port: 8080
services:
  srs:
    image: docker.io/ossrs/srs:6
    deploy:
      replicas: 1
    ports:
    - ${PORT:-8080}:8080/tcp
    - ${PORT_2:-1935}:1935/tcp
    - ${PORT_3:-1985}:1985/tcp
