x-nex:
  name: Diun
  summary: Watch a configured list of container images for updates
  description: Diun starts with a default images.yml in the Configuration folder that watches the Diun
    image itself. Edit images.yml to list the images to watch. To add a notifier or other settings,
    create diun.yml in the same folder; Diun reads it on the next start. Existing files are never
    overwritten. The application checks registries directly.
  category: monitoring
  website: https://crazymax.dev/diun
  source: https://github.com/crazy-max/diun
  docs: https://crazymax.dev/diun/providers/file/
  scalable: false
  primary_service: diun
  architectures:
  - amd64
  - arm64
  options:
    TZ:
      label: Tz
      help: IANA time zone for registry check schedules.
    SCHEDULE:
      label: Check schedule
      help: Cron expression for registry checks, in the time zone above. The default checks every six
        hours. Diun also checks once at start.
    CONFIG:
      label: Configuration folder
      help: Select This host. Choose a writable folder. Diun creates images.yml here on first start if
        it is missing; add an optional diun.yml for notifiers. Include this folder in a stopped Nex
        backup.
    DATA:
      label: Image history
      help: Select This host. Stores the registry state and prior observations. Include this folder in
        a stopped Nex backup.
services:
  diun:
    image: crazymax/diun:latest
    environment:
      DIUN_DB_PATH: /data/diun.db
      DIUN_PROVIDERS_FILE_FILENAME: /config/images.yml
      DIUN_WATCH_SCHEDULE: ${SCHEDULE:-0 */6 * * *}
      TZ: ${TZ:-Etc/UTC}
    entrypoint:
    - /bin/sh
    - -ec
    - |
      if [ ! -f /config/images.yml ]; then
        cat > /config/images.yml <<'IMAGES'
      # Images Diun watches, one entry per image.
      # Reference: https://crazymax.dev/diun/providers/file/
      - name: docker.io/crazymax/diun:latest
      IMAGES
      fi
      if [ -f /config/diun.yml ]; then
        exec diun serve --config /config/diun.yml
      fi
      exec diun serve
    volumes:
    - ${CONFIG}:/config
    - ${DATA}:/data
    deploy:
      replicas: 1
