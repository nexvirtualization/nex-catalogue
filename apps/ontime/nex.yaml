x-nex:
  name: Ontime
  summary: Coordinate event rundowns, timers and cues
  description: Open the rundown editor on a trusted network. To use external OSC controllers, connect to UDP
    8888 on the app address. Configure output destinations through Ontime.
  category: productivity
  website: https://www.getontime.no/
  source: https://github.com/cpvalente/ontime
  docs: https://docs.getontime.no/quick-tips/headless-ontime/
  scalable: false
  primary_service: ontime
  architectures:
  - amd64
  - arm64
  web:
    service: ontime
    scheme: http
    port: 4001
  options:
    TZ:
      label: Tz
      help: IANA time zone for local rundown and event times.
    PORT:
      label: Web port
      help: The app listens on TCP port 4001 on its default Docker network. Nex does not publish it on host
        addresses.
    OSC_PORT:
      label: Osc Port
      help: The app listens on UDP port 8888 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Project and event state
      help: Select This host. Stores event rundowns, settings and backups. Include this folder in a stopped
        Nex backup.
services:
  ontime:
    image: getontime/ontime:latest
    environment:
      TZ: ${TZ:-Etc/UTC}
    ports:
    - ${PORT:-4001}:4001/tcp
    - ${OSC_PORT:-8888}:8888/udp
    volumes:
    - ${DATA}:/data
    deploy:
      replicas: 1
