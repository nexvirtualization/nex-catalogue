# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Weaviate
  summary: Store and query vectors and object metadata
  description: Add collections with your selected external vectorizer, or supply vectors from clients.
    Enable client API access only on the intended network and preserve the data folder.
  category: development
  website: https://github.com/weaviate/weaviate
  source: https://github.com/weaviate/weaviate
  docs: https://docs.weaviate.io/deploy/installation-guides/docker-installation
  primary_service: weaviate
  scalable: false
  license: BSD-3-Clause
  options:
    API_KEY:
      label: Weaviate API key
      type: password
      help: Use Nex Generate and supply this key to your API client.
    DATA:
      label: Vector collections and indexes
      help: Keep vector collections and indexes in this managed folder between restarts.
    PORT:
      label: Service port
      help: Host-published TCP port. With a dedicated Primary network and host publishing off, use the
        application address on port 8080.
    GRPC_PORT:
      label: gRPC port
      help: Host-published TCP port. With a dedicated Primary network and host publishing off, use the
        application address on port 50051.
services:
  weaviate:
    image: docker.io/semitechnologies/weaviate:latest
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'false'
      AUTHENTICATION_APIKEY_ENABLED: 'true'
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${API_KEY}
      AUTHENTICATION_APIKEY_USERS: nex-admin
      AUTHORIZATION_ENABLE_RBAC: 'true'
      AUTHORIZATION_RBAC_ROOT_USERS: nex-admin
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
    volumes:
    - ${DATA}:/var/lib/weaviate
    ports:
    - ${PORT:-8080}:8080/tcp
    - ${GRPC_PORT:-50051}:50051/tcp
    deploy:
      replicas: 1
