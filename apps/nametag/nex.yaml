# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Nametag
  summary: Organize contact histories and reminders
  description: Provision PostgreSQL and use the configured trusted HTTPS origin. Create the first account
    and back up photo data and the database.
  category: productivity
  website: https://github.com/mattogodoy/nametag
  source: https://github.com/mattogodoy/nametag
  docs: https://github.com/mattogodoy/nametag
  primary_service: nametag
  post_install: Provision PostgreSQL and use the configured trusted HTTPS origin. Create the first account
    and back up photo data and the database.
  license: AGPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 3000
  options:
    DATABASE_URL:
      label: Database url
      help: Connection URL for the database. Percent-encode special characters in credentials.
      type: password
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    SIGNING_SECRET:
      label: Signing secret
      help: Use Generate. Nametag needs 32 characters, so a SHA-256 hash of this value is used as
        the key. Keep it unchanged.
      type: password
    CRON_SECRET:
      label: Reminder job secret
      help: Use Generate. At least 16 characters; protects the scheduled reminder endpoint.
      type: password
    PORT:
      label: HTTP port
      help: The app listens on TCP port 3000 on its default Docker network. Nex does not publish it on host
        addresses.
    PHOTOS:
      label: Contact photos
      help: Managed directory mounted at /app/data/photos. Choose storage writable by the application.
services:
  nametag:
    image: ghcr.io/mattogodoy/nametag:latest
    ports:
    - ${PORT:-3000}:3000/tcp
    volumes:
    - ${PHOTOS}:/app/data/photos
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_URL: ${PUBLIC_URL}
      SIGNING_SECRET: ${SIGNING_SECRET}
      CRON_SECRET: ${CRON_SECRET}
    user: 0:0
    entrypoint:
    - /bin/sh
    - -ec
    - |
      chown -R nextjs /app/data/photos
      export NEXTAUTH_SECRET=$$(printf '%s' "$$SIGNING_SECRET" | sha256sum | cut -d' ' -f1)
      exec su -p nextjs -s /bin/sh -c 'exec docker-entrypoint.sh node server.js'
    deploy:
      replicas: 1
