# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Mainsail
  summary: Control a configured Moonraker printer from a browser
  description: Choose the reachable Moonraker instance from Mainsail. Configure Moonraker to authorize
    this frontend origin and protect printer controls with a trusted network.
  category: home-automation
  website: https://github.com/mainsail-crew/mainsail
  source: https://github.com/mainsail-crew/mainsail
  docs: https://docs.mainsail.xyz/
  primary_service: mainsail
  scalable: false
  license: GPL-3.0
  web:
    port: 8080
  options:
    PORT:
      label: Web port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  mainsail:
    image: ghcr.io/mainsail-crew/mainsail:latest
    ports:
    - ${PORT:-8080}:8080/tcp
    deploy:
      replicas: 1
