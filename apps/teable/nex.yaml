# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Teable
  summary: Build spreadsheet-style database applications
  description: Provision PostgreSQL and Redis. Open the configured HTTPS origin and create the first workspace.
  category: productivity
  website: https://teable.ai/
  source: https://github.com/teableio/teable
  docs: https://help.teable.ai/en/deploy/docker-compose
  primary_service: teable
  post_install: Provision PostgreSQL and Redis. Open the configured HTTPS origin and create the first workspace.
  license: AGPL-3.0-only
  architectures:
  - amd64
  - arm64
  web:
    port: 3000
  options:
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    DATABASE_URL:
      label: Database url
      help: Connection URL for the database. Percent-encode special characters in credentials.
      type: password
    SIGNING_SECRET:
      label: Signing secret
      help: Use the credential or secret required by the upstream configuration.
      type: password
    REDIS_URL:
      label: Redis url
      help: Enter the deployment value described in the upstream setup guide.
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 3000 inside Nex.
    DATA:
      label: Application assets
      help: Managed directory mounted at /app/.assets. Choose storage writable by the application.
services:
  teable:
    image: ghcr.io/teableio/teable:release.2026-11-13T02-21-01Z.3890
    ports:
    - ${PORT:-23578}:3000/tcp
    volumes:
    - ${DATA}:/app/.assets
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_URL}
      PRISMA_DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SIGNING_SECRET}
      PORT: '3000'
      BACKEND_CACHE_PROVIDER: redis
      BACKEND_CACHE_REDIS_URI: ${REDIS_URL}
    deploy:
      replicas: 1
