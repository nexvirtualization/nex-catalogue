x-nex:
  name: GlobaLeaks
  summary: Whistleblowing software enabling anyone to easily set up and maintain a secure reporting platform
  description: Whistleblowing software enabling anyone to easily set up and maintain a secure reporting platform.
  category: security
  source: https://github.com/globaleaks/globaleaks-whistleblowing-software
  website: https://www.globaleaks.org/
  docs: https://docs.globaleaks.org/en/stable/setup/installation.html
  primary_service: globaleaks
  options:
    DATA:
      label: Data folder
      help: Choose the Nex-managed folder mounted at /var/globaleaks.
    PORT:
      label: Port 8080/tcp
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
    PORT_2:
      label: Port 8443/tcp
      help: The app listens on TCP port 8443 on its default Docker network. Nex does not publish it on host
        addresses.
  post_install: Complete the initial wizard and confirm the documented initial privacy and HTTPS settings before
    accepting submissions. The upstream image is for AMD64.
  web:
    scheme: https
    port: 8443
  architectures:
  - amd64
services:
  globaleaks:
    image: docker.io/globaleaks/globaleaks:latest
    deploy:
      replicas: 1
    volumes:
    - ${DATA}:/var/globaleaks
    ports:
    - ${PORT:-8080}:8080/tcp
    - ${PORT_2:-8443}:8443/tcp
