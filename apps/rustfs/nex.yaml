# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: RustFS
  summary: Host an S3-compatible object store
  description: This single-node deployment keeps data on one selected host. The S3 endpoint listens on TCP
    9000 and the web console on TCP 9001.
  category: development
  website: https://rustfs.com/download
  source: https://github.com/rustfs/rustfs
  docs: https://docs.rustfs.com/installation/docker/
  primary_service: rustfs
  post_install: Sign in to the console with the configured access key and secret. Configure S3 clients with
    the internal application connection name on port 9000.
  license: Apache-2.0
  architectures:
  - amd64
  - arm64
  web:
    port: 9001
  options:
    ACCESS_KEY:
      label: Access key
      help: Select the administrator S3 access key.
    SECRET_KEY:
      label: Secret key
      help: Generate a strong S3 secret.
      type: password
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 9001 inside Nex.
    S3_PORT:
      label: Published S3 endpoint
      help: Host-published port for the internal 9000/tcp endpoint.
    DATA:
      label: Object storage
      help: Managed directory mounted at /data. Choose storage writable by the application.
services:
  rustfs:
    image: docker.io/rustfs/rustfs:latest
    ports:
    - ${PORT:-20210}:9001/tcp
    - ${S3_PORT:-21210}:9000/tcp
    volumes:
    - ${DATA}:/data
    environment:
      RUSTFS_ACCESS_KEY: ${ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: 'true'
    deploy:
      replicas: 1
