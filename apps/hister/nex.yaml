x-nex:
  name: Hister
  summary: Personal web search engine with automatic indexing of visited websites
  description: Personal web search engine with automatic indexing of visited websites. Supports offline local
    result previews, local files, multi-user handling and optional semantic search.
  category: reading
  source: https://github.com/asciimoo/nogon
  website: https://nogon.eu/
  docs: https://github.com/asciimoo/hister#docker
  primary_service: hister
  options:
    PUBLIC_URL:
      label: Public url
    DATA:
      label: Data folder
      help: Choose the Nex-managed folder mounted at /hister/data.
    PORT:
      label: Port 4433/tcp
      help: The app listens on TCP port 4433 on its default Docker network. Nex does not publish it on host
        addresses.
  post_install: Point the browser companion at the client-facing Hister server URL. Keep the data folder private
    because indexed pages may contain personal content.
  web:
    port: 4433
services:
  hister:
    image: ghcr.io/asciimoo/hister:latest
    deploy:
      replicas: 1
    environment:
      HISTER__SERVER__ADDRESS: 0.0.0.0:4433
      HISTER__SERVER__BASE_URL: ${PUBLIC_URL}
    volumes:
    - ${DATA}:/hister/data
    ports:
    - ${PORT:-4433}:4433/tcp
