# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: SparkyFitness
  summary: Track nutrition, exercise, and personal health metrics
  description: PostgreSQL runs inside this app and the server creates its own database roles. Use HTTPS,
    retain the encryption key, and sign up with the administrator email before restricting signups.
  category: home-automation
  website: https://codewithcj.github.io/SparkyFitness/
  source: https://github.com/CodeWithCJ/SparkyFitness
  docs: https://github.com/CodeWithCJ/SparkyFitness/blob/main/docker/docker-compose.prod.yml
  primary_service: sparkyfitness
  post_install: Sign up with the administrator email before restricting signups. Retain the encryption
    key; encrypted data cannot be read without it.
  license: Non-commercial license
  architectures:
  - amd64
  - arm64
  web:
    port: 80
  options:
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    DB_PASSWORD:
      label: Database owner password
      help: Use Generate to create a unique secret for the PostgreSQL database that runs inside this app.
      type: password
    APP_DB_PASSWORD:
      label: Application database password
      help: Use Generate to create a unique secret. The server creates a restricted database role with it.
      type: password
    DB_DATA:
      label: Database folder
      help: Select This host. Stores the PostgreSQL data. Include this folder in a stopped Nex backup.
    ENCRYPTION_KEY:
      label: Encryption key
      help: Use Generate. A value of exactly 64 hexadecimal characters is used as it is; any other value is
        hashed into one. Keep it unchanged, because stored secrets cannot be read without it.
      type: password
    AUTH_SECRET:
      label: Auth secret
      help: Use Generate to create a unique secret. Keep it unchanged, or every user is signed out.
      type: password
    ADMIN_EMAIL:
      label: Admin email
      help: Email address of the administrator account. Sign up with this address first.
    DISABLE_SIGNUP:
      label: Disable signup
      help: Enter true to refuse new sign-ups after the administrator has signed up. Leave empty for false.
    PORT:
      label: HTTP port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
    BACKUP:
      label: Server backups
      help: Managed directory mounted at /app/SparkyFitnessServer/backup. Choose storage writable by the
        application.
    UPLOADS:
      label: Profile and exercise media
      help: Managed directory mounted at /app/SparkyFitnessServer/uploads. Choose storage writable by the
        application.
services:
  sparkyfitness:
    image: docker.io/codewithcj/sparkyfitness:latest
    ports:
    - ${PORT:-80}:80/tcp
    environment:
      SPARKY_FITNESS_FRONTEND_URL: ${PUBLIC_URL}
      SPARKY_FITNESS_SERVER_HOST: sparkyfitness-server
      SPARKY_FITNESS_SERVER_PORT: '3010'
    deploy:
      replicas: 1
  sparkyfitness-server:
    image: docker.io/codewithcj/sparkyfitness_server:latest
    environment:
      SPARKY_FITNESS_FRONTEND_URL: ${PUBLIC_URL}
      SPARKY_FITNESS_SERVER_PORT: '3010'
      SPARKY_FITNESS_DB_HOST: db
      SPARKY_FITNESS_DB_PORT: '5432'
      SPARKY_FITNESS_DB_NAME: sparkyfitness_db
      SPARKY_FITNESS_DB_USER: sparky
      SPARKY_FITNESS_DB_PASSWORD: ${DB_PASSWORD}
      SPARKY_FITNESS_APP_DB_USER: sparky_app
      SPARKY_FITNESS_APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      BETTER_AUTH_SECRET: ${AUTH_SECRET}
      SPARKY_FITNESS_ADMIN_EMAIL: ${ADMIN_EMAIL}
      SPARKY_FITNESS_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      NODE_ENV: production
    command:
    - sh
    - -c
    - |
      k="$$ENCRYPTION_KEY"
      if ! printf '%s' "$$k" | grep -Eq '^[0-9a-fA-F]{64}$$'; then
        k=$$(printf '%s' "$$k" | sha256sum | cut -d' ' -f1)
      fi
      export SPARKY_FITNESS_API_ENCRYPTION_KEY="$$k"
      exec node --import tsx index.ts
    volumes:
    - ${BACKUP}:/app/SparkyFitnessServer/backup
    - ${UPLOADS}:/app/SparkyFitnessServer/uploads
    # The first start applies all database migrations, which takes longer than the image's own health window.
    healthcheck:
      start_period: 10m
    deploy:
      replicas: 1
  db:
    image: docker.io/postgres:16-alpine
    environment:
      POSTGRES_USER: sparky
      POSTGRES_DB: sparkyfitness_db
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
    - ${DB_DATA}:/var/lib/postgresql/data
    tmpfs:
    - /dev/shm:size=134217728
    deploy:
      replicas: 1
