# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: SparkyFitness
  summary: Track nutrition, exercise, and personal health metrics
  description: Prepare PostgreSQL and the two roles described in the upstream Docker guide. Use HTTPS, retain
    the encryption key, and sign up with the administrator email before restricting signups.
  category: home-automation
  website: https://codewithcj.github.io/SparkyFitness/
  source: https://github.com/CodeWithCJ/SparkyFitness
  docs: https://github.com/CodeWithCJ/SparkyFitness/blob/main/docker/docker-compose.prod.yml
  primary_service: sparkyfitness
  post_install: Prepare PostgreSQL and the two roles described in the upstream Docker guide. Use HTTPS, retain
    the encryption key, and sign up with the administrator email before restricting signups.
  license: Non-commercial license
  architectures:
  - amd64
  - arm64
  web:
    port: 80
  options:
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    DB_HOST:
      label: Db host
      help: Hostname or Nex connection name of the database service.
    DB_PORT:
      label: Db port
      help: Enter the deployment value described in the upstream setup guide.
    DB_NAME:
      label: Db name
      help: Enter the deployment value described in the upstream setup guide.
    DB_USER:
      label: Db user
      help: Enter the deployment value described in the upstream setup guide.
    DB_PASSWORD:
      label: Db password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    APP_DB_USER:
      label: App db user
      help: Enter the deployment value described in the upstream setup guide.
    APP_DB_PASSWORD:
      label: App db password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    ENCRYPTION_KEY:
      label: Encryption key
      help: Use the credential or secret required by the upstream configuration.
      type: password
    AUTH_SECRET:
      label: Auth secret
      help: Use the credential or secret required by the upstream configuration.
      type: password
    ADMIN_EMAIL:
      label: Admin email
      help: Enter the deployment value described in the upstream setup guide.
    DISABLE_SIGNUP:
      label: Disable signup
      help: Enter the deployment value described in the upstream setup guide.
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 80 inside Nex.
    BACKUP:
      label: Server backups
      help: Managed directory mounted at /app/SparkyFitnessServer/backup. Choose storage writable by the
        application.
    UPLOADS:
      label: Profile and exercise media
      help: Managed directory mounted at /app/SparkyFitnessServer/uploads. Choose storage writable by the
        application.
services:
  sparkyfitness:
    image: docker.io/codewithcj/sparkyfitness:latest
    ports:
    - ${PORT:-23588}:80/tcp
    environment:
      SPARKY_FITNESS_FRONTEND_URL: ${PUBLIC_URL}
      SPARKY_FITNESS_SERVER_HOST: sparkyfitness-server
      SPARKY_FITNESS_SERVER_PORT: '3010'
    deploy:
      replicas: 1
  sparkyfitness-server:
    image: docker.io/codewithcj/sparkyfitness_server:latest
    environment:
      SPARKY_FITNESS_FRONTEND_URL: ${PUBLIC_URL}
      SPARKY_FITNESS_SERVER_PORT: '3010'
      SPARKY_FITNESS_DB_HOST: ${DB_HOST}
      SPARKY_FITNESS_DB_PORT: ${DB_PORT:-5432}
      SPARKY_FITNESS_DB_NAME: ${DB_NAME:-sparkyfitness_db}
      SPARKY_FITNESS_DB_USER: ${DB_USER}
      SPARKY_FITNESS_DB_PASSWORD: ${DB_PASSWORD}
      SPARKY_FITNESS_APP_DB_USER: ${APP_DB_USER}
      SPARKY_FITNESS_APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SPARKY_FITNESS_API_ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      BETTER_AUTH_SECRET: ${AUTH_SECRET}
      SPARKY_FITNESS_ADMIN_EMAIL: ${ADMIN_EMAIL}
      SPARKY_FITNESS_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      NODE_ENV: production
    volumes:
    - ${BACKUP}:/app/SparkyFitnessServer/backup
    - ${UPLOADS}:/app/SparkyFitnessServer/uploads
    deploy:
      replicas: 1
