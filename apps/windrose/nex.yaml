# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Windrose
  summary: Host a persistent pirate survival world
  description: >-
    Keep the game folders on This host and choose a registered primary network that players can reach.
    Direct connection is enabled. Enter the app’s Primary address on port 7777 in the game. Both TCP
    and UDP must reach the app. SteamCMD installs the server on first boot and checks for updates
    on restart. Make a stopped backup before applying game updates.
  category: games
  website: https://store.steampowered.com/app/3041230/
  source: https://github.com/indifferentbroccoli/windrose-server-docker
  docs: https://github.com/indifferentbroccoli/windrose-server-docker#readme
  license: Proprietary game server
  architectures:
    - amd64
  tags:
    - survival
    - multiplayer
  options:
    SERVER_NAME:
      label: Server name
      help: Name displayed in the game’s server browser.
    JOIN_PASSWORD:
      label: Join password
      type: password
      help: Choose a password and share it with your players.
    DATA:
      label: Server data
      help: Choose This host and include this folder in stopped backups.
services:
  windrose:
    image: docker.io/indifferentbroccoli/windrose-server-docker:latest
    environment:
      SERVER_NAME: ${SERVER_NAME:-Nex Windrose}
      SERVER_PASSWORD: ${JOIN_PASSWORD}
      USE_DIRECT_CONNECTION: 'true'
      PUID: '1000'
      PGID: '1000'
      UPDATE_ON_START: 'true'
    expose:
      - 7777/tcp
      - 7777/udp
    volumes:
      - ${DATA}:/home/steam/server-files
    stop_grace_period: 90s
    deploy:
      replicas: 1
