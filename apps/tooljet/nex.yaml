x-nex:
  name: ToolJet
  summary: Build internal business apps from your connected data
  description: Provision PostgreSQL, set the full web URL, and configure initial workspace access from
    a trusted network.
  category: development
  website: https://github.com/ToolJet/ToolJet
  source: https://github.com/ToolJet/ToolJet
  docs: https://docs.tooljet.ai/docs/setup/docker/
  primary_service: tooljet
  scalable: false
  license: AGPL-3.0
  architectures:
  - amd64
  web:
    port: 80
  options:
    BASE_URL:
      label: Public web address
      help: Full browser-facing URL including scheme.
    DB_HOST:
      label: PostgreSQL hostname
      help: Reachable app connection name or hostname.
    DB_NAME:
      label: Database name
      help: Prepared ToolJet database. Leave empty for tooljet. ToolJet also uses a second database with
        _db added to this name (tooljet_db by default); create it too, or let the user create databases.
    DB_USER:
      label: Database user
      help: Prepared PostgreSQL application user. Leave empty for tooljet.
    DB_PASSWORD:
      label: Database password
      type: password
      help: Password for that PostgreSQL application user.
    LOCKBOX_KEY:
      label: Encryption key
      type: password
      generate: {format: hex, length: 64}
      help: Use Generate, which makes 64 hexadecimal characters. If Generate gives letters and digits only
        (older Nex), paste the output of openssl rand -hex 32 instead. Retain it for restore.
    SESSION_KEY:
      label: Session signing key
      type: password
      help: Supply the upstream-required random signing secret and retain it for restore.
    PORT:
      label: Web port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  tooljet:
    image: docker.io/tooljet/tooljet-ce:ce-lts-latest
    environment:
      SERVE_CLIENT: 'true'
      PORT: '80'
      TOOLJET_HOST: ${BASE_URL}
      PG_HOST: ${DB_HOST}
      PG_DB: ${DB_NAME:-tooljet}
      PG_USER: ${DB_USER:-tooljet}
      PG_PASS: ${DB_PASSWORD}
      TOOLJET_DB: ${DB_NAME:-tooljet}_db
      TOOLJET_DB_HOST: ${DB_HOST}
      TOOLJET_DB_PORT: '5432'
      TOOLJET_DB_USER: ${DB_USER:-tooljet}
      TOOLJET_DB_PASS: ${DB_PASSWORD}
      LOCKBOX_MASTER_KEY: ${LOCKBOX_KEY}
      SECRET_KEY_BASE: ${SESSION_KEY}
    command:
    - npm
    - run
    - start:prod
    ports:
    - ${PORT:-80}:80/tcp
    deploy:
      replicas: 1
