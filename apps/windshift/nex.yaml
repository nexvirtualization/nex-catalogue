# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Windshift
  summary: Plan projects and track work in Windshift
  description: Set the HTTPS base URL and a stable random signing secret. Finish first-run setup and back
    up the application data.
  category: productivity
  website: https://windshift.sh/
  source: https://github.com/Windshiftapp/core
  docs: https://windshift.sh/self-hosting/02-deployment/01-docker
  primary_service: windshift
  post_install: Set the HTTPS base URL and a stable random signing secret. Finish first-run setup and back
    up the application data.
  license: AGPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 8080
  options:
    SIGNING_SECRET:
      label: Signing secret
      help: Use the credential or secret required by the upstream configuration.
      type: password
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 8080 inside Nex.
    DATA:
      label: Application database and attachments
      help: Managed directory mounted at /data. Choose storage writable by the application.
services:
  windshift:
    image: ghcr.io/windshiftapp/windshift:latest
    ports:
    - ${PORT:-23563}:8080/tcp
    volumes:
    - ${DATA}:/data
    environment:
      SSO_SECRET: ${SIGNING_SECRET}
      BASE_URL: ${PUBLIC_URL}
    deploy:
      replicas: 1
