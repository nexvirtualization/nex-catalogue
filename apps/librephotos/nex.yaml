# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: LibrePhotos
  summary: Index a private photo collection and create albums
  description: For a new install, create a dedicated database on a reachable PostgreSQL 15 or newer
    server and give the LibrePhotos user ownership of that database. Enter its host, port, name,
    user and password in the install form. After startup, open LibrePhotos on a trusted network to
    create the first administrator and scan the photo library.
  category: media
  website: https://github.com/LibrePhotos/librephotos
  source: https://github.com/LibrePhotos/librephotos
  docs: https://docs.librephotos.com/docs/installation/unified-deployment/
  primary_service: librephotos
  scalable: false
  license: MIT
  web:
    port: 8001
  options:
    PHOTOS:
      label: Photo library
      help: Keep photo library in this managed folder between restarts.
    DATA:
      label: Protected media
      help: Keep thumbnails and other generated media in this managed folder between restarts.
    LOGS:
      label: Application logs
      help: Keep application logs in this managed folder between restarts.
    CACHE:
      label: Model cache
      help: Keep model cache in this managed folder between restarts.
    PORT:
      label: Web port
      help: The app listens on TCP port 8001 on its default Docker network. Nex does not publish it on host
        addresses.
    DB_HOST:
      label: Database host
      help: Address of the PostgreSQL server. Use the database app connection name on a Nex app network.
    DB_PORT:
      label: Database port
      help: TCP port of the PostgreSQL server. Leave empty for 5432.
    DB_NAME:
      label: Database name
      help: Dedicated database owned by the LibrePhotos user.
    DB_USER:
      label: Database user
      help: Owner of the dedicated database.
    DB_PASS:
      label: Database password
      type: password
      help: Password for the database user.
services:
  librephotos:
    image: docker.io/reallibrephotos/librephotos-unified:latest
    environment:
      SERVE_FRONTEND: "true"
      # The frontend-serving settings otherwise default to SQLite.
      DB_BACKEND: postgresql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    volumes:
    - ${PHOTOS}:/data
    - ${DATA}:/protected_media
    - ${LOGS}:/logs
    - ${CACHE}:/root/.cache
    ports:
    - ${PORT:-8001}:8001/tcp
    deploy:
      replicas: 1
