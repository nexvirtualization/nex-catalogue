# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Open-Meteo
  summary: Serve forecasts from synchronized weather datasets
  description: Select one host with sufficient storage for imported weather data. The companion synchronizes
    the upstream ICON temperature dataset. Forecast requests are populated after synchronization completes.
    Follow upstream instructions to add more models and variables.
  category: tools
  website: https://open-meteo.com/
  source: https://github.com/open-meteo/open-meteo
  docs: https://github.com/open-meteo/open-meteo/blob/main/docker-compose.yml
  scalable: false
  primary_service: open-meteo
  architectures:
  - amd64
  - arm64
  web:
    service: open-meteo
    scheme: http
    port: 8080
    path: /v1/forecast
  options:
    PORT:
      label: Web port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Weather datasets
      help: Select This host. Stores downloaded forecast data and indexes. Include this folder in a stopped
        Nex backup.
services:
  open-meteo:
    image: ghcr.io/open-meteo/open-meteo:latest
    user: '0'
    environment:
      LOG_LEVEL: info
    command:
    - serve
    - --env
    - production
    - --hostname
    - 0.0.0.0
    - --port
    - '8080'
    ports:
    - ${PORT:-8080}:8080/tcp
    volumes:
    - ${DATA}:/app/data
    deploy:
      replicas: 1
  sync:
    image: ghcr.io/open-meteo/open-meteo:latest
    # Root only to hand the shared data folder to the image user, then sync runs as openmeteo.
    user: '0'
    entrypoint:
    - /bin/sh
    - -ec
    - |
      chown -R openmeteo:openmeteo /app/data
      exec setpriv --reuid=openmeteo --regid=openmeteo --init-groups ./openmeteo-api "$$@"
    - sh
    command:
    - sync
    - dwd_icon
    - temperature_2m
    - --past-days
    - '2'
    - --repeat-interval
    - '1'
    - --concurrent
    - '1'
    environment:
      LOG_LEVEL: info
    volumes:
    - ${DATA}:/app/data
    deploy:
      replicas: 1
