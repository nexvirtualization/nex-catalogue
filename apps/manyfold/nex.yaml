# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Manyfold
  summary: Organize digital models for 3D printing
  description: The upstream all-in-one image provides its database and cache. Create the initial user
    and add a Library using /models as the media path. The library folder must be writable by the configured
    account.
  category: tools
  website: https://manyfold.app
  source: https://github.com/manyfold3d/manyfold
  docs: https://manyfold.app/get-started/docker
  scalable: false
  primary_service: manyfold
  architectures:
  - amd64
  - arm64
  web:
    service: manyfold
    scheme: http
    port: 3214
  options:
    SESSION_SECRET:
      label: Session signing secret
      help: Enter a long random secret for the session cookie.
      type: password
    PUID:
      label: Puid
      help: Numeric UID of the model library owner.
    PGID:
      label: Pgid
      help: Numeric GID of the model library owner.
    PORT:
      label: Web port
      help: The app listens on TCP port 3214 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Asset catalogue
      help: Use host-local storage for the embedded database. The configured UID and GID must be able
        to write to the folder and its data. Include this folder in a stopped Nex backup.
    MODEL_LIBRARY:
      label: 3D model library
      help: The configured UID and GID must be able to write to the model folder and its contents.
        Include this folder in a stopped Nex backup.
services:
  manyfold:
    image: ghcr.io/manyfold3d/manyfold-solo:latest
    # Managed folders start owned by root, so hand them to the configured account first: SQLite must be
    # able to create its journal files next to the database.
    entrypoint:
    - /bin/sh
    - -ec
    - |
      chown -R "$${PUID}:$${PGID}" /config
      chown "$${PUID}:$${PGID}" /models
      exec /init
    environment:
      SECRET_KEY_BASE: ${SESSION_SECRET}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    ports:
    - ${PORT:-3214}:3214/tcp
    volumes:
    - ${DATA}:/config
    - ${MODEL_LIBRARY}:/models
    deploy:
      replicas: 1
