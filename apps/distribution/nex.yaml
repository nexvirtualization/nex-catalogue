x-nex:
  name: Distribution Registry
  summary: Run a load-balanced container image registry on S3
  description: An OCI image registry backed by AWS S3 or a compatible object store. All copies share the bucket,
    upload-signing secret and the single registry login you set below. On every start the app installs the
    htpasswd tool from the Alpine package mirror (internet access needed) and builds its bcrypt password file
    from that login, so no file needs preparing. Terminate TLS at a reverse proxy and forward to the app on port
    5000. Bootstrap with one copy, test login and push, then increase Copies. Back up the S3 bucket and
    credentials independently.
  category: development
  website: https://distribution.github.io/distribution/about/deploying/
  source: https://github.com/distribution/distribution
  docs: https://distribution.github.io/distribution/about/deploying/
  license: Apache-2.0
  primary_service: distribution
  web:
    port: 5000
    path: /v2/
  scale:
    - distribution
  options:
    PORT:
      label: Port
      help: The app listens on TCP port 5000 on its default Docker network. Nex does not publish it on host
        addresses.
    REGISTRY_USER:
      label: Registry username
      help: Login name for docker login. Letters, digits, dots, dashes and underscores only; no colon.
        Leave empty for registry.
    REGISTRY_PASSWORD:
      label: Registry password
      help: Password for docker login, at most 72 characters (bcrypt limit). Use Generate for a strong value.
        Changing it takes effect after the app restarts.
      type: password
    S3_BUCKET:
      label: S3 bucket
      help: Create a private bucket first. Use a dedicated bucket for each registry.
    S3_REGION:
      label: S3 region
      help: Region of the bucket, for example ap-southeast-2. Must be a valid region name. Leave empty for
        us-east-1.
    S3_ENDPOINT:
      label: Custom S3 endpoint
      help: Optional HTTPS endpoint for a self-hosted S3-compatible service. Leave blank for AWS S3.
    S3_ACCESS_KEY:
      label: S3 access key ID
      help: Use credentials scoped to this registry bucket.
    S3_SECRET_KEY:
      label: S3 secret access key
      help: Keep this credential private.
      type: password
    HTTP_SECRET:
      label: Upload-signing secret
      help: Generate once and use the same value across all copies and restarts.
      type: password
  post_install: Connect your HTTPS reverse proxy to port 5000, then test docker login with the registry username
    and password, an image push and a pull. Increase Copies after this succeeds.
services:
  distribution:
    image: docker.io/distribution/distribution:latest
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        for attempt in 1 2 3 4 5; do
          apk add --no-cache apache2-utils >/dev/null 2>&1 && break
          sleep 5
        done
        printf '%s' "$$NEX_REGISTRY_PASSWORD" | htpasswd -iBc /tmp/htpasswd "$$NEX_REGISTRY_USER"
        unset NEX_REGISTRY_PASSWORD NEX_REGISTRY_USER
        exec registry serve /etc/distribution/config.yml
    ports:
      - ${PORT:-5000}:5000/tcp
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Nex Container Registry
      REGISTRY_AUTH_HTPASSWD_PATH: /tmp/htpasswd
      NEX_REGISTRY_USER: ${REGISTRY_USER:-registry}
      NEX_REGISTRY_PASSWORD: ${REGISTRY_PASSWORD}
      REGISTRY_HTTP_SECRET: ${HTTP_SECRET}
      REGISTRY_STORAGE: s3
      REGISTRY_STORAGE_S3_BUCKET: ${S3_BUCKET}
      REGISTRY_STORAGE_S3_REGION: ${S3_REGION:-us-east-1}
      REGISTRY_STORAGE_S3_REGIONENDPOINT: "${S3_ENDPOINT:-}"
      REGISTRY_STORAGE_S3_FORCEPATHSTYLE: 'true'
      REGISTRY_STORAGE_S3_ACCESSKEY: ${S3_ACCESS_KEY}
      REGISTRY_STORAGE_S3_SECRETKEY: ${S3_SECRET_KEY}
      REGISTRY_STORAGE_REDIRECT_DISABLE: 'true'
    deploy:
      replicas: 1
