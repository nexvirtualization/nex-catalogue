x-nex:
  name: Distribution Registry
  summary: Run a load-balanced container image registry on S3
  description: >-
    An OCI image registry backed by AWS S3 or a compatible object store. All copies share the bucket, upload-signing secret and bcrypt
    password file. Terminate TLS at a reverse proxy and forward to the app on port 5000. Disable direct host
    publishing when the proxy is on the Nex application network. Bootstrap with one copy, test login and push,
    then increase Copies. Back up the S3 bucket and credentials independently.
  category: development
  website: https://distribution.github.io/distribution/about/deploying/
  source: https://github.com/distribution/distribution
  docs: https://distribution.github.io/distribution/about/deploying/
  license: Apache-2.0
  primary_service: distribution
  scale:
    - distribution
  options:
    PORT:
      label: Published port
      help: Keep host publishing off for access only through the Nex application network. If host publishing
        is enabled, restrict the endpoint to trusted networks.
    AUTH:
      label: Registry password file
      help: Choose a protected cluster share containing a file named htpasswd with bcrypt credentials. Generate
        or update it with htpasswd -B. Restart all copies after changes.
    S3_BUCKET:
      label: S3 bucket
      help: Create a private bucket first. Use a dedicated bucket for each registry.
    S3_REGION:
      label: S3 region
      help: Region of the bucket, for example ap-southeast-2.
    S3_ENDPOINT:
      label: Custom S3 endpoint
      help: Optional HTTPS endpoint for a self-hosted S3-compatible service. Leave blank for AWS S3.
    S3_ACCESS_KEY:
      label: S3 access key ID
      help: Use credentials scoped to this registry bucket.
    S3_SECRET_KEY:
      label: S3 secret access key
      help: Keep this credential private.
      type: password
    HTTP_SECRET:
      label: Upload-signing secret
      help: Generate once and use the same value across all copies and restarts.
      type: password
  post_install: Connect your HTTPS reverse proxy to port 5000, then test docker login and an image push and
    pull. Increase Copies after this succeeds.
services:
  distribution:
    image: docker.io/distribution/distribution:latest
    ports:
      - ${PORT:-5000}:5000/tcp
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Nex Container Registry
      REGISTRY_AUTH_HTPASSWD_PATH: /nex-auth/htpasswd
      REGISTRY_HTTP_SECRET: ${HTTP_SECRET}
      REGISTRY_STORAGE: s3
      REGISTRY_STORAGE_S3_BUCKET: ${S3_BUCKET}
      REGISTRY_STORAGE_S3_REGION: ${S3_REGION}
      REGISTRY_STORAGE_S3_REGIONENDPOINT: "${S3_ENDPOINT:-}"
      REGISTRY_STORAGE_S3_FORCEPATHSTYLE: 'true'
      REGISTRY_STORAGE_S3_ACCESSKEY: ${S3_ACCESS_KEY}
      REGISTRY_STORAGE_S3_SECRETKEY: ${S3_SECRET_KEY}
      REGISTRY_STORAGE_REDIRECT_DISABLE: 'true'
    volumes:
      - ${AUTH}:/nex-auth:ro
    deploy:
      replicas: 1
