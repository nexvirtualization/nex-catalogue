# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: sftpgo Community Edition
  summary: Host SFTP file transfers and manage users in a web console
  description: The standalone image keeps SFTPGo state separate from files. SFTP listens on TCP 2022 inside
    Nex.
  category: management
  website: https://github.com/drakkan/sftpgo
  source: https://github.com/drakkan/sftpgo
  docs: https://docs.sftpgo.com/latest/docker/
  primary_service: sftpgo
  post_install: Open /web/admin for initial setup and create the first admin. Configure users and folders
    in the console, and enable HTTPS for remote administration.
  license: AGPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 8080
  options:
    PORT:
      label: HTTP port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
    SFTP_PORT:
      label: SFTP port
      help: The app listens on TCP port 2022 on its default Docker network. Nex does not publish it on host
        addresses.
    STATE:
      label: Application state
      help: Managed directory mounted at /var/lib/sftpgo. Choose storage writable by the application.
    DATA:
      label: File storage and backups
      help: Managed directory mounted at /srv/sftpgo. Choose storage writable by the application.
services:
  sftpgo:
    image: docker.io/drakkan/sftpgo:latest
    ports:
    - ${PORT:-8080}:8080/tcp
    - ${SFTP_PORT:-2022}:2022/tcp
    volumes:
    - ${STATE}:/var/lib/sftpgo
    - ${DATA}:/srv/sftpgo
    deploy:
      replicas: 1
