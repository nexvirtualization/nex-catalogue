# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: PrivateBin
  summary: Share encrypted text pastes through your browser
  description: Use an HTTPS proxy for client access. Content is encrypted in the browser. Set any network
    access policy at the proxy.
  category: tools
  website: https://github.com/PrivateBin/PrivateBin
  source: https://github.com/PrivateBin/PrivateBin
  docs: https://github.com/PrivateBin/docker-nginx-fpm-alpine
  primary_service: privatebin
  scalable: false
  license: Apache-2.0
  web:
    port: 8080
  options:
    DATA:
      label: Encrypted pastes
      help: Encrypted pastes and expiry metadata.
    PORT:
      label: Web port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  privatebin:
    image: docker.io/privatebin/nginx-fpm-alpine:latest
    volumes:
    - ${DATA}:/srv/data
    ports:
    - ${PORT:-8080}:8080/tcp
    deploy:
      replicas: 1
