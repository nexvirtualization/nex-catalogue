# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Kan
  summary: Organize projects and tasks in Kanban boards
  description: Prepare PostgreSQL and run the same release of the upstream kan-migrate image against that
    database before starting this app. Use the configured HTTPS address.
  category: productivity
  website: https://kan.bn/
  source: https://github.com/kanbn/kan
  docs: https://github.com/kanbn/kan/blob/main/docker-compose.yml
  primary_service: kan
  post_install: Prepare PostgreSQL and run the same release of the upstream kan-migrate image against that
    database before starting this app. Use the configured HTTPS address.
  license: AGPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 3000
  options:
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    SIGNING_SECRET:
      label: Signing secret
      help: Use the credential or secret required by the upstream configuration.
      type: password
    DATABASE_URL:
      label: Database url
      help: Connection URL for the database. Percent-encode special characters in credentials.
      type: password
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 3000 inside Nex.
services:
  kan:
    image: ghcr.io/kanbn/kan:0.7.0
    ports:
    - ${PORT:-23493}:3000/tcp
    environment:
      NEXT_PUBLIC_BASE_URL: ${PUBLIC_URL}
      BETTER_AUTH_SECRET: ${SIGNING_SECRET}
      POSTGRES_URL: ${DATABASE_URL}
      NEXT_PUBLIC_ALLOW_CREDENTIALS: 'true'
      NEXT_PUBLIC_DISABLE_EMAIL: 'true'
    deploy:
      replicas: 1
