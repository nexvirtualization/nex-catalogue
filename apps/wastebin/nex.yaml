# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Wastebin
  summary: Share text pastes with expiration and optional encryption
  description: Keep access restricted when used for internal material. Preserve the configured password
    salt to keep encrypted pastes readable after redeployment.
  category: tools
  website: https://github.com/matze/wastebin
  source: https://github.com/matze/wastebin
  docs: https://github.com/matze/wastebin
  primary_service: wastebin
  scalable: false
  license: MIT
  architectures:
  - amd64
  web:
    port: 8088
  options:
    PASSWORD_SALT:
      label: Paste password salt
      type: password
      help: Use Nex Generate. Retain this value across restores.
    DATA:
      label: Paste database
      help: Managed folder for the paste database (state.db). A small helper service makes it writable by
        the application user (UID 10001) on every start.
    PORT:
      label: Web port
      help: The app listens on TCP port 8088 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  wastebin:
    image: docker.io/quxfoo/wastebin:latest
    environment:
      WASTEBIN_DATABASE_PATH: /data/state.db
      WASTEBIN_PASSWORD_SALT: ${PASSWORD_SALT}
      TMPDIR: /data
    volumes:
    - ${DATA}:/data
    ports:
    - ${PORT:-8088}:8088/tcp
    deploy:
      replicas: 1
      # Retry quickly: wastebin may start before the helper below has made /data writable on first start.
      restart_policy:
        condition: any
        delay: 1s
  # The wastebin image has no shell, so this helper hands the data folder to the app user and waits.
  data-init:
    image: docker.io/library/busybox:latest
    entrypoint:
    - /bin/sh
    - -ec
    - |
      chown -R 10001:10001 /data
      exec tail -f /dev/null
    volumes:
    - ${DATA}:/data
    deploy:
      replicas: 1
