# Deployment reference: https://raw.githubusercontent.com/remvze/moodist/HEAD/docker-compose.yml
x-nex:
  name: Moodist
  summary: Ambient sound mixer for focus sessions, background noise, and custom soundscapes
  category: media
  description: Ambient sound mixer for focus sessions, background noise, and custom soundscapes.
  source: https://github.com/remvze/moodist
  website: https://moodist.mvze.net/
  docs: https://moodist.mvze.net/
  primary_service: moodist
  options:
    PORT:
      label: TCP port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
  web:
    port: 8080
  post_install: Open Moodist to play and mix ambient sounds in the browser.
services:
  moodist:
    image: ghcr.io/remvze/moodist:latest
    deploy:
      replicas: 1
    ports:
    - ${PORT:-8080}:8080/tcp
