x-nex:
  name: Cronicle
  summary: Simple, distributed task scheduler and runner with a web based UI
  description: Simple, distributed task scheduler and runner with a web based UI.
  category: management
  source: https://github.com/jhuckaby/Cronicle
  website: https://cronicle.net/
  docs: https://github.com/soulteary/docker-cronicle#readme
  primary_service: cronicle
  options:
    TZ:
      label: Tz
    DATA:
      label: Data folder
      help: Choose the Nex-managed folder mounted at /opt/cronicle/data.
    LOGS:
      label: Logs folder
      help: Choose the Nex-managed folder mounted at /opt/cronicle/logs.
    PLUGINS:
      label: Plugins folder
      help: Choose the Nex-managed folder mounted at /opt/cronicle/plugins.
    PORT:
      label: Port 3012/tcp
      help: The app listens on TCP port 3012 on its default Docker network. Nex does not publish it on host
        addresses.
  post_install: Start a single scheduler on a trusted network. Change the initial administrator password and
    avoid sharing the interface with untrusted users.
  web:
    port: 3012
services:
  cronicle:
    image: docker.io/soulteary/cronicle:0.9.80
    deploy:
      replicas: 1
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${DATA}:/opt/cronicle/data
    - ${LOGS}:/opt/cronicle/logs
    - ${PLUGINS}:/opt/cronicle/plugins
    ports:
    - ${PORT:-3012}:3012/tcp
