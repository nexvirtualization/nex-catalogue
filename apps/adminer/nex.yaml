# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Adminer
  summary: Manage SQL databases in a browser
  description: >-
    Connect to PostgreSQL, MariaDB or MySQL using its database credentials. Use the database installation’s
    Name inside applications as the server address. Use HTTPS on a trusted network or put the tool behind
    an authenticating reverse proxy. Browser login sessions belong to this copy.
  category: development
  website: https://hub.docker.com/_/adminer
  source: https://github.com/vrana/adminer
  docs: https://hub.docker.com/_/adminer
  license: Apache-2.0 OR GPL-2.0-only
  primary_service: adminer
  web:
    port: 8080
  options:
    PORT:
      label: Port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  adminer:
    image: docker.io/library/adminer:latest
    ports:
      - ${PORT:-8080}:8080/tcp
    deploy:
      replicas: 1
