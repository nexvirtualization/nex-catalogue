# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Zoraxy
  summary: General purpose HTTP reverse proxy and forwarding tool
  description: General purpose HTTP reverse proxy and forwarding tool.
  category: networking
  source: https://github.com/tobychui/zoraxy
  website: https://zoraxy.aroz.org/
  docs: https://github.com/tobychui/zoraxy#docker
  primary_service: zoraxy
  options:
    CONFIG:
      label: Config folder
      help: Choose the Nex-managed folder mounted at /opt/zoraxy/config.
    PLUGINS:
      label: Plugins folder
      help: Choose the Nex-managed folder mounted at /opt/zoraxy/plugin.
    PORT:
      label: Port 8000/tcp
      help: The app listens on TCP port 8000 on its default Docker network. Nex does not publish it on host
        addresses.
    PORT_2:
      label: Port 80/tcp
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
    PORT_3:
      label: Port 443/tcp
      help: The app listens on TCP port 443 on its default Docker network. Nex does not publish it on host
        addresses.
    PORT_4:
      label: Port 443/udp
      help: The app listens on UDP port 443 on its default Docker network. Nex does not publish it on host
        addresses.
  post_install: Complete setup on the 8000 management listener. Use the private Nex DNS name of your target
    service and keep the management listener trusted.
  web:
    port: 8000
services:
  zoraxy:
    image: docker.io/zoraxydocker/zoraxy:latest
    deploy:
      replicas: 1
    volumes:
    - ${CONFIG}:/opt/zoraxy/config
    - ${PLUGINS}:/opt/zoraxy/plugin
    ports:
    - ${PORT:-8000}:8000/tcp
    - ${PORT_2:-80}:80/tcp
    - ${PORT_3:-443}:443/tcp
    - ${PORT_4:-22811}:443/udp
