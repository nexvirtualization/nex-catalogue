# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Kopia
  summary: Manage encrypted backup snapshots in a web interface
  description: Kopia reads a selected source folder and can write to a separate repository. The HTTP backend
    requires authentication; use HTTPS for remote access.
  category: management
  website: https://kopia.io/
  source: https://github.com/kopia/kopia
  docs: https://kopia.io/docs/installation/
  primary_service: kopia
  post_install: Sign in with the configured account, connect a backup repository, and create a snapshot for
    /data. Verify a restore before relying on the schedule.
  license: Apache-2.0
  architectures:
  - amd64
  - arm64
  web:
    port: 51515
  options:
    USER:
      label: Email or login name
      help: Account identifier supplied to the application.
    PASSWORD:
      label: Account password
      help: Choose a strong password for this deployment.
      type: password
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 51515 inside Nex.
    CONFIG:
      label: Kopia configuration
      help: Managed directory mounted at /app/config. Choose storage writable by the application.
    CACHE:
      label: Repository cache
      help: Managed directory mounted at /app/cache. Choose storage writable by the application.
    SOURCE:
      label: Backup source
      help: Managed directory mounted at /data. Choose storage readable by the application.
    REPOS:
      label: Local backup destination
      help: Managed directory mounted at /repository. Choose storage writable by the application.
services:
  kopia:
    image: docker.io/kopia/kopia:latest
    ports:
    - ${PORT:-20256}:51515/tcp
    volumes:
    - ${CONFIG}:/app/config
    - ${CACHE}:/app/cache
    - ${SOURCE}:/data:ro
    - ${REPOS}:/repository
    command:
    - server
    - start
    - --insecure
    - --address=0.0.0.0:51515
    - --server-username=${USER:-kopia}
    - --server-password=${PASSWORD}
    deploy:
      replicas: 1
