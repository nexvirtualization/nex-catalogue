# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Campfire
  summary: Run a private group chat server
  description: Campfire stores chat history, accounts and attachments together in managed local storage.
    TLS terminates at a reverse proxy.
  category: communication
  website: https://once.com/campfire
  source: https://github.com/basecamp/once-campfire
  docs: https://github.com/basecamp/once-campfire/blob/main/docs/self-hosting.md
  primary_service: campfire
  post_install: Set up the public HTTPS proxy before inviting users, then complete the initial setup. Back
    up Storage and the configured signing key.
  license: MIT
  architectures:
  - amd64
  - arm64
  web:
    port: 80
  options:
    SECRET_KEY_BASE:
      label: Signing secret
      help: Generate and retain a cryptographic Rails secret.
      type: password
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 80 inside Nex.
    DATA:
      label: Chat storage
      help: Managed directory mounted at /rails/storage. Choose storage writable by the application.
services:
  campfire:
    image: ghcr.io/basecamp/once-campfire:latest
    ports:
    - ${PORT:-20232}:80/tcp
    volumes:
    - ${DATA}:/rails/storage
    environment:
      DISABLE_SSL: 'true'
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      SKIP_TELEMETRY: 'true'
    deploy:
      replicas: 1
