# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Apache Kafka
  summary: Publish and consume event streams through a Kafka broker
  description: Use this single-node KRaft broker on the private application network. Set the exactly
    reachable broker address including port before connecting clients.
  category: development
  website: https://github.com/apache/kafka
  source: https://github.com/apache/kafka
  docs: https://kafka.apache.org/quickstart
  primary_service: kafka
  scalable: false
  license: Apache-2.0
  options:
    BROKER_ADDRESS:
      label: Broker address
      help: Client-resolvable broker hostname and port, for example broker.example.test:9092. Port
        9092 is added when you enter only a hostname.
    DATA:
      label: Broker records and metadata
      help: Choose This host. The broker takes ownership of this folder at start, so a share must allow
        ownership changes.
    PORT:
      label: Service port
      help: The app listens on TCP port 9092 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  kafka:
    image: docker.io/apache/kafka:latest
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      BROKER_ADDRESS: ${BROKER_ADDRESS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /usr/logs
    user: 0:0
    entrypoint:
    - /bin/sh
    - -ec
    - |
      chown -R appuser:appuser /usr/logs
      case "$$BROKER_ADDRESS" in *:*) ;; *) BROKER_ADDRESS="$$BROKER_ADDRESS:9092" ;; esac
      export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://$$BROKER_ADDRESS"
      exec su -p appuser -s /bin/sh -c 'exec /__cacert_entrypoint.sh /etc/kafka/docker/run'
    volumes:
    - ${DATA}:/usr/logs
    ports:
    - ${PORT:-9092}:9092/tcp
    deploy:
      replicas: 1
