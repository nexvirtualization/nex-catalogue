x-nex:
  name: ezbookkeeping
  summary: Lightweight personal bookkeeping app hosted by yourself
  description: Lightweight personal bookkeeping app hosted by yourself.
  category: finance
  source: https://github.com/mayswind/ezbookkeeping
  website: https://ezbookkeeping.mayswind.net/
  docs: https://ezbookkeeping.mayswind.net/installation/
  primary_service: ezbookkeeping
  options:
    SECRET_KEY:
      label: Secret key
      type: password
      help: Use a unique value and keep it with the application backups.
    PUBLIC_HOST:
      label: Public host
    DATA:
      label: Data folder
      help: Choose the Nex-managed folder mounted at /ezbookkeeping/storage.
    PORT:
      label: Port 8080/tcp
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
  post_install: Create your first account and keep the SQLite data folder and secret together in backups.
  web:
    port: 8080
services:
  ezbookkeeping:
    image: docker.io/mayswind/ezbookkeeping:latest
    deploy:
      replicas: 1
    environment:
      EBK_DATABASE_TYPE: sqlite3
      EBK_SECURITY_SECRET_KEY: ${SECRET_KEY}
      EBK_SERVER_DOMAIN: ${PUBLIC_HOST}
      EBK_LOG_MODE: console
    volumes:
    - ${DATA}:/ezbookkeeping/storage
    ports:
    - ${PORT:-8080}:8080/tcp
