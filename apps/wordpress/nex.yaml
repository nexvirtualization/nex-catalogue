x-nex:
  name: WordPress
  summary: Build and publish a WordPress website
  description: Create a database and user in MariaDB or MySQL first. Finish the WordPress installer immediately
    on a trusted network. Use the intended public address later through an HTTPS reverse proxy.
  category: productivity
  website: https://wordpress.org/
  source: https://github.com/WordPress/WordPress
  docs: https://hub.docker.com/_/wordpress
  scalable: false
  primary_service: wordpress
  architectures:
  - amd64
  - arm64
  web:
    service: wordpress
    scheme: http
    port: 80
  works_with:
  - mariadb
  - mysql
  options:
    DB_HOST:
      label: Database host
      help: Host or Nex application name of the prepared database service. It must be reachable on internal
        port 3306.
    DB_USER:
      label: Database user
      help: Create a dedicated non-root database user for this application.
    DB_NAME:
      label: Database name
      help: Create a database owned by the configured user first. The default is wordpress.
    DB_PASSWORD:
      label: Database password
      help: Password for the dedicated database account.
      type: password
    PORT:
      label: Web port
      help: Host-published HTTP port when publishing is enabled. With a dedicated Primary network, use
        the application address on port 80.
    DATA:
      label: Site content
      help: Select This host. Stores the site files, configuration, plugins, themes and media. Include
        this folder in a stopped Nex backup.
services:
  wordpress:
    image: wordpress:latest
    environment:
      WORDPRESS_DB_HOST: ${DB_HOST}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
    ports:
    - ${PORT:-8403}:80/tcp
    volumes:
    - ${DATA}:/var/www/html
    deploy:
      replicas: 1
