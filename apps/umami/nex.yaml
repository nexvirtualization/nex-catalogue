x-nex:
  name: Umami
  summary: Analyze traffic with privacy-focused web analytics
  description: Prepare a PostgreSQL database and install Umami. The upstream default login is admin with
    password umami. Change that password immediately through the web interface on a trusted network.
  category: monitoring
  website: https://umami.is/
  source: https://github.com/umami-software/umami
  docs: https://umami.is/docs/install
  scalable: false
  primary_service: umami
  architectures:
  - amd64
  - arm64
  web:
    service: umami
    scheme: http
    port: 3000
  works_with:
  - postgresql
  options:
    DATABASE_URL:
      label: Database connection string
      help: Create the database and its dedicated user first. Supply a complete PostgreSQL URI with a
        percent-encoded password. Nex applications can use the database app connection name and port 5432.
      type: password
    APP_SECRET:
      label: Application signing secret
      help: Use Generate to create a unique secret for this installation.
      type: password
    PORT:
      label: Web port
      help: The app listens on TCP port 3000 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  umami:
    image: ghcr.io/umami-software/umami:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_SECRET: ${APP_SECRET}
    ports:
    - ${PORT:-3000}:3000/tcp
    deploy:
      replicas: 1
