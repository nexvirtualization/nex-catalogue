# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Portabase
  summary: Manage database backup jobs in a dashboard
  description: Create an external PostgreSQL database and complete first-run setup. Register backup agents
    on target machines separately.
  category: management
  website: https://portabase.io/
  source: https://github.com/Portabase/portabase
  docs: https://portabase.io/docs/dashboard/setup
  primary_service: portabase
  post_install: Create an external PostgreSQL database and complete first-run setup. Register backup agents
    on target machines separately.
  license: Apache-2.0
  architectures:
  - amd64
  - arm64
  web:
    port: 80
  options:
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    PROJECT_SECRET:
      label: Project secret
      help: Use the credential or secret required by the upstream configuration.
      type: password
    DATABASE_URL:
      label: Database url
      help: Connection URL for the database. Percent-encode special characters in credentials.
      type: password
    PORT:
      label: HTTP port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Backup job data
      help: Managed directory mounted at /data. Choose storage writable by the application.
services:
  portabase:
    image: docker.io/portabase/portabase:1.36.2
    ports:
    - ${PORT:-80}:80/tcp
    volumes:
    - ${DATA}:/data
    environment:
      PROJECT_URL: ${PUBLIC_URL}
      PROJECT_SECRET: ${PROJECT_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      PROJECT_NAME: Portabase
      TELEMETRY: 'false'
    deploy:
      replicas: 1
