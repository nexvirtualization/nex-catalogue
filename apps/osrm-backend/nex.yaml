# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Open Source Routing Machine (OSRM)
  summary: Serve road-network routing from prepared map data
  description: OSRM answers route queries using data generated by matching OSRM extraction, partition and
    customization tools.
  category: development
  website: http://project-osrm.org/
  source: https://github.com/Project-OSRM/osrm-backend
  docs: https://github.com/Project-OSRM/osrm-backend#using-docker
  primary_service: osrm-backend
  post_install: Place the complete .osrm dataset and its companion files in Routing data before deployment.
    Use the same OSRM version to prepare and serve it.
  license: BSD-2-Clause
  architectures:
  - amd64
  - arm64
  web:
    port: 5000
  options:
    DATA_FILE:
      label: Dataset path
      help: Path of the prepared .osrm base name under /data.
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 5000 inside Nex.
    DATA:
      label: Prepared routing data
      help: Managed directory mounted at /data. Choose storage readable by the application.
services:
  osrm-backend:
    image: ghcr.io/project-osrm/osrm-backend:latest
    ports:
    - ${PORT:-20273}:5000/tcp
    volumes:
    - ${DATA}:/data:ro
    command:
    - osrm-routed
    - --algorithm
    - mld
    - ${DATA_FILE:-/data/region.osrm}
    deploy:
      replicas: 1
