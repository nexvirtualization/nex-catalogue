# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Open Source Routing Machine (OSRM)
  summary: Serve road-network routing from prepared map data
  description: OSRM answers route queries from a road network. On first start it needs internet access to download the map
    extract named in Map download URL (Monaco by default), builds the routing data and then serves
    it. To use your own region, set the URL of an OpenStreetMap .osm.pbf extract, or place data you
    prepared yourself in the routing data folder and set Dataset path to match.
  category: development
  website: http://project-osrm.org/
  source: https://github.com/Project-OSRM/osrm-backend
  docs: https://github.com/Project-OSRM/osrm-backend#using-docker
  primary_service: osrm-backend
  license: BSD-2-Clause
  architectures:
  - amd64
  - arm64
  web:
    port: 5000
    path: /nearest/v1/driving/0,0
  options:
    MAP_URL:
      label: Map download URL
      help: Address of an OpenStreetMap .osm.pbf extract, used only when no routing data exists yet. Leave
        empty for the small Monaco extract https://download.geofabrik.de/europe/monaco-latest.osm.pbf; large
        regions need much more memory and time. Changing it later has no effect until the routing data folder
        is emptied.
    DATA_FILE:
      label: Dataset path
      help: Base path under /data for the routing files. Leave empty for /data/region.osrm. Existing
        region.osrm.* files built with the same OSRM version are served as they are.
    PORT:
      label: HTTP port
      help: The app listens on TCP port 5000 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Prepared routing data
      help: Writable folder mounted at /data. It holds the downloaded extract and the routing files built
        from it, so they are not rebuilt on restart. Back it up or keep it to avoid a rebuild.
services:
  osrm-backend:
    image: ghcr.io/project-osrm/osrm-backend:latest
    ports:
    - ${PORT:-5000}:5000/tcp
    volumes:
    - ${DATA}:/data
    environment:
      NEX_OSRM_DATA_FILE: ${DATA_FILE:-/data/region.osrm}
      NEX_OSRM_MAP_URL: ${MAP_URL:-https://download.geofabrik.de/europe/monaco-latest.osm.pbf}
    entrypoint: [bash, -ec]
    command:
    - |
      base="$$NEX_OSRM_DATA_FILE"
      if [ ! -s "$$base.mldgr" ]; then
        src="$${base%.osrm}.osm.pbf"
        if [ ! -s "$$src" ]; then
          apt-get update -qq >/dev/null
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null
          curl -fsSL --retry 3 -o "$$src.part" "$$NEX_OSRM_MAP_URL"
          mv "$$src.part" "$$src"
        fi
        osrm-extract -p /opt/car.lua "$$src"
        osrm-partition "$$base"
        osrm-customize "$$base"
      fi
      exec osrm-routed --algorithm mld "$$base"
    deploy:
      replicas: 1
