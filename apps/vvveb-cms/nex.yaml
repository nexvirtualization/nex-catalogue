# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Vvveb CMS
  summary: Build and publish websites with a visual editor
  description: Complete the web installer on a trusted network and select SQLite for a standalone site.
    Set an administrator password before exposing the site through HTTPS.
  category: productivity
  website: https://www.vvveb.com
  source: https://github.com/givanz/Vvveb
  docs: https://github.com/givanz/Vvveb#docker
  scalable: false
  primary_service: vvveb-cms
  architectures:
  - amd64
  - arm64
  web:
    service: vvveb-cms
    scheme: http
    port: 80
  options:
    PORT:
      label: Web port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Website and database
      help: Select This host. Stores site files, configuration and the local SQLite database. Include
        this folder in a stopped Nex backup.
services:
  vvveb-cms:
    image: vvveb/vvvebcms:latest
    ports:
    - ${PORT:-80}:80/tcp
    volumes:
    - ${DATA}:/var/www/html
    deploy:
      replicas: 1
