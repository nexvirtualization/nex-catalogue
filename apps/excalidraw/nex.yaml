# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Excalidraw
  summary: Sketch diagrams on a browser-based whiteboard
  description: Draw diagrams and annotate ideas with a hand-drawn style. This install serves the editor. It
    does not run the separate collaboration or share-link backends.
  category: productivity
  website: https://excalidraw.com/
  source: https://github.com/excalidraw/excalidraw
  docs: https://docs.excalidraw.com/docs/introduction
  license: MIT
  primary_service: excalidraw
  architectures:
  - amd64
  - arm64
  post_install: Open the editor and export drawings to keep a portable copy. The app also keeps local drafts
    in browser storage.
  web:
    port: 80
  scale:
  - excalidraw
  options:
    PORT:
      label: HTTP port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  excalidraw:
    image: docker.io/excalidraw/excalidraw:latest
    ports:
    - ${PORT:-80}:80/tcp
    deploy:
      replicas: 1
