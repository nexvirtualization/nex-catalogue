# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Mazanoke
  summary: Compress and resize images locally in the browser
  description: Shrink images, convert formats, and choose compression settings before sharing files. The client
    handles image processing, with no server storage.
  category: tools
  website: https://mazanoke.com/
  source: https://github.com/civilblur/mazanoke
  docs: https://github.com/civilblur/mazanoke#docker
  license: GPL-3.0
  primary_service: mazanoke
  architectures:
  - amd64
  - arm64
  post_install: Drop images onto the app and download the results.
  web:
    port: 80
  scale:
  - mazanoke
  options:
    PORT:
      label: Published HTTP port
      help: Internal HTTP port 80. This setting is used when host port publishing is enabled.
services:
  mazanoke:
    image: ghcr.io/civilblur/mazanoke:latest
    ports:
    - ${PORT:-18114}:80/tcp
    deploy:
      replicas: 1
