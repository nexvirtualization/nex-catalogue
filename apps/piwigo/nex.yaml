# SPDX-License-Identifier: AGPL-3.0-only
# Deployment reference: https://docs.linuxserver.io/images/docker-piwigo/
x-nex:
  name: Piwigo
  summary: Photo gallery software for the web, built by an active community of users and developers
  category: media
  description: Photo gallery software for the web, built by an active community of users and developers. Back
    up the application folders together and keep them writable by the container.
  source: https://github.com/Piwigo/Piwigo
  website: https://piwigo.org/
  docs: https://piwigo.org/
  primary_service: piwigo
  options:
    FOLDER_1:
      label: Config folder
      help: Nex-managed folder mounted at /config. Select storage with suitable access permissions.
    FOLDER_2:
      label: Gallery folder
      help: Nex-managed folder mounted at /gallery. Select storage with suitable access permissions.
    PORT:
      label: TCP port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
  web:
    port: 80
  post_install: Provision a compatible MySQL or MariaDB database, then complete the browser installer. Use
    the database app’s internal Nex name and its listener port.
services:
  piwigo:
    image: lscr.io/linuxserver/piwigo:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: America/Sao_Paulo
    volumes:
    - ${FOLDER_1}:/config
    - ${FOLDER_2}:/gallery
    deploy:
      replicas: 1
    ports:
    - ${PORT:-80}:80/tcp
