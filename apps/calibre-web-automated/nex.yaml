# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Calibre Web Automated
  summary: Manage and automate an ebook library
  description: Keep the Calibre database and book files together on local storage. Import files are removed
    from the ingest folder once processed.
  category: reading
  website: https://github.com/crocodilestick/Calibre-Web-Automated
  source: https://github.com/crocodilestick/Calibre-Web-Automated
  docs: https://github.com/crocodilestick/Calibre-Web-Automated
  primary_service: calibre-web-automated
  post_install: Complete calibre-web setup on a trusted network and choose /calibre-library. Change the initial
    administrator credentials before exposing the app.
  license: GPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 8083
  options:
    PORT:
      label: HTTP port
      help: The app listens on TCP port 8083 on its default Docker network. Nex does not publish it on host
        addresses.
    CONFIG:
      label: Application data
      help: Managed directory mounted at /config. Choose storage writable by the application.
    INGEST:
      label: Book import folder
      help: Managed directory mounted at /cwa-book-ingest. Choose storage writable by the application.
    LIBRARY:
      label: Calibre library
      help: Managed directory mounted at /calibre-library. Choose storage writable by the application.
services:
  calibre-web-automated:
    image: docker.io/crocodilestick/calibre-web-automated:latest
    ports:
    - ${PORT:-8083}:8083/tcp
    volumes:
    - ${CONFIG}:/config
    - ${INGEST}:/cwa-book-ingest
    - ${LIBRARY}:/calibre-library
    deploy:
      replicas: 1
