x-nex:
  name: Odoo
  summary: Manage business operations with integrated applications
  description: Provision a PostgreSQL user with permission to create the selected Odoo database. Complete
    initial setup on a trusted network and set the Odoo database-manager password during setup.
  category: productivity
  website: https://www.odoo.com
  source: https://github.com/odoo/odoo
  docs: https://hub.docker.com/_/odoo
  scalable: false
  primary_service: odoo
  architectures:
  - amd64
  - arm64
  web:
    service: odoo
    scheme: http
    port: 8069
  works_with:
  - postgresql
  options:
    DB_HOST:
      label: Database host
      help: Host or Nex application name of the prepared database service. It must be reachable on internal
        port 5432.
    DB_USER:
      label: Database user
      help: Create a dedicated non-root database user for this application.
    DB_PASSWORD:
      label: Database password
      help: Password for the dedicated database account.
      type: password
    PORT:
      label: Web port
      help: The app listens on TCP port 8069 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Odoo filestore
      help: Select This host. Stores attachments and other files outside PostgreSQL. Include this folder
        in a stopped Nex backup.
    ADDONS:
      label: Optional addons
      help: Select This host. Choose a managed folder for locally provided addon code. Include this folder
        in a stopped Nex backup.
services:
  odoo:
    image: odoo:latest
    environment:
      HOST: ${DB_HOST}
      USER: ${DB_USER}
      PASSWORD: ${DB_PASSWORD}
    ports:
    - ${PORT:-8069}:8069/tcp
    volumes:
    - ${DATA}:/var/lib/odoo
    - ${ADDONS}:/mnt/extra-addons
    deploy:
      replicas: 1
