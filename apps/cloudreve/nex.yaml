# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Cloudreve
  summary: Manage and share files with Cloudreve
  description: Provision PostgreSQL and Redis. Keep both reachable from Nex and complete first-run sign-in
    on a trusted network.
  category: management
  website: https://cloudreve.org/
  source: https://github.com/cloudreve/cloudreve
  docs: https://docs.cloudreve.org/en/overview/deploy/docker
  primary_service: cloudreve
  post_install: Provision PostgreSQL and Redis. Keep both reachable from Nex and complete first-run sign-in
    on a trusted network.
  license: GPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 5212
  options:
    DB_HOST:
      label: Db host
      help: Hostname or Nex connection name of the database service.
    DB_USER:
      label: Db user
      help: Enter the deployment value described in the upstream setup guide.
    DB_PASSWORD:
      label: Db password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    DB_NAME:
      label: Db name
      help: Enter the deployment value described in the upstream setup guide.
    DB_PORT:
      label: Db port
      help: Enter the deployment value described in the upstream setup guide.
    REDIS_ADDRESS:
      label: Redis address
      help: Enter the deployment value described in the upstream setup guide.
    REDIS_PASSWORD:
      label: Redis password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 5212 inside Nex.
    DATA:
      label: Cloudreve application data
      help: Managed directory mounted at /cloudreve/data. Choose storage writable by the application.
services:
  cloudreve:
    image: docker.io/cloudreve/cloudreve:latest
    ports:
    - ${PORT:-23480}:5212/tcp
    volumes:
    - ${DATA}:/cloudreve/data
    environment:
      CR_CONF_Database.Type: postgres
      CR_CONF_Database.Host: ${DB_HOST}
      CR_CONF_Database.User: ${DB_USER}
      CR_CONF_Database.Password: ${DB_PASSWORD}
      CR_CONF_Database.Name: ${DB_NAME:-cloudreve}
      CR_CONF_Database.Port: ${DB_PORT:-5432}
      CR_CONF_Redis.Server: ${REDIS_ADDRESS}
      CR_CONF_Redis.Password: ${REDIS_PASSWORD}
    deploy:
      replicas: 1
