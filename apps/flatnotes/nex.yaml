# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: flatnotes
  summary: Write and search Markdown notes
  description: Flatnotes stores Markdown documents and its search index in the selected data folder. Password
    authentication is enabled.
  category: productivity
  website: https://github.com/dullage/flatnotes
  source: https://github.com/dullage/flatnotes
  docs: https://github.com/dullage/flatnotes
  primary_service: flatnotes
  post_install: Sign in using the configured account. Back up Notes to preserve Markdown files and attachments.
  license: MIT
  architectures:
  - amd64
  - arm64
  web:
    port: 8080
  options:
    USERNAME:
      label: Email or login name
      help: Account identifier supplied to the application.
    PASSWORD:
      label: Account password
      help: Choose a strong password for this deployment.
      type: password
    SECRET_KEY:
      label: Signing secret
      help: Generate and retain a random secret for this deployment.
      type: password
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 8080 inside Nex.
    DATA:
      label: Notes and search index
      help: Managed directory mounted at /data. Choose storage writable by the application.
services:
  flatnotes:
    image: docker.io/dullage/flatnotes:latest
    ports:
    - ${PORT:-20201}:8080/tcp
    volumes:
    - ${DATA}:/data
    environment:
      FLATNOTES_AUTH_TYPE: password
      FLATNOTES_USERNAME: ${USERNAME:-notes}
      FLATNOTES_PASSWORD: ${PASSWORD}
      FLATNOTES_SECRET_KEY: ${SECRET_KEY}
    deploy:
      replicas: 1
