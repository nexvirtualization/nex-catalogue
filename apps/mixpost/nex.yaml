# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Mixpost
  summary: Organize and schedule social media posts
  description: Provision MySQL and Redis. Keep the dashboard private, create the administrator with upstream
    setup, and connect the desired social accounts.
  category: productivity
  website: https://mixpost.app/
  source: https://github.com/inovector/mixpost
  docs: https://docs.mixpost.app/installation/docker/
  primary_service: mixpost
  post_install: Provision MySQL and Redis. Keep the dashboard private, create the administrator with upstream
    setup, and connect the desired social accounts.
  license: MIT
  architectures:
  - amd64
  - arm64
  web:
    port: 80
  options:
    APP_KEY:
      label: Encryption secret
      help: Use Generate. Mixpost's encryption key is derived from this secret, or enter a ready-made
        Laravel key that starts with base64:. Keep it with your backup, because changing it makes stored
        social account tokens unreadable.
      type: password
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    PUBLIC_HOST:
      label: Public host
      help: Enter the deployment value described in the upstream setup guide.
    DB_HOST:
      label: Db host
      help: Hostname or Nex connection name of the database service.
    DB_PORT:
      label: Db port
      help: Enter the deployment value described in the upstream setup guide.
    DB_NAME:
      label: Db name
      help: Enter the deployment value described in the upstream setup guide.
    DB_USER:
      label: Db user
      help: Enter the deployment value described in the upstream setup guide.
    DB_PASSWORD:
      label: Db password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    REDIS_HOST:
      label: Redis host
      help: Enter the deployment value described in the upstream setup guide.
    REDIS_PASSWORD:
      label: Redis password
      help: Password of the Redis service. Leave empty when Redis has no password.
      type: password
    PORT:
      label: HTTP port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Media and app state
      help: Managed directory mounted at /var/www/html/storage/app. Choose storage writable by the application.
    LOGS:
      label: Application logs
      help: Managed directory mounted at /var/www/html/storage/logs. Choose storage writable by the application.
services:
  mixpost:
    image: docker.io/inovector/mixpost:v2.6.0
    ports:
    - ${PORT:-80}:80/tcp
    volumes:
    - ${DATA}:/var/www/html/storage/app
    - ${LOGS}:/var/www/html/storage/logs
    entrypoint:
    - /bin/sh
    - -ec
    - |
      case "$$APP_KEY" in
        base64:*) ;;
        *) APP_KEY="base64:$$(printf %s "$$APP_KEY" | openssl dgst -sha256 -binary | openssl base64)"; export APP_KEY ;;
      esac
      exec start.sh
    environment:
      APP_NAME: Mixpost
      APP_KEY: ${APP_KEY}
      APP_DEBUG: 'false'
      APP_URL: ${PUBLIC_URL}
      APP_DOMAIN: ${PUBLIC_HOST}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_NAME:-mixpost}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    deploy:
      replicas: 1
