x-nex:
  name: form.io
  summary: Build forms and manage submitted data through an API
  description: Provision MongoDB and create the initial administrator on a trusted endpoint. Configure
    roles and data-access permissions before sharing forms.
  category: development
  website: https://github.com/formio/formio
  source: https://github.com/formio/formio
  docs: https://github.com/formio/formio
  primary_service: formio
  scalable: false
  license: OSL-3.0
  architectures:
  - amd64
  web:
    port: 3001
  options:
    MONGO:
      label: MongoDB connection URL
      type: password
      help: Full MongoDB URL for the prepared database, for example mongodb://user:password@host:27017/formio.
        Percent-encode special characters in the password, and do not use quotes or backslashes.
    JWT_SECRET:
      label: Application signing secret
      type: password
      help: Use Generate and preserve this secret across upgrades and restores. Use letters and digits only.
    DB_SECRET:
      label: Database encryption secret
      type: password
      help: Use Generate and preserve this secret across upgrades and restores. It protects stored form
        settings. Use letters and digits only.
    ROOT_EMAIL:
      label: Initial administrator email
      help: Email address for the initial account.
    ROOT_PASSWORD:
      label: Initial administrator password
      type: password
      help: Use Nex Generate.
    PORT:
      label: Web port
      help: The app listens on TCP port 3001 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  formio:
    image: docker.io/formio/formio:latest
    environment:
      NODE_CONFIG: '{"mongo":"${MONGO}","jwt":{"secret":"${JWT_SECRET}"},"mongoSecret":"${DB_SECRET}"}'
      ROOT_EMAIL: ${ROOT_EMAIL}
      ROOT_PASSWORD: ${ROOT_PASSWORD}
    ports:
    - ${PORT:-3001}:3001/tcp
    deploy:
      replicas: 1
