# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: HumHub
  summary: Flexible kit for private social networks
  description: Flexible kit for private social networks.
  category: communication
  source: https://github.com/humhub/humhub
  website: https://www.humhub.org/
  docs: https://github.com/humhub/docker#readme
  primary_service: humhub
  options:
    PUBLIC_URL:
      label: Public url
    DB_HOST:
      label: Db host
    DB_NAME:
      label: Db name
    DB_USER:
      label: Db user
    DB_PASSWORD:
      label: Db password
      type: password
      help: Use a unique value and keep it with the application backups.
    DATA:
      label: Data folder
      help: Choose the Nex-managed folder mounted at /data.
    PORT:
      label: Published 80/tcp port
      help: Host port for application listener 80/tcp. Leave host publishing off to use only the assigned app
        address.
    PORT_2:
      label: Published 443/tcp port
      help: Host port for application listener 443/tcp. Leave host publishing off to use only the assigned app
        address.
  post_install: Provision MariaDB and set the public URL. For TLS generated by the container, ensure DNS and
    validation reach the app address. Complete setup on a trusted network.
  web:
    port: 80
services:
  humhub:
    image: docker.io/humhub/humhub:stable
    deploy:
      replicas: 1
    environment:
      HUMHUB_DEBUG: 'false'
      SERVER_NAME: ${PUBLIC_URL}
      HUMHUB_CONFIG__COMPONENTS__DB__DSN: mysql:host=${DB_HOST};dbname=${DB_NAME:-humhub}
      HUMHUB_CONFIG__COMPONENTS__DB__USERNAME: ${DB_USER}
      HUMHUB_CONFIG__COMPONENTS__DB__PASSWORD: ${DB_PASSWORD}
    volumes:
    - ${DATA}:/data
    ports:
    - ${PORT:-19953}:80/tcp
    - ${PORT_2:-20953}:443/tcp
