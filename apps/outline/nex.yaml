# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Outline
  summary: Run a collaborative knowledge base
  description: Provision PostgreSQL, Redis and an OIDC identity provider. Register the redirect URL and back
    up attachments with the database.
  category: productivity
  website: https://www.getoutline.com/
  source: https://github.com/outline/outline
  docs: https://docs.getoutline.com/s/hosting/doc/docker-7pfeLP5a8t
  primary_service: outline
  post_install: Provision PostgreSQL, Redis and an OIDC identity provider. Register the redirect URL and
    back up attachments with the database.
  license: BUSL-1.1
  architectures:
  - amd64
  - arm64
  web:
    port: 3000
  options:
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    SECRET_KEY:
      label: Secret key
      help: Use the credential or secret required by the upstream configuration.
      type: password
    UTILS_SECRET:
      label: Utils secret
      help: Use the credential or secret required by the upstream configuration.
      type: password
    DATABASE_URL:
      label: Database url
      help: Connection URL for the database. Percent-encode special characters in credentials.
      type: password
    REDIS_URL:
      label: Redis url
      help: Enter the deployment value described in the upstream setup guide.
    OIDC_CLIENT_ID:
      label: Oidc client id
      help: Enter the deployment value described in the upstream setup guide.
    OIDC_CLIENT_SECRET:
      label: Oidc client secret
      help: Use the credential or secret required by the upstream configuration.
      type: password
    OIDC_AUTH_URI:
      label: Oidc auth uri
      help: Use the credential or secret required by the upstream configuration.
      type: password
    OIDC_TOKEN_URI:
      label: Oidc token uri
      help: Use the credential or secret required by the upstream configuration.
      type: password
    OIDC_USERINFO_URI:
      label: Oidc userinfo uri
      help: Use the credential or secret required by the upstream configuration.
      type: password
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 3000 inside Nex.
    STORAGE:
      label: Document attachments
      help: Managed directory mounted at /var/lib/outline/data. Choose storage writable by the application.
services:
  outline:
    image: docker.io/outlinewiki/outline:latest
    ports:
    - ${PORT:-23572}:3000/tcp
    volumes:
    - ${STORAGE}:/var/lib/outline/data
    environment:
      URL: ${PUBLIC_URL}
      SECRET_KEY: ${SECRET_KEY}
      UTILS_SECRET: ${UTILS_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      FILE_STORAGE: local
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_AUTH_URI: ${OIDC_AUTH_URI}
      OIDC_TOKEN_URI: ${OIDC_TOKEN_URI}
      OIDC_USERINFO_URI: ${OIDC_USERINFO_URI}
    deploy:
      replicas: 1
