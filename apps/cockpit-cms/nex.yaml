# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Cockpit CMS
  summary: Create and deliver structured content through an API
  description: This Cockpit CMS profile serves the core upstream image and stores content in the managed
    Storage folder.
  category: development
  website: https://getcockpit.com
  source: https://github.com/Cockpit-HQ/Cockpit
  docs: https://getcockpit.com/documentation
  primary_service: cockpit-cms
  post_install: Open /install and complete first-run setup. Use HTTPS at an access-controlled proxy for remote
    administration.
  license: MIT
  architectures:
  - amd64
  - arm64
  web:
    port: 80
  options:
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 80 inside Nex.
    STORAGE:
      label: Cockpit CMS storage
      help: Managed directory mounted at /var/www/html/storage. Choose storage writable by the application.
services:
  cockpit-cms:
    image: docker.io/cockpithq/cockpit:core-latest
    ports:
    - ${PORT:-20225}:80/tcp
    volumes:
    - ${STORAGE}:/var/www/html/storage
    deploy:
      replicas: 1
