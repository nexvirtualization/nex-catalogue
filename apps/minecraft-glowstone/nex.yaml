# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Minecraft Glowstone
  summary: Host a lightweight Minecraft server with Bukkit support
  description: >-
    Keep the server folders on This host and choose a registered primary network that players can
    reach. Connect on TCP 25565 using Minecraft Java Edition 1.12.2. Configure server settings and
    the allowlist in config/glowstone.yml. Check plugins against the Glowstone 2021.8.0 release.
    Make a stopped backup before applying updates.
  category: games
  website: https://glowstone.net/
  source: https://github.com/GlowstoneMC/Glowstone
  docs: https://github.com/GlowstoneMC/Glowstone/blob/dev/docs/README.md#running
  license: MIT
  architectures: [amd64, arm64]
  tags: [minecraft, sandbox]
  options:
    DATA:
      label: World, extensions and settings
      help: >-
        Choose This host and include this folder in stopped backups.
services:
  minecraft-glowstone:
    image: ghcr.io/itzg/minecraft-server:java8
    working_dir: /data
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        chown 1000:1000 /data
        if [ ! -s /data/glowstone.jar ]; then
          curl -fsSL --retry 3 -o /data/.server.jar.new 'https://github.com/GlowstoneMC/Glowstone/releases/download/2021.8.0/glowstone.jar'
          chown 1000:1000 /data/.server.jar.new
          mv /data/.server.jar.new /data/glowstone.jar
        fi

        exec gosu 1000:1000 java -Xmx2G -XX:+UseG1GC -jar /data/glowstone.jar
    healthcheck:
      disable: true
    expose:
      - 25565/tcp
    volumes:
      - ${DATA}:/data
    stop_grace_period: 60s
    deploy:
      replicas: 1
