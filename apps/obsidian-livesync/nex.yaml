# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Self-hosted LiveSync
  summary: Host the database for the Self-hosted LiveSync Obsidian plugin
  description: This package configures standalone CouchDB for authenticated Obsidian sync. The Obsidian extension
    runs on each of your clients.
  category: productivity
  website: https://github.com/vrtmrz/obsidian-livesync
  source: https://github.com/vrtmrz/obsidian-livesync
  docs: https://github.com/vrtmrz/obsidian-livesync/blob/main/docs/setup_own_server.md
  primary_service: obsidian-livesync
  post_install: Put the backend behind HTTPS for mobile clients. Use the plugin’s Quick Setup with your database
    name and configured credentials, and verify CORS in its diagnostics.
  license: MIT
  architectures:
  - amd64
  - arm64
  web:
    port: 5984
  options:
    USER:
      label: Email or login name
      help: Account identifier supplied to the application.
    PASSWORD:
      label: Account password
      help: Choose a strong password for this deployment.
      type: password
    PORT:
      label: HTTP port
      help: The app listens on TCP port 5984 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Vault databases
      help: Managed directory mounted at /opt/couchdb/data. Choose storage writable by the application.
    CONFIG:
      label: CouchDB local settings
      help: Managed directory mounted at /opt/couchdb/etc/local.d. Choose storage writable by the application.
services:
  obsidian-livesync:
    image: docker.io/library/couchdb:latest
    ports:
    - ${PORT:-5984}:5984/tcp
    volumes:
    - ${DATA}:/opt/couchdb/data
    - ${CONFIG}:/opt/couchdb/etc/local.d
    environment:
      COUCHDB_USER: ${USER:-livesync}
      COUCHDB_PASSWORD: ${PASSWORD}
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - |-
      cat > /opt/couchdb/etc/local.d/10-livesync.ini <<'CONFIG'
      [couchdb]
      single_node = true
      max_document_size = 50000000
      [chttpd]
      require_valid_user = true
      enable_cors = true
      max_http_request_size = 4294967296
      [chttpd_auth]
      require_valid_user = true
      [httpd]
      WWW-Authenticate = Basic realm="couchdb"
      [cors]
      origins = app://obsidian.md,capacitor://localhost,http://localhost
      credentials = true
      headers = accept, authorization, content-type, origin, referer
      methods = GET, PUT, POST, HEAD, DELETE
      CONFIG
      exec /docker-entrypoint.sh couchdb
    deploy:
      replicas: 1
