# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Operational.co
  summary: Collect application events and share operational notifications
  description: Provision MySQL and supply separate HTTPS addresses for the dashboard and API. Route the API
    address to internal TCP port 4337. Open the dashboard and create the first workspace.
  category: monitoring
  website: https://operational.co
  source: https://github.com/operational-co/operational.co
  docs: https://github.com/operational-co/operational.co/blob/master/website/src/content/selfhosted/install-via-docker.mdx
  primary_service: operational
  post_install: Provision MySQL and supply separate HTTPS addresses for the dashboard and API. Route the
    API address to internal TCP port 4337. Open the dashboard and create the first workspace.
  license: AGPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 80
  options:
    DATABASE_URL:
      label: Database url
      help: Connection URL for the database. Percent-encode special characters in credentials.
      type: password
    API_URL:
      label: Api url
      help: Enter the deployment value described in the upstream setup guide.
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    SIGNING_SECRET:
      label: Signing secret
      help: Use the credential or secret required by the upstream configuration.
      type: password
    PORT:
      label: HTTP port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
    API_PORT:
      label: API port
      help: The app listens on TCP port 4337 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  operational:
    image: ghcr.io/operational-co/operational.co:latest
    ports:
    - ${PORT:-80}:80/tcp
    - ${API_PORT:-4337}:4337/tcp
    environment:
      PORT: '4337'
      SELFHOSTED: 'true'
      DATABASE_URL: ${DATABASE_URL}
      VITE_API_URL: ${API_URL}
      API_URL: ${API_URL}
      APP_URL: ${PUBLIC_URL}
      CORS: ${PUBLIC_URL}
      SECRET: ${SIGNING_SECRET}
    deploy:
      replicas: 1
