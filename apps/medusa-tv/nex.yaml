# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Medusa
  summary: Organize television show libraries and downloads
  description: Use this Medusa instance to maintain show metadata and connect an existing download client.
  category: media
  website: https://github.com/pymedusa/Medusa
  source: https://github.com/pymedusa/Medusa
  docs: https://github.com/pymedusa/Medusa
  primary_service: medusa-tv
  post_install: Open the web interface and configure a login and downloading integrations before exposing
    it beyond a trusted network.
  license: GPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 8081
  options:
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 8081 inside Nex.
    CONFIG:
      label: Medusa settings
      help: Managed directory mounted at /config. Choose storage writable by the application.
    DOWNLOADS:
      label: Downloads
      help: Managed directory mounted at /downloads. Choose storage writable by the application.
    TV:
      label: Television library
      help: Managed directory mounted at /tv. Choose storage writable by the application.
services:
  medusa-tv:
    image: docker.io/pymedusa/medusa:latest
    ports:
    - ${PORT:-20217}:8081/tcp
    volumes:
    - ${CONFIG}:/config
    - ${DOWNLOADS}:/downloads
    - ${TV}:/tv
    deploy:
      replicas: 1
