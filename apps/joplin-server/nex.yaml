x-nex:
  name: Joplin Server
  summary: Sync notebooks between Joplin clients
  description: Provision PostgreSQL and provide the exact external server URL. Sign in as the upstream
    default administrator on a trusted network, change the password, then configure sync accounts for
    Joplin clients.
  category: productivity
  website: https://joplinapp.org/
  source: https://github.com/laurent22/joplin
  docs: https://github.com/laurent22/joplin#readme
  scalable: false
  primary_service: joplin-server
  architectures:
  - amd64
  - arm64
  web:
    service: joplin-server
    scheme: http
    port: 22300
  works_with:
  - postgresql
  options:
    DB_HOST:
      label: Database host
      help: Host or Nex application name of the prepared database service. It must be reachable on internal
        port 5432.
    DB_USER:
      label: Database user
      help: Create a dedicated non-root database user for this application.
    DB_NAME:
      label: Database name
      help: Create a database owned by the configured user first. The default is joplin.
    DB_PASSWORD:
      label: Database password
      help: Password for the dedicated database account.
      type: password
    PUBLIC_URL:
      label: Public web address
      help: Full URL clients will open, including scheme and any non-default port.
    PORT:
      label: Web port
      help: Host-published HTTP port when publishing is enabled. With a dedicated Primary network, use
        the application address on port 22300.
services:
  joplin-server:
    image: joplin/server:latest
    environment:
      POSTGRES_HOST: ${DB_HOST}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DATABASE: ${DB_NAME:-joplin}
      APP_BASE_URL: ${PUBLIC_URL}
      APP_PORT: '22300'
      DB_CLIENT: pg
      POSTGRES_PORT: '5432'
    ports:
    - ${PORT:-8394}:22300/tcp
    deploy:
      replicas: 1
