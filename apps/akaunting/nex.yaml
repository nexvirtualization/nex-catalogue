# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Akaunting
  summary: Manage invoices, business accounts and expenses
  description: Prepare MariaDB and enter your initial company and administrator information. Enable setup
    for a fresh install and disable it after completing onboarding.
  category: finance
  website: https://akaunting.com/
  source: https://github.com/akaunting/akaunting
  docs: https://github.com/akaunting/docker
  primary_service: akaunting
  post_install: Prepare MariaDB and enter your initial company and administrator information. Enable setup
    for a fresh install and disable it after completing onboarding.
  license: BUSL-1.1
  architectures:
  - amd64
  - arm64
  web:
    port: 80
  options:
    INSTALL_SETUP:
      label: Install setup
      help: Enter the deployment value described in the upstream setup guide.
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    DB_HOST:
      label: Db host
      help: Hostname or Nex connection name of the database service.
    DB_PORT:
      label: Db port
      help: Enter the deployment value described in the upstream setup guide.
    DB_NAME:
      label: Db name
      help: Enter the deployment value described in the upstream setup guide.
    DB_USER:
      label: Db user
      help: Enter the deployment value described in the upstream setup guide.
    DB_PASSWORD:
      label: Db password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    COMPANY_NAME:
      label: Company name
      help: Enter the deployment value described in the upstream setup guide.
    COMPANY_EMAIL:
      label: Company email
      help: Enter the deployment value described in the upstream setup guide.
    ADMIN_EMAIL:
      label: Admin email
      help: Enter the deployment value described in the upstream setup guide.
    ADMIN_PASSWORD:
      label: Admin password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    PORT:
      label: HTTP port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Akaunting configuration and files
      help: Managed directory mounted at /var/www/html. Choose storage writable by the application.
services:
  akaunting:
    image: docker.io/akaunting/akaunting:latest
    ports:
    - ${PORT:-80}:80/tcp
    volumes:
    - ${DATA}:/var/www/html
    environment:
      AKAUNTING_SETUP: ${INSTALL_SETUP:-true}
      APP_URL: ${PUBLIC_URL}
      LOCALE: en-US
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-akaunting}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      COMPANY_NAME: ${COMPANY_NAME}
      COMPANY_EMAIL: ${COMPANY_EMAIL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    deploy:
      replicas: 1
