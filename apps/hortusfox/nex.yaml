# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: HortusFox
  summary: Track plants and shared gardening tasks
  description: Provision a MariaDB database and dedicated user. Sign in with your initial account and back
    up photos and the database.
  category: productivity
  website: https://hortusfox.github.io
  source: https://github.com/danielbrendel/hortusfox-web
  docs: https://github.com/danielbrendel/hortusfox-web#docker
  primary_service: hortusfox
  post_install: Provision a MariaDB database and dedicated user. Sign in with your initial account and back
    up photos and the database.
  license: MIT
  architectures:
  - amd64
  - arm64
  web:
    port: 80
  options:
    ADMIN_EMAIL:
      label: Admin email
      help: Enter the deployment value described in the upstream setup guide.
    ADMIN_PASSWORD:
      label: Admin password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    DB_HOST:
      label: Db host
      help: Hostname or Nex connection name of the database service.
    DB_PORT:
      label: Db port
      help: Enter the deployment value described in the upstream setup guide.
    DB_NAME:
      label: Db name
      help: Enter the deployment value described in the upstream setup guide.
    DB_USER:
      label: Db user
      help: Enter the deployment value described in the upstream setup guide.
    DB_PASSWORD:
      label: Db password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    PORT:
      label: HTTP port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
    IMAGES:
      label: Plant photos
      help: Managed directory mounted at /var/www/html/public/img. Choose storage writable by the application.
    BACKUP:
      label: Exported backups
      help: Managed directory mounted at /var/www/html/public/backup. Choose storage writable by the application.
    THEMES:
      label: Themes
      help: Managed directory mounted at /var/www/html/public/themes. Choose storage writable by the application.
    MIGRATIONS:
      label: Migration state
      help: Managed directory mounted at /var/www/html/app/migrations. Choose storage writable by the application.
services:
  hortusfox:
    image: ghcr.io/danielbrendel/hortusfox-web:latest
    ports:
    - ${PORT:-80}:80/tcp
    volumes:
    - ${IMAGES}:/var/www/html/public/img
    - ${BACKUP}:/var/www/html/public/backup
    - ${THEMES}:/var/www/html/public/themes
    - ${MIGRATIONS}:/var/www/html/app/migrations
    environment:
      APP_ADMIN_EMAIL: ${ADMIN_EMAIL}
      APP_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APP_TIMEZONE: UTC
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_NAME:-hortusfox}
      DB_CHARSET: utf8mb4
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    deploy:
      replicas: 1
