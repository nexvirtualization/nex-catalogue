# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: HyperDX
  summary: Inspect application logs, traces and metrics with ClickStack
  description: Complete HyperDX onboarding on a trusted endpoint. Route authenticated ingestion to the
    matching OpenTelemetry port. This single-container profile keeps analytics and user data on the
    same host.
  category: monitoring
  website: https://github.com/hyperdxio/hyperdx
  source: https://github.com/hyperdxio/hyperdx
  docs: https://clickhouse.com/docs/use-cases/observability/clickstack/deployment/all-in-one
  primary_service: hyperdx
  scalable: false
  license: MIT
  web:
    port: 8080
  options:
    LOGDATA:
      label: ClickHouse analytics data
      help: Keep clickhouse analytics data in this managed folder between restarts.
    ACCOUNTS:
      label: HyperDX user data
      help: Keep hyperdx user data in this managed folder between restarts.
    PORT:
      label: Web port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
    OTLP_GRPC:
      label: OTLP gRPC ingest
      help: The app listens on TCP port 4317 on its default Docker network. Nex does not publish it on host
        addresses.
    OTLP_HTTP:
      label: OTLP HTTP ingest
      help: The app listens on TCP port 4318 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  hyperdx:
    image: docker.io/clickhouse/clickstack-all-in-one:latest
    volumes:
    - ${LOGDATA}:/var/lib/clickhouse
    - ${ACCOUNTS}:/data/db
    ports:
    - ${PORT:-8080}:8080/tcp
    - ${OTLP_GRPC:-4317}:4317/tcp
    - ${OTLP_HTTP:-4318}:4318/tcp
    deploy:
      replicas: 1
