# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Domain Locker
  summary: Track domain registrations and renewals
  description: Prepare PostgreSQL and finish the Domain Locker setup. Use HTTPS for operator access. Keep
    your account and database backups where only intended operators can access them.
  category: productivity
  website: https://domain-locker.com
  source: https://github.com/lissy93/domain-locker
  docs: https://github.com/lissy93/domain-locker#readme
  scalable: false
  primary_service: domain-locker
  architectures:
  - amd64
  - arm64
  web:
    service: domain-locker
    scheme: http
    port: 3000
  works_with:
  - postgresql
  options:
    DB_HOST:
      label: Database host
      help: Host or Nex application name of the prepared database service. It must be reachable on internal
        port 5432.
    DB_USER:
      label: Database user
      help: Create a dedicated non-root database user for this application.
    DB_NAME:
      label: Database name
      help: Create a database owned by the configured user first. The default is domain_locker.
    DB_PASSWORD:
      label: Database password
      help: Password for the dedicated database account.
      type: password
    PORT:
      label: Web port
      help: Host-published HTTP port when publishing is enabled. With a dedicated Primary network, use
        the application address on port 3000.
services:
  domain-locker:
    image: lissy93/domain-locker:latest
    environment:
      DL_PG_HOST: ${DB_HOST}
      DL_PG_USER: ${DB_USER}
      DL_PG_PASSWORD: ${DB_PASSWORD}
      DL_PG_NAME: ${DB_NAME:-domain_locker}
      NODE_ENV: production
      DL_ENV_TYPE: selfHosted
      DL_PG_PORT: '5432'
    ports:
    - ${PORT:-8432}:3000/tcp
    deploy:
      replicas: 1
