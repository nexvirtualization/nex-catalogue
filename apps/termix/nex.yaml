# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Termix
  summary: Manage remote server sessions and files from a browser
  description: Create your Termix administrator on a trusted network before you expose the web endpoint.
    Use HTTPS for access and make target hosts reachable from this app.
  category: networking
  website: https://github.com/Termix-SSH/Termix
  source: https://github.com/Termix-SSH/Termix
  docs: https://docs.termix.site/install
  primary_service: termix
  scalable: false
  license: Apache-2.0
  web:
    port: 8080
  options:
    DATA:
      label: Termix data
      help: Users, configuration and saved connection data.
    PORT:
      label: Web port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  termix:
    image: ghcr.io/termix-ssh/termix:latest
    environment:
      PORT: '8080'
    volumes:
    - ${DATA}:/app/data
    ports:
    - ${PORT:-8080}:8080/tcp
    deploy:
      replicas: 1
