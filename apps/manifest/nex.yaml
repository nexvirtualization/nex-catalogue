x-nex:
  name: Manifest
  summary: Route model API requests across providers
  description: Provision PostgreSQL. Set the HTTPS browser address and create the administrator in the setup
    wizard. Connect the desired providers and keep the encryption key with your backups.
  category: ai
  website: https://manifest.build
  source: https://github.com/mnfst/llm-gateway
  docs: https://github.com/mnfst/llm-gateway/blob/main/docker/DOCKER_README.md
  primary_service: manifest
  post_install: Provision PostgreSQL. Set the HTTPS browser address and create the administrator in the setup
    wizard. Connect the desired providers and keep the encryption key with your backups.
  architectures:
  - amd64
  - arm64
  web:
    port: 2099
  options:
    DATABASE_URL:
      label: Database url
      help: Connection URL for the database. Percent-encode special characters in credentials.
      type: password
    AUTH_SECRET:
      label: Auth secret
      help: Use the credential or secret required by the upstream configuration.
      type: password
    ENCRYPTION_KEY:
      label: Encryption key
      help: Use the credential or secret required by the upstream configuration.
      type: password
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 2099 inside Nex.
    RECORDINGS:
      label: Request recordings
      help: Managed directory mounted at /data/request-recordings. Choose storage writable by the application.
services:
  manifest:
    image: docker.io/manifestdotbuild/manifest:latest
    ports:
    - ${PORT:-23552}:2099/tcp
    volumes:
    - ${RECORDINGS}:/data/request-recordings
    environment:
      PORT: '2099'
      NODE_ENV: production
      MANIFEST_MODE: selfhosted
      MANIFEST_TELEMETRY_DISABLED: '1'
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${AUTH_SECRET}
      MANIFEST_ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      BETTER_AUTH_URL: ${PUBLIC_URL}
      REQUEST_RECORDING_FILESYSTEM_PATH: /data/request-recordings
    deploy:
      replicas: 1
