x-nex:
  name: Bracket
  summary: Organize tournaments and publish match schedules
  description: Provision PostgreSQL and use one HTTPS origin for both the dashboard and API. For a new,
    empty database, set the bootstrap admin email and password to create the first account. Leave both
    blank when the database already has accounts.
  category: productivity
  website: https://docs.bracketapp.nl/
  source: https://github.com/evroon/bracket
  docs: https://github.com/evroon/bracket#readme
  scalable: false
  primary_service: bracket
  architectures:
  - amd64
  - arm64
  web:
    service: bracket
    scheme: http
    port: 8400
  works_with:
  - postgresql
  options:
    DATABASE_URL:
      label: Database connection string
      help: Create the database and its dedicated user first. Supply a complete PostgreSQL URI with a
        percent-encoded password. Nex applications can use the database app connection name and port 5432.
      type: password
    PUBLIC_URL:
      label: Public web address
      help: Full URL clients will open, including scheme and any non-default port.
    JWT_SECRET:
      label: Session signing key
      help: Use openssl rand -hex 32 to create a unique key for a new install. Reuse the existing
        key when updating an installation.
      type: password
    ADMIN_EMAIL:
      label: Bootstrap admin email
      help: Set this email and the bootstrap admin password together only for a verified empty database.
        Leave both blank for an initialized database.
    ADMIN_PASSWORD:
      label: Bootstrap admin password
      help: Set this password and the bootstrap admin email together only for a verified empty database.
        Leave both blank for an initialized database.
      type: password
    PORT:
      label: Web port
      help: The app listens on TCP port 8400 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Tournament assets
      help: Select This host. Stores uploaded and generated tournament assets. Include this folder in
        a stopped Nex backup.
services:
  bracket:
    image: ghcr.io/evroon/bracket:latest
    environment:
      PG_DSN: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ENVIRONMENT: PRODUCTION
      CORS_ORIGINS: ${PUBLIC_URL}
      SERVE_FRONTEND: 'true'
      API_PREFIX: /api
    ports:
    - ${PORT:-8400}:8400/tcp
    volumes:
    - ${DATA}:/app/static
    deploy:
      replicas: 1
