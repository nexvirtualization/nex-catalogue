# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Docling Serve
  summary: Convert documents to structured data through an API
  description: CPU build of the document conversion server. Start with a host that can accommodate document
    processing and model downloads. Restrict the API and optional web UI to trusted users.
  category: documents
  website: https://github.com/docling-project/docling-serve
  source: https://github.com/docling-project/docling-serve
  docs: https://github.com/docling-project/docling-serve#readme
  scalable: false
  primary_service: docling-serve
  architectures:
  - amd64
  - arm64
  web:
    service: docling-serve
    scheme: http
    port: 5001
    path: /ui
  options:
    PORT:
      label: Web port
      help: The app listens on TCP port 5001 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  docling-serve:
    image: ghcr.io/docling-project/docling-serve-cpu:latest
    environment:
      DOCLING_SERVE_ENABLE_UI: 'true'
    ports:
    - ${PORT:-5001}:5001/tcp
    deploy:
      replicas: 1
