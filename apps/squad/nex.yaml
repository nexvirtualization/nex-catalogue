# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Squad
  summary: Host combined-arms tactical multiplayer
  description: >-
    Keep the game folders on This host and choose a registered primary network that players can reach.
    Connect through the server browser. The game uses UDP 7787–7788 and Steam queries use UDP 27165–27166.
    Follow the publisher’s licensing process for a listing in the main server browser. First boot
    downloads the server through SteamCMD. Restarts check for updates. Make a stopped backup before
    applying game updates.
  category: games
  website: https://store.steampowered.com/app/393380/
  source: https://github.com/GameServerManagers/docker-gameserver
  docs: https://linuxgsm.com/servers/squadserver/
  license: Proprietary game server
  architectures:
    - amd64
  tags:
    - steam
    - fps
  options:
    DATA:
      label: Server data
      help: Choose This host and include this folder in stopped backups.
services:
  squad:
    image: ghcr.io/gameservermanagers/gameserver:squad
    environment:
      UPDATE_CHECK: '0'
      UPDATE_ON_START: 'true'
    expose:
      - 7787/udp
      - 7788/udp
      - 27165/udp
      - 27166/udp
    volumes:
      - ${DATA}:/data
    healthcheck:
      start_period: 25m
    stop_grace_period: 90s
    deploy:
      replicas: 1
