x-nex:
  name: Convex
  summary: Develop applications with a self-hosted reactive backend
  description: Route separate HTTPS addresses for the dashboard, public API and HTTP actions. Generate the
    initial administrator key using the backend container and enter it in the dashboard. Back up Data and
    retain the instance secret.
  category: development
  website: https://docs.convex.dev/
  source: https://github.com/convex/convex-backend
  docs: https://github.com/convex/convex-backend/tree/main/self-hosted
  primary_service: convex
  post_install: Route separate HTTPS addresses for the dashboard, public API and HTTP actions. Generate the
    initial administrator key using the backend container and enter it in the dashboard. Back up Data and
    retain the instance secret.
  architectures:
  - amd64
  - arm64
  web:
    port: 6791
  options:
    API_URL:
      label: Public API address
      help: Full address clients use to reach the API, for example https://convex-api.example.com, or
        http://<host address>:24513 when published on the default port. Leave empty for http://localhost:24513.
    ACTIONS_URL:
      label: Public HTTP actions address
      help: Full address clients use to reach HTTP actions, for example https://convex-site.example.com, or
        http://<host address>:25513 when published on the default port. Leave empty for http://localhost:25513.
    INSTANCE_SECRET:
      label: Instance secret
      help: Use Generate and keep it. A 64-character hexadecimal key is used as entered; any other value
        is turned into a 64-character key with SHA-256.
      type: password
    PORT:
      label: HTTP port
      help: The app listens on TCP port 6791 on its default Docker network. Nex does not publish it on host
        addresses.
    API_PORT:
      label: Public API port
      help: The app listens on TCP port 3210 on its default Docker network. Nex does not publish it on host
        addresses.
    ACTIONS_PORT:
      label: HTTP actions port
      help: The app listens on TCP port 3211 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Convex data
      help: Managed directory mounted at /convex/data. Choose storage writable by the backend.
services:
  convex:
    image: docker.io/library/caddy:latest
    ports:
    - ${PORT:-6791}:6791/tcp
    - ${API_PORT:-3210}:3210/tcp
    - ${ACTIONS_PORT:-3211}:3211/tcp
    entrypoint:
    - /bin/sh
    command:
    - -ec
    - |-
      printf '%s\n' '{
        auto_https off
      }
      :6791 {
        reverse_proxy dashboard:6791
      }
      :3210 {
        reverse_proxy backend:3210
      }
      :3211 {
        reverse_proxy backend:3211
      }' | exec caddy run --config - --adapter caddyfile
    deploy:
      replicas: 1
  backend:
    image: ghcr.io/convex/convex-backend:latest
    entrypoint:
    - /bin/sh
    - -ec
    - |-
      case "$$INSTANCE_SECRET" in
        *[!0-9a-fA-F]*|"") INSTANCE_SECRET=$$(printf '%s' "$$INSTANCE_SECRET" | sha256sum | cut -d' ' -f1) ;;
        ????????????????????????????????????????????????????????????????) ;;
        *) INSTANCE_SECRET=$$(printf '%s' "$$INSTANCE_SECRET" | sha256sum | cut -d' ' -f1) ;;
      esac
      export INSTANCE_SECRET
      exec ./run_backend.sh
    environment:
      CONVEX_CLOUD_ORIGIN: ${API_URL:-http://localhost:24513}
      CONVEX_SITE_ORIGIN: ${ACTIONS_URL:-http://localhost:25513}
      INSTANCE_SECRET: ${INSTANCE_SECRET}
      DISABLE_BEACON: 'true'
    volumes:
    - ${DATA}:/convex/data
    deploy:
      replicas: 1
  dashboard:
    image: ghcr.io/convex/convex-dashboard:latest
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: ${API_URL:-http://localhost:24513}
    deploy:
      replicas: 1
