x-nex:
  name: Vikunja
  summary: Organize projects and to-do lists
  description: Set the exact public URL, then register your account on a trusted network. This profile
    uses a local SQLite database and keeps attachments in a separate folder.
  category: productivity
  website: https://vikunja.io/
  source: https://github.com/go-vikunja/vikunja
  docs: https://vikunja.io/docs/docker-walkthrough/
  scalable: false
  primary_service: vikunja
  architectures:
  - amd64
  - arm64
  web:
    service: vikunja
    scheme: http
    port: 3456
  options:
    PUBLIC_URL:
      label: Public web address
      help: Full URL clients will open, including scheme and any non-default port.
    JWT_SECRET:
      label: Session signing secret
      help: Use Generate to create a unique secret for this installation.
      type: password
    PORT:
      label: Web port
      help: The app listens on TCP port 3456 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Task database
      help: Select This host. Keeps the SQLite database. A small helper service makes it writable by the
        application user (UID 1000) on every start. Include this folder in a stopped Nex backup.
    FILES:
      label: Attachments
      help: Select This host. Stores uploaded files and is made writable by the application user (UID
        1000) on every start. Include it in a stopped Nex backup.
services:
  vikunja:
    image: vikunja/vikunja:latest
    environment:
      VIKUNJA_SERVICE_PUBLICURL: ${PUBLIC_URL}
      VIKUNJA_SERVICE_SECRET: ${JWT_SECRET}
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
    ports:
    - ${PORT:-3456}:3456/tcp
    volumes:
    - ${DATA}:/db
    - ${FILES}:/app/vikunja/files
    deploy:
      replicas: 1
      # Retry quickly: Vikunja may start before the helper below has made its folders writable.
      restart_policy:
        condition: any
        delay: 1s
  # The Vikunja image has no shell, so this helper hands the data folders to the app user and waits.
  data-init:
    image: docker.io/library/busybox:latest
    entrypoint:
    - /bin/sh
    - -ec
    - |
      chown 1000:1000 /db /files
      exec tail -f /dev/null
    volumes:
    - ${DATA}:/db
    - ${FILES}:/files
    deploy:
      replicas: 1
