# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Ideon
  summary: Organize repository-linked work on a shared canvas
  description: Prepare a PostgreSQL database before installing. Set the public app address to the HTTPS
    URL used by the browser. Configure repository integration credentials inside the app after first sign-in.
  category: productivity
  website: https://www.theideon.com
  source: https://github.com/3xpyth0n/ideon
  docs: https://github.com/3xpyth0n/ideon#readme
  scalable: false
  primary_service: ideon
  architectures:
  - amd64
  - arm64
  web:
    service: ideon
    scheme: http
    port: 3000
  works_with:
  - postgresql
  options:
    DB_HOST:
      label: Database host
      help: Host or Nex application name of the prepared database service. It must be reachable on internal
        port 5432.
    DB_USER:
      label: Database user
      help: Create a dedicated non-root database user for this application.
    DB_NAME:
      label: Database name
      help: Create a database owned by the configured user first. The default is ideon.
    DB_PASSWORD:
      label: Database password
      help: Password for the dedicated database account.
      type: password
    PUBLIC_URL:
      label: Public web address
      help: Full URL clients will open, including scheme and any non-default port.
    PORT:
      label: Web port
      help: Host-published HTTP port when publishing is enabled. With a dedicated Primary network, use
        the application address on port 3000.
    DATA:
      label: Ideon storage
      help: Select This host. Stores workspace files and uploaded content. Include this folder in a stopped
        Nex backup.
services:
  ideon:
    image: ghcr.io/3xpyth0n/ideon:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-ideon}
      ORIGIN: ${PUBLIC_URL}
    ports:
    - ${PORT:-8383}:3000/tcp
    volumes:
    - ${DATA}:/app/storage
    deploy:
      replicas: 1
