# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: CUPS
  summary: Common Unix Print System uses Internet Printing Protocol (IPP) to support printing to local and network
  description: Common Unix Print System uses Internet Printing Protocol (IPP) to support printing to local and
    network printers.
  category: tools
  source: https://github.com/OpenPrinting/cups
  website: https://www.cups.org/
  docs: https://github.com/anujdatar/cups-docker#readme
  primary_service: cups
  options:
    ADMIN_USER:
      label: Admin user
    ADMIN_PASSWORD:
      label: Admin password
      type: password
      help: Use a unique value and keep it with the application backups.
    TZ:
      label: Tz
    CONFIG:
      label: Config folder
      help: Choose the Nex-managed folder mounted at /etc/cups.
    PORT:
      label: Port 631/tcp
      help: The app listens on TCP port 631 on its default Docker network. Nex does not publish it on host
        addresses.
  post_install: Add a reachable network printer using its IPP address. Use a trusted primary network and protect
    the administration UI. This profile handles network printers.
  web:
    port: 631
services:
  cups:
    image: ghcr.io/anujdatar/cups:latest
    deploy:
      replicas: 1
    environment:
      CUPSADMIN: ${ADMIN_USER:-admin}
      CUPSPASSWORD: ${ADMIN_PASSWORD}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG}:/etc/cups
    ports:
    - ${PORT:-631}:631/tcp
    command:
    - /bin/bash
    - -e
    - /entrypoint.sh
