# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Dawarich
  summary: Review location history on an interactive map
  description: PostgreSQL with PostGIS and Redis run inside this app. Keep app and worker on the same eligible
    host or use shared storage. Create the first account on a trusted network.
  category: productivity
  website: https://dawarich.app/
  source: https://github.com/Freika/dawarich
  docs: https://dawarich.app/docs/tutorials/complete-setup/
  primary_service: dawarich
  post_install: Create the first account on a trusted network. Keep app and worker on the same eligible
    host or use shared storage.
  license: AGPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 3000
  options:
    DB_PASSWORD:
      label: Database password
      help: Use Generate to create a unique secret for the PostgreSQL database that runs inside this app.
      type: password
    DB_DATA:
      label: Database folder
      help: Select This host. Stores the PostgreSQL data. Include this folder in a stopped Nex backup.
    PUBLIC_HOST:
      label: Public host
      help: Host name people use to open the app, without a scheme, for example dawarich.example.com. Use
        a trusted HTTPS reverse proxy for internet access.
    PROTOCOL:
      label: Public protocol
      help: Use http to open the app directly on a trusted network. Set https only when a trusted HTTPS
        reverse proxy fronts the app, because https makes the app redirect every plain http request.
        Leave empty for http.
    SIGNING_SECRET:
      label: Signing secret
      help: Use Generate to create a unique secret. Keep it unchanged, or every user is signed out.
      type: password
    PORT:
      label: HTTP port
      help: The app listens on TCP port 3000 on its default Docker network. Nex does not publish it on host
        addresses.
    PUBLIC:
      label: Static files and exports
      help: Managed directory mounted at /var/app/public. Choose storage writable by the application.
    WATCHED:
      label: Location import folder
      help: Managed directory mounted at /var/app/tmp/imports/watched. Choose storage writable by the application.
    DATA:
      label: Application file storage
      help: Managed directory mounted at /var/app/storage. Choose storage writable by the application.
services:
  dawarich:
    image: docker.io/freikin/dawarich:latest
    ports:
    - ${PORT:-3000}:3000/tcp
    volumes:
    - ${PUBLIC}:/var/app/public
    - ${WATCHED}:/var/app/tmp/imports/watched
    - ${DATA}:/var/app/storage
    environment:
      RAILS_ENV: production
      REDIS_URL: redis://redis:6379/0
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: dawarich
      DATABASE_PASSWORD: ${DB_PASSWORD}
      DATABASE_NAME: dawarich
      APPLICATION_HOSTS: ${PUBLIC_HOST}
      APPLICATION_PROTOCOL: ${PROTOCOL:-http}
      SECRET_KEY_BASE: ${SIGNING_SECRET}
      SELF_HOSTED: 'true'
      STORE_GEODATA: 'true'
    entrypoint:
    - web-entrypoint.sh
    command:
    - bin/rails
    - server
    - -p
    - '3000'
    - -b
    - 0.0.0.0
    deploy:
      replicas: 1
  worker:
    image: docker.io/freikin/dawarich:latest
    environment:
      RAILS_ENV: production
      REDIS_URL: redis://redis:6379/0
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: dawarich
      DATABASE_PASSWORD: ${DB_PASSWORD}
      DATABASE_NAME: dawarich
      APPLICATION_HOSTS: ${PUBLIC_HOST}
      APPLICATION_PROTOCOL: ${PROTOCOL:-http}
      SECRET_KEY_BASE: ${SIGNING_SECRET}
      SELF_HOSTED: 'true'
      STORE_GEODATA: 'true'
    deploy:
      replicas: 1
    command:
    - sidekiq
    volumes:
    - ${PUBLIC}:/var/app/public
    - ${WATCHED}:/var/app/tmp/imports/watched
    - ${DATA}:/var/app/storage
    entrypoint:
    - sidekiq-entrypoint.sh
  db:
    image: docker.io/postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: dawarich
      POSTGRES_DB: dawarich
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
    - ${DB_DATA}:/var/lib/postgresql/data
    tmpfs:
    - /dev/shm:size=134217728
    deploy:
      replicas: 1
  redis:
    image: docker.io/valkey/valkey:latest
    deploy:
      replicas: 1
