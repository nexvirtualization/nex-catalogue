# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Glance
  summary: Build a configurable homelab dashboard
  description: The Glance dashboard reads its pages and widgets from a prepared managed configuration folder.
  category: productivity
  website: https://github.com/glanceapp/glance
  source: https://github.com/glanceapp/glance
  docs: https://github.com/glanceapp/glance#installation
  primary_service: glance
  post_install: Before starting, place glance.yml in Configuration using the upstream example. Restart after
    edits and keep unauthenticated dashboards private.
  license: AGPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 8080
  options:
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 8080 inside Nex.
    CONFIG:
      label: Prepared dashboard configuration
      help: Managed directory mounted at /app/src/config. Choose storage readable by the application.
services:
  glance:
    image: docker.io/glanceapp/glance:latest
    ports:
    - ${PORT:-20191}:8080/tcp
    volumes:
    - ${CONFIG}:/app/src/config:ro
    deploy:
      replicas: 1
