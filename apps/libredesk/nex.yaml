# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Libredesk
  summary: Manage customer conversations and shared support queues
  description: Provision PostgreSQL and Redis, add a valid config.toml to Configuration, then start the app.
    Sign in through trusted HTTPS.
  category: communication
  website: https://libredesk.io/
  source: https://github.com/abhinavxd/libredesk
  docs: https://github.com/abhinavxd/libredesk/blob/main/docker-compose.yml
  primary_service: libredesk
  post_install: Provision PostgreSQL and Redis, add a valid config.toml to Configuration, then start the
    app. Sign in through trusted HTTPS.
  license: AGPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 9000
  options:
    ADMIN_PASSWORD:
      label: Admin password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 9000 inside Nex.
    CONFIG:
      label: Prepared Libredesk configuration
      help: Managed directory mounted at /nex-config. Choose storage readable by the application.
    UPLOADS:
      label: Uploaded support files
      help: Managed directory mounted at /libredesk/uploads. Choose storage writable by the application.
services:
  libredesk:
    image: docker.io/libredesk/libredesk:latest
    ports:
    - ${PORT:-23501}:9000/tcp
    volumes:
    - ${CONFIG}:/nex-config:ro
    - ${UPLOADS}:/libredesk/uploads
    environment:
      LIBREDESK_SYSTEM_USER_PASSWORD: ${ADMIN_PASSWORD}
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - ./libredesk --install --idempotent-install --yes --config /nex-config/config.toml && ./libredesk --upgrade
      --yes --config /nex-config/config.toml && exec ./libredesk --config /nex-config/config.toml
    deploy:
      replicas: 1
