# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Colony Survival
  summary: Host a shared colony-building world
  description: >-
    Keep the game folders on This host and choose a registered primary network that players can reach.
    Use the multiplayer browser or the app’s Primary address on UDP 27004. The Steam port is UDP 27005.
    The first boot creates the world. First boot downloads the server through SteamCMD. Restarts check
    for updates. Make a stopped backup before applying game updates.
  category: games
  website: https://store.steampowered.com/app/366090/
  source: https://github.com/GameServerManagers/docker-gameserver
  docs: https://linuxgsm.com/servers/colserver/
  license: Proprietary game server
  architectures:
    - amd64
  tags:
    - steam
    - survival
  options:
    DATA:
      label: Server data
      help: Choose This host and include this folder in stopped backups.
services:
  colony-survival:
    image: ghcr.io/gameservermanagers/gameserver:col
    environment:
      UPDATE_CHECK: '0'
      UPDATE_ON_START: 'true'
    expose:
      - 27004/udp
      - 27005/udp
    volumes:
      - ${DATA}:/data
    healthcheck:
      start_period: 25m
    stop_grace_period: 90s
    deploy:
      replicas: 1
