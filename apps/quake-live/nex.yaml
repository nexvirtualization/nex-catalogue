# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Quake Live
  summary: Host arena shooter matches
  description: >-
    Keep the game folders on This host and choose a registered primary network that players can reach.
    Use the in-game browser or connect APP-IP:27960 in the game console. Keep optional TCP statistics
    and RCON listeners on the administrator network. First boot downloads the server through SteamCMD.
    Restarts check for updates. Make a stopped backup before applying game updates.
  category: games
  website: https://store.steampowered.com/app/282440/
  source: https://github.com/GameServerManagers/docker-gameserver
  docs: https://linuxgsm.com/servers/qlserver/
  license: Proprietary game server
  architectures:
    - amd64
  tags:
    - steam
    - multiplayer
  options:
    DATA:
      label: Server data
      help: Choose This host and include this folder in stopped backups.
services:
  quake-live:
    image: ghcr.io/gameservermanagers/gameserver:ql
    environment:
      UPDATE_CHECK: '0'
      UPDATE_ON_START: 'true'
    expose:
      - 27960/udp
    volumes:
      - ${DATA}:/data
    healthcheck:
      start_period: 25m
    stop_grace_period: 90s
    deploy:
      replicas: 1
