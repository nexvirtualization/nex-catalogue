# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Tinyauth
  summary: Add sign-in to services behind a reverse proxy
  description: Tinyauth supplies a login and authorization endpoint for a supported proxy. Local accounts
    use bcrypt password hashes.
  category: security
  website: https://tinyauth.app/
  source: https://github.com/tinyauthapp/tinyauth
  docs: https://tinyauth.app/docs/getting-started
  primary_service: tinyauth
  post_install: Set the configured HTTPS login origin in your proxy and point it at the Tinyauth forward-auth
    endpoint over the Nex network.
  license: AGPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 3000
  options:
    APP_URL:
      label: HTTPS login origin
      help: Full HTTPS URL where the Tinyauth sign-in page is visible. It must use a host name; Tinyauth
        refuses an IP address.
    USERS:
      label: Accounts and hashes
      help: Comma-separated username:bcrypt-hash entries. A plain username or password is refused at start.
        Create a hash with docker run --rm ghcr.io/tinyauthapp/tinyauth user create --username NAME --password PASSWORD.
      type: password
    PORT:
      label: HTTP port
      help: The app listens on TCP port 3000 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Tinyauth application data
      help: Managed directory mounted at /data. Choose storage writable by the application.
services:
  tinyauth:
    image: ghcr.io/tinyauthapp/tinyauth:latest
    ports:
    - ${PORT:-3000}:3000/tcp
    volumes:
    - ${DATA}:/data
    environment:
      TINYAUTH_APPURL: ${APP_URL}
      TINYAUTH_AUTH_USERS: ${USERS}
    deploy:
      replicas: 1
