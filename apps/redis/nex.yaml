# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Redis
  summary: Store keys and provide a persistent in-memory data service
  description: Connect on the application network using the configured password. Keep the port private
    and make consistent backups before upgrading.
  category: development
  website: https://github.com/redis/redis
  source: https://github.com/redis/redis
  docs: https://github.com/redis/redis
  primary_service: redis
  scalable: false
  license: 'Redis 8+: AGPLv3, RSALv2, or SSPLv1. Redis 7.4–7.8: RSALv2 or SSPLv1. Redis 7.2 and earlier:
    BSD-3-Clause.'
  options:
    REDIS_PASSWORD:
      label: Redis password
      type: password
      help: Use Nex Generate. Configure the same password for your client.
    DATA:
      label: Redis persistence
      help: Keep redis persistence in this managed folder between restarts.
    PORT:
      label: Service port
      help: Host-published TCP port. With a dedicated Primary network and host publishing off, use the
        application address on port 6379.
services:
  redis:
    image: docker.io/library/redis:latest
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --requirepass
    - ${REDIS_PASSWORD}
    volumes:
    - ${DATA}:/data
    ports:
    - ${PORT:-6379}:6379/tcp
    deploy:
      replicas: 1
