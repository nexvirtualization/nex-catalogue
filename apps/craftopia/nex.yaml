# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Craftopia
  summary: Host a shared survival and crafting world
  description: >-
    Keep the game folders on This host and choose a registered primary network that players can reach.
    Use the app’s Primary address on port 8787 in Multiplayer. First boot downloads the server through
    SteamCMD. Restarts check for updates. Make a stopped backup before applying game updates.
  category: games
  website: https://store.steampowered.com/app/1307550/
  source: https://github.com/GameServerManagers/docker-gameserver
  docs: https://linuxgsm.com/servers/ctserver/
  license: Proprietary game server
  architectures:
  - amd64
  tags:
  - steam
  - survival
  options:
    DATA:
      label: Server data
      help: Choose This host and include this folder in stopped backups.
services:
  craftopia:
    image: ghcr.io/gameservermanagers/gameserver:ct
    environment:
      UPDATE_CHECK: '0'
      UPDATE_ON_START: 'true'
    expose:
    - 8787/udp
    - 8787/tcp
    volumes:
    - ${DATA}:/data
    healthcheck:
      start_period: 25m
    stop_grace_period: 90s
    deploy:
      replicas: 1
