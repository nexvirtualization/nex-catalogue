# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: NocoDB
  summary: Manage structured data in a no-code spreadsheet UI
  description: Use the embedded single-node database for the app’s metadata. Set the public URL before
    creating accounts. Configure external data sources from the web interface using the appropriate credentials.
  category: productivity
  website: https://www.nocodb.com/
  source: https://github.com/nocodb/nocodb
  docs: https://nocodb.com/docs/self-hosting/installation/docker
  scalable: false
  primary_service: nocodb
  architectures:
  - amd64
  - arm64
  web:
    service: nocodb
    scheme: http
    port: 8080
  options:
    PUBLIC_URL:
      label: Public web address
      help: Full URL clients will open, including scheme and any non-default port.
    JWT_SECRET:
      label: Authentication signing secret
      help: Use Generate to create a unique secret for this installation.
      type: password
    PORT:
      label: Web port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: NocoDB data
      help: Select This host. Stores the embedded metadata database and attachments. Include this folder
        in a stopped Nex backup.
services:
  nocodb:
    image: nocodb/nocodb:latest
    environment:
      NC_PUBLIC_URL: ${PUBLIC_URL}
      NC_AUTH_JWT_SECRET: ${JWT_SECRET}
    ports:
    - ${PORT:-8080}:8080/tcp
    volumes:
    - ${DATA}:/usr/app/data
    deploy:
      replicas: 1
