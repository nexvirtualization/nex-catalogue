x-nex:
  name: EverShop
  summary: Host an extensible online shop
  description: Create a PostgreSQL database and then complete the administrator setup on a trusted network.
    Set up HTTPS and payment providers before opening the shop to customers.
  category: productivity
  website: https://evershop.io/
  source: https://github.com/evershopcommerce/evershop
  docs: https://evershop.io/docs/development/getting-started/installation
  scalable: false
  primary_service: evershop
  architectures:
  - amd64
  - arm64
  web:
    service: evershop
    scheme: http
    port: 3000
  works_with:
  - postgresql
  options:
    DB_HOST:
      label: Database host
      help: Host or Nex application name of the prepared database service. It must be reachable on internal
        port 5432.
    DB_USER:
      label: Database user
      help: Create a dedicated non-root database user for this application.
    DB_NAME:
      label: Database name
      help: Create a database owned by the configured user first. The default is evershop.
    DB_PASSWORD:
      label: Database password
      help: Password for the dedicated database account.
      type: password
    PORT:
      label: Web port
      help: The app listens on TCP port 3000 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Product media
      help: Select This host. Stores uploaded store assets. Include this folder in a stopped Nex backup.
services:
  evershop:
    image: evershop/evershop:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-evershop}
      DB_PORT: '5432'
    ports:
    - ${PORT:-3000}:3000/tcp
    volumes:
    - ${DATA}:/app/media
    deploy:
      replicas: 1
