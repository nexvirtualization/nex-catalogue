# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Minecraft Cuberite
  summary: Host Minecraft Java Edition worlds with Lua plugins
  description: >-
    Keep the server folders on This host and choose a registered primary network that players can
    reach. Join using the app’s Primary address on TCP 25565 from a Minecraft 1.8–1.12.2 Java
    Edition client. Manage the world and Lua plugins from the data folder. Make a stopped backup
    before applying updates.
  category: games
  website: https://cuberite.org/
  source: https://github.com/cuberite/cuberite
  docs: https://book.cuberite.org/
  license: Apache-2.0
  architectures: [amd64]
  tags: [minecraft, sandbox]
  options:
    DATA:
      label: World, extensions and settings
      help: >-
        Choose This host and include this folder in stopped backups.
services:
  minecraft-cuberite:
    image: ghcr.io/itzg/minecraft-server:latest
    working_dir: /data
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        chown 1000:1000 /data
        if [ ! -f /data/.cuberite-installed ]; then
          set -o pipefail
          curl -fsSL --retry 3 'https://download.cuberite.org/linux-x86_64/Cuberite.tar.gz' | gosu 1000:1000 tar -xz --no-same-owner -C /data
          gosu 1000:1000 test -x /data/Cuberite
          gosu 1000:1000 touch /data/.cuberite-installed
        fi
        if [ ! -f /data/webadmin.ini ]; then
          printf '[WebAdmin]\nEnabled=0\n' | gosu 1000:1000 tee /data/webadmin.ini >/dev/null
        fi
        exec gosu 1000:1000 /data/Cuberite --detached --port 25565
    healthcheck:
      disable: true
    expose:
      - 25565/tcp
    volumes:
      - ${DATA}:/data
    stop_grace_period: 90s
    deploy:
      replicas: 1
