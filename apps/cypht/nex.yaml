# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Cypht
  summary: Read existing email accounts through webmail
  description: Provision MariaDB and Redis, then sign in with the configured user from a trusted HTTPS endpoint
    and connect your existing mailboxes.
  category: communication
  website: https://cypht.org
  source: https://github.com/cypht-org/cypht
  docs: https://github.com/cypht-org/cypht
  primary_service: cypht
  post_install: Provision MariaDB and Redis, then sign in with the configured user from a trusted HTTPS endpoint
    and connect your existing mailboxes.
  license: LGPL-2.1
  architectures:
  - amd64
  - arm64
  web:
    port: 80
  options:
    ADMIN_USER:
      label: Admin user
      help: Enter the deployment value described in the upstream setup guide.
    ADMIN_PASSWORD:
      label: Admin password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    DB_HOST:
      label: Db host
      help: Hostname or Nex connection name of the database service.
    DB_PORT:
      label: Db port
      help: Enter the deployment value described in the upstream setup guide.
    DB_NAME:
      label: Db name
      help: Enter the deployment value described in the upstream setup guide.
    DB_USER:
      label: Db user
      help: Enter the deployment value described in the upstream setup guide.
    DB_PASSWORD:
      label: Db password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    REDIS_HOST:
      label: Redis host
      help: Enter the deployment value described in the upstream setup guide.
    REDIS_PORT:
      label: Redis port
      help: Enter the deployment value described in the upstream setup guide.
    REDIS_PASSWORD:
      label: Redis password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    PORT:
      label: HTTP port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
    ATTACHMENTS:
      label: Webmail attachments
      help: Managed directory mounted at /var/lib/hm3/attachments. Choose storage writable by the application.
services:
  cypht:
    image: docker.io/cypht/cypht:latest
    ports:
    - ${PORT:-80}:80/tcp
    volumes:
    - ${ATTACHMENTS}:/var/lib/hm3/attachments
    environment:
      AUTH_USERNAME: ${ADMIN_USER:-admin}
      AUTH_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_USERS: ${ADMIN_USER:-admin}
      AUTH_TYPE: DB
      USER_CONFIG_TYPE: DB
      DB_CONNECTION_TYPE: host
      DB_DRIVER: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-cypht}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
      SESSION_TYPE: REDIS
      ENABLE_REDIS: 'true'
      REDIS_SERVER: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASS: ${REDIS_PASSWORD}
      REDIS_SOCKET: ''
      ENCRYPT_LOCAL_STORAGE: 'true'
    deploy:
      replicas: 1
