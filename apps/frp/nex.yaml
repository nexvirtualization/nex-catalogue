x-nex:
  name: Frp
  summary: FRP forwards traffic to services behind NAT or a firewall
  description: FRP server (frps) that forwards traffic to services behind NAT or a firewall. Requires a
    prepared frps.toml with authentication and TLS for trusted clients.
  category: networking
  source: https://github.com/fatedier/frp
  website: https://gofrp.org/en/
  docs: https://gofrp.org/en/docs/setup/
  primary_service: frp
  options:
    CONFIG:
      label: Config folder
      help: Choose a folder containing a readable frps.toml at its top level. An empty folder prevents startup.
    PORT:
      label: Port 7000/tcp
      help: The app listens on TCP port 7000 on its default Docker network. Nex does not publish it on host
        addresses.
  post_install: Prepare frps.toml with bindPort = 7000, authentication and TLS. Validate it with frps verify -c frps.toml.
    If the folder was created during install, upload the file under Files → Config folder, then restart FRP.
    Use a dedicated app address or separate proxy configuration for any extra listener ports.
services:
  frp:
    image: ghcr.io/fatedier/frps:v0.71.0
    deploy:
      replicas: 1
    volumes:
    - ${CONFIG}:/nex-config:ro
    ports:
    - ${PORT:-7000}:7000/tcp
    command:
    - -c
    - /nex-config/frps.toml
