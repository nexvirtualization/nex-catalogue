x-nex:
  name: AnyCable
  summary: Realtime server for reliable two-way communication over WebSockets, Server-sent events, etc
  description: Realtime server for reliable two-way communication over WebSockets, Server-sent events, etc.
  category: communication
  source: https://github.com/anycable/anycable
  website: https://anycable.io/
  docs: https://docs.anycable.io/anycable-go/configuration
  primary_service: anycable
  options:
    RPC_ENDPOINT:
      label: Rpc endpoint
    SERVER_SECRET:
      label: Server secret
      type: password
      help: Use a unique value and keep it with the application backups.
    REDIS_URL:
      label: Redis url
    PORT:
      label: Port 8080/tcp
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
  post_install: Provision the application RPC endpoint and a Redis instance. Configure WebSocket forwarding
    to /cable and use the correct secret for your application.
services:
  anycable:
    image: docker.io/anycable/anycable-go:latest
    deploy:
      replicas: 1
    environment:
      ANYCABLE_HOST: 0.0.0.0
      ANYCABLE_PORT: '8080'
      ANYCABLE_RPC_HOST: ${RPC_ENDPOINT}
      ANYCABLE_SECRET: ${SERVER_SECRET}
      ANYCABLE_REDIS_URL: ${REDIS_URL}
    ports:
    - ${PORT:-8080}:8080/tcp
