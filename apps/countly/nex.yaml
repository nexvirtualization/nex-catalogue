# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Countly Community Edition
  summary: Collect product and website analytics
  description: Provision the supported MongoDB service and use a private authenticated HTTPS endpoint for
    the dashboard. Complete the first administrator and project setup.
  category: monitoring
  website: https://count.ly
  source: https://github.com/Countly/countly-server
  docs: https://github.com/Countly/countly-server/blob/master/Dockerfile
  primary_service: countly
  post_install: Provision the supported MongoDB service and use a private authenticated HTTPS endpoint for
    the dashboard. Complete the first administrator and project setup.
  license: AGPL-3.0
  architectures:
  - amd64
  web:
    port: 80
  options:
    MONGODB_URL:
      label: MongoDB connection URL
      type: password
      help: 'Full URL of your MongoDB server, for example mongodb://user:password@host:27017/?authSource=admin. Percent-encode
        special characters in the credentials. The account needs read and write access to the countly, countly_drill,
        countly_out and countly_fs databases.'
    PORT:
      label: HTTP port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  countly:
    image: docker.io/countly/countly-server:latest
    ports:
    - ${PORT:-80}:80/tcp
    environment:
      COUNTLY_CONTAINER: both
      COUNTLY_CONFIG_API_MONGODB: ${MONGODB_URL}
      COUNTLY_CONFIG_FRONTEND_MONGODB: ${MONGODB_URL}
    deploy:
      replicas: 1
