# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Countly Community Edition
  summary: Collect product and website analytics
  description: Provision the supported MongoDB service and use a private authenticated HTTPS endpoint for
    the dashboard. Complete the first administrator and project setup.
  category: monitoring
  website: https://count.ly
  source: https://github.com/Countly/countly-server
  docs: https://github.com/Countly/countly-server/blob/master/Dockerfile
  primary_service: countly
  post_install: Provision the supported MongoDB service and use a private authenticated HTTPS endpoint for
    the dashboard. Complete the first administrator and project setup.
  license: AGPL-3.0
  architectures:
  - amd64
  web:
    port: 80
  options:
    MONGO_HOST:
      label: Mongo host
      help: Enter the deployment value described in the upstream setup guide.
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 80 inside Nex.
services:
  countly:
    image: docker.io/countly/countly-server:latest
    ports:
    - ${PORT:-23584}:80/tcp
    environment:
      COUNTLY_CONTAINER: both
      COUNTLY_CONFIG_API_MONGODB_HOST: ${MONGO_HOST}
      COUNTLY_CONFIG_FRONTEND_MONGODB_HOST: ${MONGO_HOST}
    deploy:
      replicas: 1
