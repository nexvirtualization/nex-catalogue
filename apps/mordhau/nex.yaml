# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: MORDHAU
  summary: Host medieval multiplayer battles
  description: >-
    Keep the game folders on This host and choose a registered primary network that players can reach.
    Use the server browser or connect to the Primary address on UDP 7777. UDP 15000 and 27015 provide
    beacon and query traffic. First boot downloads the server through SteamCMD. Restarts check for
    updates. Make a stopped backup before applying game updates.
  category: games
  website: https://store.steampowered.com/app/629760/
  source: https://github.com/GameServerManagers/docker-gameserver
  docs: https://linuxgsm.com/servers/mhserver/
  license: Proprietary game server
  architectures:
    - amd64
  tags:
    - steam
    - fps
  options:
    DATA:
      label: Server data
      help: Choose This host and include this folder in stopped backups.
services:
  mordhau:
    image: ghcr.io/gameservermanagers/gameserver:mh
    environment:
      UPDATE_CHECK: '0'
      UPDATE_ON_START: 'true'
    expose:
      - 7777/udp
      - 15000/udp
      - 27015/udp
    volumes:
      - ${DATA}:/data
    healthcheck:
      start_period: 25m
    stop_grace_period: 90s
    deploy:
      replicas: 1
