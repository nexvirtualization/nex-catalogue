# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: OpenSearch
  summary: Index and search documents using the OpenSearch API
  description: Connect with the initial admin account on the private application network. Replace the
    bundled demo certificates or terminate TLS with a trusted deployment before exposing it.
  category: development
  website: https://github.com/opensearch-project/OpenSearch
  source: https://github.com/opensearch-project/OpenSearch
  docs: https://docs.opensearch.org/latest/install-and-configure/install-opensearch/docker/
  primary_service: opensearch
  scalable: false
  license: Apache-2.0
  options:
    OPENSEARCH_INITIAL_ADMIN_PASSWORD:
      label: Initial admin password
      type: password
      generate: {format: password, length: 24, min_length: 8}
      help: Use Generate, which makes 24 characters with upper- and lower-case letters, a digit and a symbol,
        as OpenSearch requires. If Generate gives letters and digits only (older Nex), add a symbol such as !
        to the end. A password you type needs at least 8 characters with all four kinds.
    DATA:
      label: Search indexes and configuration
      help: Keep search indexes and configuration in this managed folder between restarts.
    PORT:
      label: Service port
      help: The app listens on TCP port 9200 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  opensearch:
    image: docker.io/opensearchproject/opensearch:latest
    environment:
      discovery.type: single-node
      node.store.allow_mmap: 'false'
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    volumes:
    - ${DATA}:/usr/share/opensearch/data
    ports:
    - ${PORT:-9200}:9200/tcp
    deploy:
      replicas: 1
