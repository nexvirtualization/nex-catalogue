x-nex:
  name: Zipline
  summary: Upload and organize shareable files
  description: Create a PostgreSQL database and complete initial administrator setup on a trusted network.
    Use HTTPS for share URLs and upload clients.
  category: tools
  website: https://github.com/diced/zipline
  source: https://github.com/diced/zipline
  docs: https://zipline.diced.sh/docs/get-started
  scalable: false
  primary_service: zipline
  architectures:
  - amd64
  - arm64
  web:
    service: zipline
    scheme: http
    port: 3000
  works_with:
  - postgresql
  options:
    DATABASE_URL:
      label: Database connection string
      help: Create the database and its dedicated user first. Supply a complete PostgreSQL URI with a
        percent-encoded password. Nex applications can use the database app connection name and port 5432.
      type: password
    SESSION_SECRET:
      label: Session signing secret
      help: Use Generate, which makes 32 letters and digits. It must be at least 32 characters. If Generate
        gives only 24 characters (older Nex), paste the output of openssl rand -hex 32 instead.
      type: password
      generate: {format: alnum, length: 32, min_length: 32}
    PORT:
      label: Web port
      help: The app listens on TCP port 3000 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Shared files
      help: Select This host. Stores user uploads. Include this folder in a stopped Nex backup.
    PUBLIC:
      label: Public assets
      help: Select This host. Stores customization assets. Include this folder in a stopped Nex backup.
    THEMES:
      label: Themes
      help: Select This host. Stores custom themes. Include this folder in a stopped Nex backup.
services:
  zipline:
    image: ghcr.io/diced/zipline:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CORE_SECRET: ${SESSION_SECRET}
      CORE_HOSTNAME: 0.0.0.0
      CORE_PORT: '3000'
      DATASOURCE_TYPE: local
      DATASOURCE_LOCAL_DIRECTORY: /zipline/uploads
    ports:
    - ${PORT:-3000}:3000/tcp
    volumes:
    - ${DATA}:/zipline/uploads
    - ${PUBLIC}:/zipline/public
    - ${THEMES}:/zipline/themes
    deploy:
      replicas: 1
