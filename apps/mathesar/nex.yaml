# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Mathesar
  summary: Browse and edit PostgreSQL data through a web interface
  description: Provision a PostgreSQL database for Mathesar. Connect any additional databases with dedicated
    least-privilege accounts.
  category: development
  website: https://mathesar.org/
  source: https://github.com/mathesar-foundation/mathesar
  docs: https://docs.mathesar.org/latest/administration/install-via-docker-compose/
  primary_service: mathesar
  post_install: Provision a PostgreSQL database for Mathesar. Connect any additional databases with dedicated
    least-privilege accounts.
  license: GPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 8000
  options:
    DATABASE_URL:
      label: Database url
      help: Connection URL for the database. Percent-encode special characters in credentials.
      type: password
    SIGNING_SECRET:
      label: Signing secret
      help: Use the credential or secret required by the upstream configuration.
      type: password
    ALLOWED_HOSTS:
      label: Allowed hosts
      help: Enter the deployment value described in the upstream setup guide.
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 8000 inside Nex.
    MEDIA:
      label: Application media
      help: Managed directory mounted at /code/media. Choose storage writable by the application.
services:
  mathesar:
    image: docker.io/mathesar/mathesar:latest
    ports:
    - ${PORT:-23585}:8000/tcp
    volumes:
    - ${MEDIA}:/code/media
    environment:
      DJANGO_DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SIGNING_SECRET}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    deploy:
      replicas: 1
