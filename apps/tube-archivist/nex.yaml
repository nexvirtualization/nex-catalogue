# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Tube Archivist
  summary: Archive and index videos in a local collection
  description: Provision the compatible Elasticsearch and Redis versions identified in upstream docs. Sign
    in on a trusted network and add only content you may archive.
  category: media
  website: https://tubearchivist.com/
  source: https://github.com/tubearchivist/tubearchivist
  docs: https://docs.tubearchivist.com/installation/docker-compose/
  primary_service: tube-archivist
  post_install: Provision the compatible Elasticsearch and Redis versions identified in upstream docs. Sign
    in on a trusted network and add only content you may archive.
  license: GPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 8000
  options:
    PUBLIC_HOST:
      label: Public host
      help: Enter the deployment value described in the upstream setup guide.
    USER:
      label: User
      help: Enter the deployment value described in the upstream setup guide.
    PASSWORD:
      label: Password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    SEARCH_URL:
      label: Search url
      help: Enter the deployment value described in the upstream setup guide.
    SEARCH_PASSWORD:
      label: Search password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    REDIS_URL:
      label: Redis url
      help: Enter the deployment value described in the upstream setup guide.
    PORT:
      label: HTTP port
      help: The app listens on TCP port 8000 on its default Docker network. Nex does not publish it on host
        addresses.
    VIDEOS:
      label: Video archive
      help: Managed directory mounted at /youtube. Choose storage writable by the application.
    CACHE:
      label: Cache and app state
      help: Managed directory mounted at /cache. Choose storage writable by the application.
services:
  tube-archivist:
    image: docker.io/bbilly1/tubearchivist:latest
    ports:
    - ${PORT:-8000}:8000/tcp
    volumes:
    - ${VIDEOS}:/youtube
    - ${CACHE}:/cache
    environment:
      TA_HOST: ${PUBLIC_HOST}
      TA_USERNAME: ${USER:-admin}
      TA_PASSWORD: ${PASSWORD}
      ES_URL: ${SEARCH_URL}
      ELASTIC_PASSWORD: ${SEARCH_PASSWORD}
      REDIS_CON: ${REDIS_URL}
    deploy:
      replicas: 1
