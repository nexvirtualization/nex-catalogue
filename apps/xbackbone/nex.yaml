x-nex:
  name: XBackBone
  summary: Share files and screenshots from a web dashboard
  description: Complete the web installer on a trusted network. Install behind HTTPS for shared use. Set
    the public base URL to the address that upload clients and recipients use.
  category: tools
  website: https://xbackbone.app/
  source: https://github.com/SergiX44/XBackBone
  docs: https://docs.linuxserver.io/images/docker-xbackbone/
  scalable: false
  primary_service: xbackbone
  architectures:
  - amd64
  - arm64
  web:
    service: xbackbone
    scheme: http
    port: 80
  options:
    PUID:
      label: User ID
      help: Numeric UID of the process accessing the configuration folder.
    PGID:
      label: Group ID
      help: Numeric GID for the configuration folder.
    TZ:
      label: Time zone
      help: IANA time zone for uploads and server logs.
    PORT:
      label: Web port
      help: Host-published HTTP port when publishing is enabled. With a dedicated Primary network, use
        the application address on port 80.
    DATA:
      label: XBackBone data
      help: Select This host. Holds settings, the SQLite database and uploaded files. Include this folder
        in a stopped Nex backup.
services:
  xbackbone:
    image: lscr.io/linuxserver/xbackbone:latest
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    ports:
    - ${PORT:-8175}:80/tcp
    volumes:
    - ${DATA}:/config
    deploy:
      replicas: 1
