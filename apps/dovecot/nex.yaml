# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Dovecot
  summary: Serve mailboxes over IMAP
  description: Requires a complete Dovecot 2.4 configuration and writable mailbox storage for the rootless
    image. Use a dedicated app network and the listener ports in your configuration.
  category: communication
  website: https://www.dovecot.org/
  source: https://github.com/dovecot/core
  docs: https://doc.dovecot.org/main/installation/docker.html
  primary_service: dovecot
  post_install: Supply a complete Dovecot 2.4 configuration with your authentication backend, TLS certificates
    and mailbox paths under /srv/mail. Nex's no-new-privileges policy blocks the rootless image's default login chroots.
    If your security policy permits running without those chroots, follow the upstream Running without Linux capabilities
    instructions in your prepared configuration. After importing files under Files → Prepared mail configuration,
    restart and verify an authenticated IMAP connection over TLS.
  license: MIT/LGPL-2.1
  architectures:
  - amd64
  - arm64
  options:
    CONFIG:
      label: Prepared mail configuration
      help: Choose a prepared folder with dovecot.conf and its includes, readable by UID 1000. This folder replaces /etc/dovecot.
    MAIL:
      label: Mailbox storage
      help: Choose storage writable by UID 1000 and configure Dovecot to keep mail under /srv/mail.
services:
  dovecot:
    image: docker.io/dovecot/dovecot:latest
    volumes:
    - ${CONFIG}:/etc/dovecot:ro
    - ${MAIL}:/srv/mail
    deploy:
      replicas: 1
