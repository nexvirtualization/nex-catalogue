x-nex:
  name: QloApps
  summary: Host a hotel booking and reservation website
  description: Run the web installer on a trusted network using the setup guidance for the upstream image.
    Complete hotel configuration before publishing to guests via an HTTPS reverse proxy.
  category: productivity
  website: https://qloapps.com/
  source: https://github.com/Qloapps/QloApps
  docs: https://hub.docker.com/r/webkul/qloapps_docker
  scalable: false
  primary_service: qloapps
  architectures:
  - amd64
  - arm64
  web:
    service: qloapps
    scheme: http
    port: 80
  options:
    MYSQL_ROOT_PASSWORD:
      label: MySQL root password
      help: For a new database, generate and save an alphanumeric password in your password manager.
        Enter it here and in the web installer for the bundled qloapps database. When reusing Hotel
        database storage, enter its existing MySQL root password.
      type: password
    USER_PASSWORD:
      label: Container SSH user password
      help: Generate and save a separate alphanumeric password for the qloapps SSH account inside the
        container. The image applies it on every startup. The web installer creates the hotel
        administrator login.
      type: password
    PORT:
      label: Web port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Hotel website
      help: Select This host. Stores the website files, uploads, themes and application configuration.
        Include this folder in a stopped Nex backup.
    DB_DATA:
      label: Hotel database
      help: Select This host. Stores the bundled MySQL data and database accounts. Include
        this folder in a stopped Nex backup.
services:
  qloapps:
    image: webkul/qloapps_docker:latest
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      USER_PASSWORD: ${USER_PASSWORD}
    ports:
    - ${PORT:-80}:80/tcp
    volumes:
    - ${DATA}:/var/www/html
    - ${DB_DATA}:/var/lib/mysql
    deploy:
      replicas: 1
