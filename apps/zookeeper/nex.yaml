# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Apache ZooKeeper
  summary: Coordinate distributed applications through ZooKeeper
  description: Use this standalone profile for one coordinator on a private network. Configure appropriate
    authentication and access controls before exposing the client port.
  category: development
  website: https://github.com/apache/zookeeper
  source: https://github.com/apache/zookeeper
  docs: https://hub.docker.com/_/zookeeper
  primary_service: zookeeper
  scalable: false
  license: Apache-2.0
  options:
    DATA:
      label: ZooKeeper snapshots
      help: Keep zookeeper snapshots in this managed folder between restarts.
    LOGS:
      label: ZooKeeper transaction logs
      help: Keep zookeeper transaction logs in this managed folder between restarts.
    PORT:
      label: Service port
      help: The app listens on TCP port 2181 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  zookeeper:
    image: docker.io/library/zookeeper:latest
    volumes:
    - ${DATA}:/data
    - ${LOGS}:/datalog
    ports:
    - ${PORT:-2181}:2181/tcp
    deploy:
      replicas: 1
