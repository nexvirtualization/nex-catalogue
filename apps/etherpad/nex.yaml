x-nex:
  name: Etherpad
  summary: Highly customizable online editor providing collaborative editing in real-time
  description: Highly customizable online editor providing collaborative editing in real-time.
  category: productivity
  source: https://github.com/ether/etherpad
  website: https://etherpad.org/
  docs: https://docs.etherpad.org/
  primary_service: etherpad
  options:
    ADMIN_SECRET:
      label: Admin OIDC client secret
      type: password
      help: Generate a unique secret for Etherpad's admin OIDC client and reuse it when restoring.
    USER_SECRET:
      label: User OIDC client secret
      type: password
      help: Generate a separate secret for Etherpad's user OIDC client and reuse it when restoring.
    DATA:
      label: Data folder
      help: Choose the Nex-managed folder mounted at /opt/etherpad-lite/var.
    PORT:
      label: Port 9001/tcp
      help: The app listens on TCP port 9001 on its default Docker network. Nex does not publish it on host
        addresses.
  post_install: Open the editor on a trusted network. DirtyDB is for small single-copy installations.
    For production, use an upstream-supported database with a custom deployment. Back up the var folder
    while stopped. Update any external OIDC clients that used the old secrets.
  web:
    port: 9001
services:
  etherpad:
    image: docker.io/etherpad/etherpad:latest
    deploy:
      replicas: 1
    environment:
      DB_TYPE: dirty
      ADMIN_SECRET: ${ADMIN_SECRET}
      USER_SECRET: ${USER_SECRET}
    volumes:
    - ${DATA}:/opt/etherpad-lite/var
    ports:
    - ${PORT:-9001}:9001/tcp
