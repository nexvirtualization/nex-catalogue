# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: vLLM CPU
  summary: Serve a language model through an OpenAI-compatible API
  description: Select an x86-64 host with the CPU instruction support and memory described upstream. vLLM
    needs at least 512 MiB of shared memory (/dev/shm). Nex does not apply the size set in this package,
    so set Shared memory to 512 MiB or more in the app's Nex settings; with the default 64 MiB vLLM stops
    with "Insufficient space in /dev/shm". The first start downloads the model from Hugging Face, so the
    host needs internet access. Keep the API on an authenticated private endpoint.
  category: ai
  website: https://vllm.ai/
  source: https://github.com/vllm-project/vllm
  docs: https://docs.vllm.ai/en/latest/getting_started/installation/cpu/
  scalable: false
  primary_service: vllm
  post_install: If you have not already, set Shared memory to at least 512 MiB in the app's Nex settings,
    then restart the app. With the default 64 MiB vLLM stops with "Insufficient space in /dev/shm".
  architectures:
  - amd64
  web:
    service: vllm
    scheme: http
    port: 8000
  options:
    MODEL:
      label: Model
      help: Public model identifier or a local model path available inside the container.
    API_KEY:
      label: Inference API key
      help: Use Generate to create a unique secret for this installation.
      type: password
    KV_CACHE:
      label: Cache memory in GiB
      help: Whole GiB that vLLM reserves for request caches. Without a limit it reserves most of the host's
        memory and is killed. Leave empty for 4, which suits the default small model; raise it for larger
        models or many requests.
    PORT:
      label: Web port
      help: The app listens on TCP port 8000 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Model cache
      help: Select This host. Stores model weights downloaded from the configured repository. Include
        this folder in a stopped Nex backup.
services:
  vllm:
    image: vllm/vllm-openai-cpu:latest-x86_64
    command:
    - --model
    - ${MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --api-key
    - ${API_KEY}
    environment:
      VLLM_CPU_KVCACHE_SPACE: ${KV_CACHE:-4}
    ports:
    - ${PORT:-8000}:8000/tcp
    volumes:
    - ${DATA}:/root/.cache/huggingface
    tmpfs:
    - /dev/shm:size=4294967296
    deploy:
      replicas: 1
