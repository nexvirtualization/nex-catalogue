# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: TREK
  summary: Plan trips and collect itineraries together
  description: TREK keeps its database and uploaded files in managed folders. Keep its encryption key with
    your backup.
  category: productivity
  website: https://github.com/liketrek/TREK
  source: https://github.com/liketrek/TREK
  docs: https://github.com/liketrek/TREK
  primary_service: trek
  post_install: Create the first account on a trusted network, then verify access and registration in Admin
    settings. Use HTTPS through a reverse proxy.
  architectures:
  - amd64
  - arm64
  web:
    port: 3000
  options:
    ENCRYPTION_KEY:
      label: Encryption key
      help: Use Generate, which makes 64 hexadecimal characters. If Generate gives letters and digits only
        (older Nex), paste the output of openssl rand -hex 32 instead.
      type: password
      generate: {format: hex, length: 64}
    PORT:
      label: HTTP port
      help: The app listens on TCP port 3000 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Travel plans and database
      help: Managed directory mounted at /app/data. Choose storage writable by the application.
    UPLOADS:
      label: Uploaded files
      help: Managed directory mounted at /app/uploads. Choose storage writable by the application.
services:
  trek:
    image: docker.io/mauriceboe/trek:latest
    ports:
    - ${PORT:-3000}:3000/tcp
    volumes:
    - ${DATA}:/app/data
    - ${UPLOADS}:/app/uploads
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    deploy:
      replicas: 1
