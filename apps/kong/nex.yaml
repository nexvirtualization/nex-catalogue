x-nex:
  name: Kong Gateway
  summary: Route APIs through a declaratively configured gateway
  description: Kong starts with a built-in status route that answers on port 8000. To publish your own
    services, routes and authentication plugins, put kong.yml in the Configuration folder and restart;
    that file replaces the built-in one. Keep the Admin API off in this DB-less deployment.
  category: networking
  website: https://konghq.com/kong/
  source: https://github.com/Kong/kong
  docs: https://docs.konghq.com/gateway/latest/production/deployment-topologies/db-less-and-declarative-config/
  scalable: false
  primary_service: kong
  architectures:
  - amd64
  - arm64
  options:
    GATEWAY_PORT:
      label: Gateway Port
      help: The app listens on TCP port 8000 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Configuration folder
      help: Select This host. Optional kong.yml at the folder root (read-only) replaces the built-in
        status route. Include this folder in a stopped Nex backup.
services:
  kong:
    image: kong:latest
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /settings/kong.yml
      KONG_ADMIN_LISTEN: 'off'
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    ports:
    - ${GATEWAY_PORT:-8000}:8000/tcp
    command:
    - /bin/sh
    - -ec
    - |
      if [ ! -f /settings/kong.yml ]; then
        cat > /tmp/kong-default.yml <<'KONG'
      _format_version: "3.0"
      routes:
      - name: nex-status
        paths: ["/"]
        plugins:
        - name: request-termination
          config:
            status_code: 200
            message: Kong Gateway is running. Add services and routes in kong.yml.
      KONG
        export KONG_DECLARATIVE_CONFIG=/tmp/kong-default.yml
      fi
      exec /docker-entrypoint.sh kong docker-start
    volumes:
    - ${DATA}:/settings:ro
    deploy:
      replicas: 1
