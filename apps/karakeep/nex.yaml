# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Karakeep
  summary: Archive and organize bookmarks with Karakeep
  description: Create the first user and back up Data. Configure separate browser and search services for
    page captures and full-text search.
  category: productivity
  website: https://karakeep.app/
  source: https://github.com/karakeep-app/karakeep
  docs: https://docs.karakeep.app/installation/docker/
  primary_service: karakeep
  post_install: Create the first user and back up Data. Configure separate browser and search services for
    page captures and full-text search.
  license: AGPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 3000
  options:
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    SIGNING_SECRET:
      label: Signing secret
      help: Use the credential or secret required by the upstream configuration.
      type: password
    BROWSER_ENDPOINT:
      label: Browser endpoint
      help: Enter the deployment value described in the upstream setup guide.
    MEILI_URL:
      label: Meili url
      help: Enter the deployment value described in the upstream setup guide.
    MEILI_KEY:
      label: Meili key
      help: Use the credential or secret required by the upstream configuration.
      type: password
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 3000 inside Nex.
    DATA:
      label: Bookmarks and attachments
      help: Managed directory mounted at /data. Choose storage writable by the application.
services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:latest
    ports:
    - ${PORT:-23474}:3000/tcp
    volumes:
    - ${DATA}:/data
    environment:
      NEXTAUTH_URL: ${PUBLIC_URL}
      NEXTAUTH_SECRET: ${SIGNING_SECRET}
      DATA_DIR: /data
      BROWSER_WEB_URL: ${BROWSER_ENDPOINT}
      MEILI_ADDR: ${MEILI_URL}
      MEILI_MASTER_KEY: ${MEILI_KEY}
    deploy:
      replicas: 1
