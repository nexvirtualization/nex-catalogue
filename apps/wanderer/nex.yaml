x-nex:
  name: wanderer
  summary: Catalog and share outdoor routes and trails
  description: Meilisearch runs inside this app. Use the trusted HTTPS address as the public URL. Keep the web,
    PocketBase and search services on one host or use shared storage.
  category: productivity
  website: https://github.com/open-wanderer/wanderer
  source: https://github.com/open-wanderer/wanderer
  docs: https://github.com/open-wanderer/wanderer/blob/main/docker-compose.yml
  primary_service: wanderer
  post_install: Create the first account on a trusted network, then turn on Disable signup if only you should
    register. Keep the web, PocketBase and search services on one host or use shared storage.
  license: AGPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 3000
  options:
    MEILI_KEY:
      label: Search master key
      help: Use Generate to create the master key of the Meilisearch service that runs inside this app.
      type: password
    SEARCH_DATA:
      label: Search index
      help: Select This host. Stores the Meilisearch index. Include this folder in a stopped Nex backup.
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    PROXY_SECRET:
      label: Proxy secret
      help: Use Generate. Shared by the web and PocketBase services to trust each other.
      type: password
    ENCRYPTION_KEY:
      label: Encryption secret
      help: Use Generate (24 characters). Nex adds 8 fixed characters to make the 32 PocketBase needs. Keep it
        unchanged, because PocketBase cannot read its stored settings with a different secret.
      type: password
    DISABLE_SIGNUP:
      label: Disable signup
      help: Enter true to stop new people registering, or false to allow it. Defaults to false.
    PORT:
      label: HTTP port
      help: The app listens on TCP port 3000 on its default Docker network. Nex does not publish it on host
        addresses.
    UPLOADS:
      label: Trail uploads
      help: Managed directory mounted at /app/uploads. Choose storage writable by the application.
    DB_STORAGE:
      label: PocketBase database
      help: Managed writable directory mounted at /pb_data in PocketBase.
    PLUGINS:
      label: PocketBase plugins
      help: Managed writable directory mounted at /data/plugins in PocketBase.
services:
  wanderer:
    image: docker.io/flomp/wanderer-web:latest
    ports:
    - ${PORT:-3000}:3000/tcp
    volumes:
    - ${UPLOADS}:/app/uploads
    environment:
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: ${MEILI_KEY}
      ORIGIN: ${PUBLIC_URL}
      PUBLIC_POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_PROXY_SECRET: ${PROXY_SECRET}
      BODY_SIZE_LIMIT: 2G
      PUBLIC_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      UPLOAD_FOLDER: /app/uploads
    deploy:
      replicas: 1
  pocketbase:
    image: docker.io/flomp/wanderer-db:latest
    environment:
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: ${MEILI_KEY}
      ORIGIN: ${PUBLIC_URL}
      POCKETBASE_PROXY_SECRET: ${PROXY_SECRET}
      POCKETBASE_ENCRYPTION_KEY: ${ENCRYPTION_KEY}nexwndr1
    volumes:
    - ${DB_STORAGE}:/pb_data
    - ${PLUGINS}:/data/plugins
    deploy:
      replicas: 1
      # PocketBase sets up its search indexes on start and exits if Meilisearch is not up yet; retry.
      restart_policy:
        condition: any
        delay: 3s
  search:
    image: docker.io/getmeili/meilisearch:latest
    environment:
      MEILI_MASTER_KEY: ${MEILI_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
    volumes:
    - ${SEARCH_DATA}:/meili_data
    deploy:
      replicas: 1
