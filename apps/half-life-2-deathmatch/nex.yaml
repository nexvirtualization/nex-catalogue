# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: 'Half-Life 2: Deathmatch'
  summary: Host Source-engine deathmatch
  description: >-
    Keep the game folders on This host and choose a registered primary network that players can reach.
    Use connect APP-IP:27015 in the in-game developer console, with the app’s Primary address in place
    of APP-IP. First boot downloads the server through SteamCMD. Restarts check for updates. Make
    a stopped backup before applying game updates.
  category: games
  website: https://store.steampowered.com/app/320/
  source: https://github.com/GameServerManagers/docker-gameserver
  docs: https://linuxgsm.com/servers/hl2dmserver/
  license: Proprietary game server
  architectures:
    - amd64
  tags:
    - steam
    - fps
  options:
    DATA:
      label: Server data
      help: Choose This host and include this folder in stopped backups.
services:
  half-life-2-deathmatch:
    image: ghcr.io/gameservermanagers/gameserver:hl2dm
    environment:
      UPDATE_CHECK: '0'
      UPDATE_ON_START: 'true'
    expose:
      - 27015/udp
    volumes:
      - ${DATA}:/data
    healthcheck:
      start_period: 25m
    stop_grace_period: 90s
    deploy:
      replicas: 1
