# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Among Us Impostor
  summary: Host a custom region for Among Us multiplayer
  description: >-
    Keep the game folders on This host and choose a registered primary network that players can reach.
    Set the player-reachable address to the app’s fixed Primary IPv4 address or a DNS name that resolves
    to it. Set up HTTPS in front of TCP 22023 using the Impostor HTTP server guide and keep UDP 22023
    reachable directly. Share the custom region generated by the Impostor region tool with players.
    Use plugins built for the installed server version.
  category: games
  website: https://impostor.github.io/Impostor/
  source: https://github.com/Impostor/Impostor
  docs: https://github.com/Impostor/Impostor/blob/master/docs/Running-the-server.md
  license: GPL-3.0 game server
  architectures:
  - amd64
  - arm64
  tags:
  - multiplayer
  options:
    PLUGINS:
      label: Server plugins
      help: Choose This host and store optional Impostor plugins here.
    LIBRARIES:
      label: Plugin libraries
      help: Choose This host and store any extra libraries required by your Impostor plugins here.
    PUBLIC_ADDRESS:
      label: Player-reachable address
      help: Fixed Primary IPv4 address or DNS name that players can reach.
services:
  among-us-impostor:
    image: docker.io/aeonlucid/impostor:latest
    environment:
      IMPOSTOR_Server__PublicIp: ${PUBLIC_ADDRESS}
      IMPOSTOR_Server__PublicPort: '22023'
    expose:
    - 22023/tcp
    - 22023/udp
    volumes:
    - ${PLUGINS}:/app/plugins
    - ${LIBRARIES}:/app/libraries
    stop_grace_period: 90s
    deploy:
      replicas: 1
