x-nex:
  name: Fusio
  summary: API management platform which helps to build and manage REST APIs
  description: API management platform which helps to build and manage REST APIs.
  category: development
  source: https://github.com/apioo/fusio
  website: https://www.fusio-project.org/
  docs: https://github.com/apioo/fusio#installation
  primary_service: fusio
  options:
    PROJECT_KEY:
      label: Project key
      type: password
      generate: {format: alnum, length: 32, min_length: 32}
      help: Use Generate, which makes 32 letters and digits. It must be at least 32 characters. If Generate
        gives only 24 characters (older Nex), paste the output of openssl rand -hex 32 instead. Keep it with
        the application backups.
    DATABASE_URL:
      label: Database url
      type: password
      help: Use a unique value and keep it with the application backups.
    ADMIN_USER:
      label: Admin user
    ADMIN_EMAIL:
      label: Admin email
    ADMIN_PASSWORD:
      label: Admin password
      type: password
      help: Use a unique value and keep it with the application backups.
    PORT:
      label: Port 80/tcp
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
  post_install: Provision a MySQL database and enter a PDO MySQL URI, such as pdo-mysql://user:pass@db/fusio.
    Sign in at /apps/fusio on first use.
  web:
    port: 80
services:
  fusio:
    image: docker.io/fusio/fusio:latest
    deploy:
      replicas: 1
    environment:
      FUSIO_PROJECT_KEY: ${PROJECT_KEY}
      FUSIO_CONNECTION: ${DATABASE_URL}
      FUSIO_BACKEND_USER: ${ADMIN_USER:-admin}
      FUSIO_BACKEND_EMAIL: ${ADMIN_EMAIL}
      FUSIO_BACKEND_PW: ${ADMIN_PASSWORD}
    ports:
    - ${PORT:-80}:80/tcp
