x-nex:
  name: Ghost
  summary: Publish a blog and newsletter
  description: Provision a supported MySQL 8 database and configure the public HTTPS URL. Use the /ghost/
    administration route to create an administrator. Configure email delivery in Ghost if you use newsletters.
  category: productivity
  website: https://ghost.org/
  source: https://github.com/TryGhost/Ghost
  docs: https://docs.ghost.org/install/docker
  scalable: false
  primary_service: ghost
  architectures:
  - amd64
  - arm64
  web:
    service: ghost
    scheme: http
    port: 2368
  works_with:
  - mariadb
  - mysql
  options:
    DB_HOST:
      label: Database host
      help: Host or Nex application name of the prepared database service. It must be reachable on internal
        port 3306.
    DB_USER:
      label: Database user
      help: Create a dedicated non-root database user for this application.
    DB_NAME:
      label: Database name
      help: Create a database owned by the configured user first. The default is ghost.
    DB_PASSWORD:
      label: Database password
      help: Password for the dedicated database account.
      type: password
    PUBLIC_URL:
      label: Public web address
      help: Full URL clients will open, including scheme and any non-default port.
    PORT:
      label: Web port
      help: The app listens on TCP port 2368 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Blog content
      help: Select This host. Stores themes, media and other files. Include this folder in a stopped Nex
        backup.
services:
  ghost:
    image: ghost:latest
    environment:
      database__connection__host: ${DB_HOST}
      database__connection__user: ${DB_USER}
      database__connection__password: ${DB_PASSWORD}
      database__connection__database: ${DB_NAME:-ghost}
      database__client: mysql
      url: ${PUBLIC_URL}
    ports:
    - ${PORT:-2368}:2368/tcp
    volumes:
    - ${DATA}:/var/lib/ghost/content
    deploy:
      replicas: 1
