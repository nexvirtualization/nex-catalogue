# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Papra
  summary: Archive, search and tag your documents
  description: Set the full browser-facing URL and create the first account on a trusted network before
    allowing general access. Include the signing secret in recovery records.
  category: documents
  website: https://github.com/papra-hq/papra/
  source: https://github.com/papra-hq/papra/
  docs: https://docs.papra.app/self-hosting/using-docker
  primary_service: papra
  scalable: false
  license: AGPL-3.0
  web:
    port: 1221
  options:
    AUTH_SECRET:
      label: Authentication secret
      type: password
      generate: {format: alnum, length: 32, min_length: 32}
      help: Use Generate, which makes 32 letters and digits. It must be at least 32 characters. If Generate
        gives only 24 characters (older Nex), paste the output of openssl rand -hex 32 instead. Retain it for
        restores.
    BASE_URL:
      label: Public web address
      help: Full browser-facing URL including scheme and port as needed.
    DATA:
      label: Documents and database
      help: Stored documents, search metadata and application database.
    PORT:
      label: Web port
      help: The app listens on TCP port 1221 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  papra:
    image: ghcr.io/papra-hq/papra:latest
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      APP_BASE_URL: ${BASE_URL}
    volumes:
    - ${DATA}:/app/app-data
    ports:
    - ${PORT:-1221}:1221/tcp
    deploy:
      replicas: 1
