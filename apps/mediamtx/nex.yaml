x-nex:
  name: MediaMTX
  summary: Ready-to-use, zero-dependency real-time media server and proxy to publish, read, record, playback
    and route
  description: Ready-to-use, zero-dependency real-time media server and proxy to publish, read, record, playback
    and route video/audio streams over SRT, WebRTC, RTSP, RTMP, HLS, MPEG-TS, RTP.
  category: media
  source: https://github.com/bluenviron/mediamtx
  website: https://mediamtx.org
  docs: https://mediamtx.org/docs/kickoff/install
  primary_service: mediamtx
  options:
    PORT:
      label: Port 8554/tcp
      help: The app listens on TCP port 8554 on its default Docker network. Nex does not publish it on host
        addresses.
    PORT_2:
      label: Port 1935/tcp
      help: The app listens on TCP port 1935 on its default Docker network. Nex does not publish it on host
        addresses.
    PORT_3:
      label: Port 8888/tcp
      help: The app listens on TCP port 8888 on its default Docker network. Nex does not publish it on host
        addresses.
  post_install: Publish and read streams over TCP RTSP or RTMP. The HLS endpoint is on 8888. Place this profile
    on a trusted network or configure access controls before publication.
services:
  mediamtx:
    image: docker.io/bluenviron/mediamtx:latest
    deploy:
      replicas: 1
    environment:
      MTX_RTSPTRANSPORTS: tcp
      MTX_WEBRTC: 'no'
      MTX_SRT: 'no'
    ports:
    - ${PORT:-8554}:8554/tcp
    - ${PORT_2:-1935}:1935/tcp
    - ${PORT_3:-8888}:8888/tcp
