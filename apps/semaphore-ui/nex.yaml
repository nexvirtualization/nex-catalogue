# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Semaphore UI
  summary: Run and schedule Ansible automation in a web interface
  description: This standalone deployment uses SQLite and keeps configuration and project state in separate
    managed folders.
  category: development
  website: https://semaphoreui.com/
  source: https://github.com/semaphoreui/semaphore
  docs: https://semaphoreui.com/install/docker/
  primary_service: semaphore-ui
  post_install: Sign in with the configured initial account and configure an inventory and a project repository.
    Back up the database and configuration.
  license: MIT
  architectures:
  - amd64
  - arm64
  web:
    port: 3000
  options:
    ADMIN:
      label: Admin username
      help: Initial account username.
    EMAIL:
      label: Admin email
      help: Initial account email address.
    PASSWORD:
      label: Admin password
      help: Strong initial password.
      type: password
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 3000 inside Nex.
    DATA:
      label: SQLite database
      help: Managed directory mounted at /var/lib/semaphore. Choose storage writable by the application.
    CONFIG:
      label: Configuration
      help: Managed directory mounted at /etc/semaphore. Choose storage writable by the application.
services:
  semaphore-ui:
    image: docker.io/semaphoreui/semaphore:latest
    ports:
    - ${PORT:-20219}:3000/tcp
    volumes:
    - ${DATA}:/var/lib/semaphore
    - ${CONFIG}:/etc/semaphore
    environment:
      SEMAPHORE_DB_DIALECT: sqlite
      SEMAPHORE_DB: /var/lib/semaphore/database.sqlite
      SEMAPHORE_ADMIN: ${ADMIN:-admin}
      SEMAPHORE_ADMIN_NAME: Administrator
      SEMAPHORE_ADMIN_EMAIL: ${EMAIL}
      SEMAPHORE_ADMIN_PASSWORD: ${PASSWORD}
    deploy:
      replicas: 1
