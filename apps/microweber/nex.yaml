# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Microweber
  summary: Create content and storefront pages in a browser
  description: Finish installation on a trusted network and connect the prepared database. Configure
    HTTPS and create your own administrator before publishing.
  category: documents
  website: https://github.com/microweber/microweber
  source: https://github.com/microweber/microweber
  docs: https://github.com/microweber/docker
  primary_service: microweber
  scalable: false
  license: MIT
  architectures:
  - amd64
  web:
    port: 80
  options:
    DATA:
      label: Website files and configuration
      help: Keep website files and configuration in this managed folder between restarts.
    PORT:
      label: Web port
      help: Host-published TCP port. With a dedicated Primary network and host publishing off, use the
        application address on port 80.
services:
  microweber:
    image: docker.io/microweber/microweber:latest
    volumes:
    - ${DATA}:/var/www/html
    ports:
    - ${PORT:-80}:80/tcp
    deploy:
      replicas: 1
