# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: HA-Fusion
  summary: Build a dashboard for Home Assistant
  description: Connect an existing Home Assistant installation. The data folder holds dashboards and settings.
  category: home-automation
  website: https://github.com/matt8707/ha-fusion
  source: https://github.com/matt8707/ha-fusion
  docs: https://github.com/matt8707/ha-fusion
  primary_service: ha-fusion
  post_install: Use the dashboard address on a trusted network. Enter your Home Assistant access details
    in the setup screen.
  license: MIT
  architectures:
  - amd64
  - arm64
  web:
    port: 5050
  options:
    HASS_URL:
      label: Home Assistant URL
      help: HTTP or HTTPS address of a reachable Home Assistant installation.
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 5050 inside Nex.
    DATA:
      label: Dashboards and settings
      help: Managed directory mounted at /app/data. Choose storage writable by the application.
services:
  ha-fusion:
    image: ghcr.io/matt8707/ha-fusion:latest
    ports:
    - ${PORT:-20183}:5050/tcp
    volumes:
    - ${DATA}:/app/data
    environment:
      HASS_URL: ${HASS_URL}
    deploy:
      replicas: 1
