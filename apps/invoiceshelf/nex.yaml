# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: InvoiceShelf
  summary: Create invoices, estimates and customer records
  description: Create a PostgreSQL database and complete the InvoiceShelf install wizard. Back up both invoices
    storage and the database.
  category: finance
  website: https://invoiceshelf.com/
  source: https://github.com/InvoiceShelf/InvoiceShelf
  docs: https://docs.invoiceshelf.com/installation/docker.html
  primary_service: invoiceshelf
  post_install: Create a PostgreSQL database and complete the InvoiceShelf install wizard. Back up both invoices
    storage and the database.
  license: AGPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 8080
  options:
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    DB_HOST:
      label: Db host
      help: Hostname or Nex connection name of the database service.
    DB_PORT:
      label: Db port
      help: Enter the deployment value described in the upstream setup guide.
    DB_NAME:
      label: Db name
      help: Enter the deployment value described in the upstream setup guide.
    DB_USER:
      label: Db user
      help: Enter the deployment value described in the upstream setup guide.
    DB_PASSWORD:
      label: Db password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    PORT:
      label: HTTP port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Invoices and file uploads
      help: Managed directory mounted at /var/www/html/storage.
services:
  invoiceshelf:
    image: docker.io/invoiceshelf/invoiceshelf:latest
    ports:
    - ${PORT:-8080}:8080/tcp
    volumes:
    - ${DATA}:/var/www/html/storage
    user: 0:0
    entrypoint:
    - /bin/sh
    - -ec
    - |
      mkdir -p /var/www/html/storage/app/templates/pdf /var/www/html/storage/fonts
      chown -R www-data:www-data /var/www/html/storage
      # nginx and php-fpm reopen their log streams as www-data, so those must be writable by it.
      chmod 666 /proc/self/fd/1 /proc/self/fd/2
      exec su -p www-data -s /bin/sh -c "exec docker-php-serversideup-entrypoint /init"
    environment:
      APP_NAME: InvoiceShelf
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: ${PUBLIC_URL}
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_NAME:-invoiceshelf}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: file
      SESSION_DRIVER: file
    deploy:
      replicas: 1
