x-nex:
  name: Alexandrie
  summary: Write and organize private notes through a connected workspace
  description: Prepare a MySQL database and S3-compatible bucket. Set your reachable frontend, backend
    and object URLs. Use TLS and configure origin policy before exposing the instance.
  category: productivity
  website: https://github.com/Smaug6739/Alexandrie
  source: https://github.com/Smaug6739/Alexandrie
  docs: https://github.com/Smaug6739/Alexandrie
  primary_service: alexandrie
  scalable: false
  license: MIT
  web:
    port: 8200
  options:
    FRONTEND_URL:
      label: Public frontend URL
      help: Full browser-facing HTTPS URL for the workspace.
    BACKEND_URL:
      label: Public API URL
      help: Full browser-facing HTTPS URL for the backend.
    S3_URL:
      label: Public object-store URL
      help: Browser-reachable endpoint for attachments.
    API_PORT:
      label: Backend publication port
      help: Host port for the browser-facing API reverse proxy upstream.
    JWT_SECRET:
      label: JWT signing secret
      type: password
      help: Use Nex Generate and retain the key for restore.
    DB_HOST:
      label: MySQL hostname
      help: Reachable MySQL service.
    DB_NAME:
      label: Database name
      help: Prepared notes database.
    DB_USER:
      label: Database username
      help: Dedicated database user.
    DB_PASSWORD:
      label: Database password
      type: password
      help: Password for the configured database user.
    S3_ENDPOINT:
      label: Internal object-store address
      help: Reachable endpoint including port, without a scheme.
    S3_KEY:
      label: Object-store access key
      help: Access key ID with access to the alexandrie bucket.
    S3_SECRET:
      label: Object-store secret
      type: password
      help: Secret for the selected object-store access key.
    PORT:
      label: Web port
      help: Host-published TCP port. With a dedicated Primary network and host publishing off, use the
        application address on port 8200.
services:
  alexandrie:
    image: ghcr.io/smaug6739/alexandrie-frontend:latest
    environment:
      PORT: '8200'
      NUXT_PUBLIC_BASE_API: ${BACKEND_URL}
      NUXT_PUBLIC_BASE_CDN: ${S3_URL}
      NUXT_PUBLIC_BASE_URL: ${FRONTEND_URL}
      NUXT_PUBLIC_CDN_ENDPOINT: /alexandrie/
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      S3_URL: ${S3_URL}
    ports:
    - ${PORT:-8200}:8200/tcp
    deploy:
      replicas: 1
  backend:
    image: ghcr.io/smaug6739/alexandrie-backend:latest
    ports:
    - ${API_PORT:-8201}:8201/tcp
    environment:
      BACKEND_PORT: '8201'
      GIN_MODE: release
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_HOST: ${DB_HOST}
      DATABASE_PORT: '3306'
      DATABASE_NAME: ${DB_NAME}
      DATABASE_USER: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      MINIO_ENDPOINT: ${S3_ENDPOINT}
      MINIO_PUBLIC_URL: ${S3_URL}
      MINIO_SECURE: 'true'
      MINIO_ACCESSKEY: ${S3_KEY}
      MINIO_SECRETKEY: ${S3_SECRET}
      MINIO_BUCKET: alexandrie
    deploy:
      replicas: 1
