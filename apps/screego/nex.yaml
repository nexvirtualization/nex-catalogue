# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Screego
  summary: Share a screen in a private browser room
  description: Configure an external TURN relay and create the authorized users file in Configuration with
    screego hash. Use HTTPS with WebSocket support and verify sharing across different networks.
  category: communication
  website: https://screego.net
  source: https://github.com/screego/server
  docs: https://github.com/screego/server/blob/v1.12.6/screego.config.example
  primary_service: screego
  post_install: Configure an external TURN relay and create the authorized users file in Configuration with
    screego hash. Use HTTPS with WebSocket support and verify sharing across different networks.
  license: GPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 5050
  options:
    EXTERNAL_IP:
      label: External ip
      help: Enter the deployment value described in the upstream setup guide.
    SIGNING_SECRET:
      label: Signing secret
      help: Use the credential or secret required by the upstream configuration.
      type: password
    TURN_HOST:
      label: Turn host
      help: Enter the deployment value described in the upstream setup guide.
    TURN_PORT:
      label: Turn port
      help: Enter the deployment value described in the upstream setup guide.
    TURN_SECRET:
      label: Turn secret
      help: Use the credential or secret required by the upstream configuration.
      type: password
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 5050 inside Nex.
    CONFIG:
      label: Prepared Screego users file
      help: Managed directory mounted at /configuration. Choose storage readable by the application.
services:
  screego:
    image: docker.io/screego/server:1.12.6
    ports:
    - ${PORT:-23576}:5050/tcp
    volumes:
    - ${CONFIG}:/configuration:ro
    environment:
      SCREEGO_EXTERNAL_IP: ${EXTERNAL_IP}
      SCREEGO_SECRET: ${SIGNING_SECRET}
      SCREEGO_AUTH_MODE: all
      SCREEGO_USERS_FILE: /configuration/users
      SCREEGO_TURN_EXTERNAL_IP: ${TURN_HOST}
      SCREEGO_TURN_EXTERNAL_PORT: ${TURN_PORT:-3478}
      SCREEGO_TURN_EXTERNAL_SECRET: ${TURN_SECRET}
      SCREEGO_CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
    deploy:
      replicas: 1
