x-nex:
  name: Automatisch
  summary: Connect your services through configured workflows
  description: Prepare a PostgreSQL database and password-protected Redis-compatible queue. Route the
    browser through an HTTPS proxy and finish admin setup on a trusted network.
  category: productivity
  website: https://github.com/automatisch/automatisch
  source: https://github.com/automatisch/automatisch
  docs: https://automatisch.io/docs/installation/docker
  primary_service: automatisch
  scalable: false
  license: AGPL-3.0
  web:
    port: 3000
  options:
    HOST:
      label: Public hostname
      help: Hostname or hostname and port, without a scheme.
    POSTGRES_HOST:
      label: Database hostname
      help: Reachable PostgreSQL hostname.
    POSTGRES_DATABASE:
      label: Database name
      help: Name of the prepared database.
    POSTGRES_USERNAME:
      label: Database username
      help: User allowed to use this database.
    POSTGRES_PASSWORD:
      label: Database password
      type: password
      help: Password of that PostgreSQL account.
    REDIS_HOST:
      label: Queue broker hostname
      help: Reachable Redis-compatible hostname.
    REDIS_PASSWORD:
      label: Queue broker password
      type: password
      help: Password of the Redis-compatible broker.
    ENCRYPTION_KEY:
      label: Application signing secret
      type: password
      help: Use Nex Generate and preserve this secret across upgrades and restores.
    WEBHOOK_SECRET_KEY:
      label: Application signing secret
      type: password
      help: Use Nex Generate and preserve this secret across upgrades and restores.
    APP_SECRET_KEY:
      label: Application signing secret
      type: password
      help: Use Nex Generate and preserve this secret across upgrades and restores.
    PUBLIC_URL:
      label: Public HTTPS URL
      help: Full browser-facing HTTPS URL, including the port if nonstandard.
    STORAGE:
      label: Workflow application files
      help: Keep workflow application files in this managed folder between restarts.
    PORT:
      label: Web port
      help: Host-published TCP port. With a dedicated Primary network and host publishing off, use the
        application address on port 3000.
services:
  automatisch:
    image: docker.io/automatischio/automatisch:latest
    environment:
      PROTOCOL: https
      PORT: '3000'
      APP_ENV: production
      API_URL: ${PUBLIC_URL}
      WEB_APP_URL: ${PUBLIC_URL}
      HOST: ${HOST}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
    volumes:
    - ${STORAGE}:/automatisch/storage
    ports:
    - ${PORT:-3000}:3000/tcp
    deploy:
      replicas: 1
  worker:
    image: docker.io/automatischio/automatisch:latest
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      APP_ENV: production
      WORKER: 'true'
    volumes:
    - ${STORAGE}:/automatisch/storage
    deploy:
      replicas: 1
