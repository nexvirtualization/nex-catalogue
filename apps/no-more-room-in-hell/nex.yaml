# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: No More Room in Hell
  summary: Host objective-based zombie co-op
  description: >-
    Keep the game folders on This host and choose a registered primary network that players can reach.
    Join from the in-game console with connect APP-IP:27015. The stock install serves direct connections.
    A Steam game server login token is needed for public listing. First boot downloads the server through
    SteamCMD. Restarts check for updates. Make a stopped backup before applying game updates.
  category: games
  website: https://store.steampowered.com/app/224260/
  source: https://github.com/GameServerManagers/docker-gameserver
  docs: https://linuxgsm.com/servers/nmrihserver/
  license: Proprietary game server
  architectures:
    - amd64
  tags:
    - steam
    - multiplayer
  options:
    DATA:
      label: Server data
      help: Choose This host and include this folder in stopped backups.
services:
  no-more-room-in-hell:
    image: ghcr.io/gameservermanagers/gameserver:nmrih
    environment:
      UPDATE_CHECK: '0'
      UPDATE_ON_START: 'true'
    expose:
      - 27015/udp
    volumes:
      - ${DATA}:/data
    healthcheck:
      start_period: 25m
    stop_grace_period: 90s
    deploy:
      replicas: 1
