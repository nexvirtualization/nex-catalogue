x-nex:
  name: Squidex
  summary: Headless CMS, based on MongoDB, CQRS and Event Sourcing
  description: Headless CMS, based on MongoDB, CQRS and Event Sourcing.
  category: development
  source: https://github.com/Squidex/squidex
  website: https://squidex.io
  docs: https://docs.squidex.io/id-01-getting-started/installation/platforms/install-on-docker
  primary_service: squidex
  options:
    PUBLIC_URL:
      label: Public url
    MONGODB_URL:
      label: Mongodb url
    ADMIN_EMAIL:
      label: Admin email
    ADMIN_PASSWORD:
      label: Admin password
      type: password
      generate: {format: password, length: 24, min_length: 8}
      help: Use Generate, which makes 24 characters with upper- and lower-case letters, a digit and a symbol,
        as Squidex requires. If Generate gives letters and digits only (older Nex), add a symbol such as ! to
        the end. A password you type needs at least 8 characters with all four kinds. Keep it with the
        application backups.
    ASSETS:
      label: Assets folder
      help: Choose the Nex-managed folder mounted at /app/Assets.
    PORT:
      label: Port 80/tcp
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
  post_install: Provision MongoDB and set the exact public base URL. Access the application through matching
    HTTPS when used remotely. Back up the assets and database together.
  web:
    port: 80
services:
  squidex:
    image: docker.io/squidex/squidex:latest
    deploy:
      replicas: 1
    environment:
      URLS__BASEURL: ${PUBLIC_URL}
      EVENTSTORE__MONGODB__CONFIGURATION: ${MONGODB_URL}
      STORE__MONGODB__CONFIGURATION: ${MONGODB_URL}
      IDENTITY__ADMINEMAIL: ${ADMIN_EMAIL}
      IDENTITY__ADMINPASSWORD: ${ADMIN_PASSWORD}
    volumes:
    - ${ASSETS}:/app/Assets
    ports:
    - ${PORT:-80}:80/tcp
