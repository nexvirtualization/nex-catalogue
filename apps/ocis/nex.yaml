# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: ownCloud Infinite Scale
  summary: Run ownCloud Infinite Scale file collaboration
  description: Set up an HTTPS proxy and use a browser address reachable from the service. Sign in with the
    initial administrator password.
  category: management
  website: https://doc.owncloud.com/ocis/next/
  source: https://github.com/owncloud/ocis
  docs: https://doc.owncloud.com/ocis/next/deployment/general/general-info.html
  primary_service: ocis
  post_install: Set up an HTTPS proxy and use a browser address reachable from the service. Sign in with
    the initial administrator password.
  license: Apache-2.0
  architectures:
  - amd64
  - arm64
  web:
    port: 9200
  options:
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    ADMIN_PASSWORD:
      label: Admin password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 9200 inside Nex.
    DATA:
      label: Files and accounts
      help: Managed directory mounted at /var/lib/ocis. Choose storage writable by the application.
    CONFIG:
      label: Service configuration
      help: Managed directory mounted at /etc/ocis. Choose storage writable by the application.
services:
  ocis:
    image: docker.io/owncloud/ocis:latest
    ports:
    - ${PORT:-23517}:9200/tcp
    volumes:
    - ${DATA}:/var/lib/ocis
    - ${CONFIG}:/etc/ocis
    environment:
      OCIS_URL: ${PUBLIC_URL}
      PROXY_HTTP_ADDR: 0.0.0.0:9200
      PROXY_TLS: 'false'
      IDM_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - if [ ! -s /etc/ocis/ocis.yaml ]; then ocis init; fi; exec ocis server
    deploy:
      replicas: 1
