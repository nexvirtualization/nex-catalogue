x-nex:
  name: ownCloud Infinite Scale
  summary: Run ownCloud Infinite Scale file collaboration
  description: Set up an HTTPS proxy and use a browser address reachable from the service. Sign in as admin
    with the initial administrator password. The first start creates the configuration with oCIS's insecure
    option, which turns off certificate checks on connections between oCIS's own services and to the public
    address (so a self-signed proxy certificate works); it does not turn off TLS or sign-in on the listener.
    To keep certificate checks, set insecure entries to false in ocis.yaml in Service configuration.
  category: management
  website: https://doc.owncloud.com/ocis/next/
  source: https://github.com/owncloud/ocis
  docs: https://doc.owncloud.com/ocis/next/deployment/general/general-info.html
  primary_service: ocis
  post_install: Set up an HTTPS proxy and use a browser address reachable from the service. Sign in with
    the initial administrator password.
  license: Apache-2.0
  architectures:
  - amd64
  - arm64
  web:
    port: 9200
  options:
    PUBLIC_URL:
      label: Public URL
      help: Full browser-facing address, which must start with https:// (oCIS refuses to start with http://)
        and include any nonstandard port, for example https://files.example.com. Terminate HTTPS in a
        reverse proxy in front of this app. Leave empty for https://localhost:9200.
    ADMIN_PASSWORD:
      label: Admin password
      help: Password for the admin account. Use Generate and keep it; it is applied when the configuration is
        first created.
      type: password
    PORT:
      label: HTTP port
      help: The app listens on TCP port 9200 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Files and accounts
      help: Managed directory mounted at /var/lib/ocis. Choose storage writable by the application.
    CONFIG:
      label: Service configuration
      help: Managed directory mounted at /etc/ocis. Choose storage writable by the application.
services:
  ocis:
    image: docker.io/owncloud/ocis:latest
    ports:
    - ${PORT:-9200}:9200/tcp
    volumes:
    - ${DATA}:/var/lib/ocis
    - ${CONFIG}:/etc/ocis
    environment:
      OCIS_URL: ${PUBLIC_URL:-https://localhost:9200}
      PROXY_HTTP_ADDR: 0.0.0.0:9200
      PROXY_TLS: 'false'
      IDM_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - if [ ! -s /etc/ocis/ocis.yaml ]; then ocis init --insecure yes; fi; exec ocis server
    deploy:
      replicas: 1
