x-nex:
  name: solidtime
  summary: Track project time, clients and billable work
  description: Provision PostgreSQL and configure your HTTPS endpoint. Complete the first-account flow
    on a trusted network.
  category: productivity
  website: https://github.com/solidtime-io/solidtime
  source: https://github.com/solidtime-io/solidtime
  docs: https://docs.solidtime.io/self-hosting
  primary_service: solidtime
  scalable: false
  license: AGPL-3.0
  web:
    port: 8000
  options:
    DB_HOST:
      label: Database hostname
      help: Reachable PostgreSQL server.
    DB_DATABASE:
      label: Database name
      help: Prepared database.
    DB_USERNAME:
      label: Database username
      help: Dedicated database account.
    DB_PASSWORD:
      label: Database password
      type: password
      help: Database account password.
    APP_KEY:
      label: Laravel application key
      type: password
      generate: {format: base64, bytes: 32, prefix: 'base64:'}
      help: 'Use Generate, which makes base64: followed by 32 random bytes in Base64. If Generate gives
        letters and digits only (older Nex), paste the output of echo base64:$(openssl rand -base64 32)
        instead. Preserve this key for restore.'
    PUBLIC_URL:
      label: Public web address
      help: Full browser-facing URL, including scheme and any port.
    DATA:
      label: Application files
      help: Select This host. Holds uploads, logs and the generated API signing keys. Include this folder
        in a stopped Nex backup.
    PORT:
      label: Web port
      help: The app listens on TCP port 8000 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  solidtime:
    image: docker.io/solidtime/solidtime:latest
    environment:
      DB_CONNECTION: pgsql
      DB_PORT: '5432'
      APP_ENV: production
      DB_HOST: ${DB_HOST}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_KEY: ${APP_KEY}
      APP_URL: ${PUBLIC_URL}
      AUTO_DB_MIGRATE: 'true'
    user: 0:0
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - |
      cd /var/www/html
      mkdir -p storage/app/public storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
      chown -R laravel:laravel storage
      chmod a+w /dev/stdout /dev/stderr || true
      app() { setpriv --reuid=laravel --regid=laravel --init-groups "$$@"; }
      [ -f storage/oauth-private.key ] || app php artisan passport:keys
      exec setpriv --reuid=laravel --regid=laravel --init-groups start-container
    volumes:
    - ${DATA}:/var/www/html/storage
    ports:
    - ${PORT:-8000}:8000/tcp
    deploy:
      replicas: 1
