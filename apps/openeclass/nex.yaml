# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Open eClass
  summary: Host online classes, course material and assignments
  description: Prepare a supported MariaDB database and use the initial installer on a trusted network.
    Review account registration before opening course access.
  category: productivity
  website: https://github.com/gunet/openeclass
  source: https://github.com/gunet/openeclass
  docs: https://www.openeclass.org/
  primary_service: openeclass
  scalable: false
  license: GPL-2.0
  architectures:
  - amd64
  web:
    port: 80
  options:
    DATA:
      label: Course files and configuration
      help: Keep course files and configuration in this managed folder between restarts.
    PORT:
      label: Web port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  openeclass:
    image: docker.io/gunet/openeclass:latest
    volumes:
    - ${DATA}:/var/www/html
    ports:
    - ${PORT:-80}:80/tcp
    deploy:
      replicas: 1
