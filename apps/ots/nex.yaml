# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: OTS
  summary: Create encrypted single-use secret links
  description: Use a trusted HTTPS reverse proxy before creating links. Point the package at an existing
    private Valkey or Redis service. The database stores the encrypted payload until it is viewed or expires.
  category: security
  website: https://ots.fyi/
  source: https://github.com/Luzifer/ots
  docs: https://github.com/Luzifer/ots#readme
  scalable: false
  primary_service: ots
  architectures:
  - amd64
  - arm64
  web:
    service: ots
    scheme: http
    port: 3000
  works_with:
  - valkey
  options:
    CACHE_URL:
      label: Valkey or Redis URL
      help: Full redis:// URI of the private backend, with a password if required.
      type: password
    PORT:
      label: Web port
      help: Host-published HTTP port when publishing is enabled. With a dedicated Primary network, use
        the application address on port 3000.
services:
  ots:
    image: ghcr.io/luzifer/ots:latest
    environment:
      REDIS_URL: ${CACHE_URL}
      STORAGE_TYPE: redis
      SECRET_EXPIRY: '604800'
    ports:
    - ${PORT:-8387}:3000/tcp
    deploy:
      replicas: 1
