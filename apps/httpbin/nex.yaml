# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: httpbin
  summary: Test HTTP client requests and responses
  description: The Python Software Foundation maintains this continuation of the original httpbin project. Use
    its endpoints to test requests, redirects, cookies, headers and response behaviour.
  category: development
  website: https://github.com/psf/httpbin
  source: https://github.com/psf/httpbin
  docs: https://github.com/psf/httpbin#docker
  license: ISC OR MIT
  primary_service: httpbin
  architectures:
  - amd64
  - arm64
  post_install: Open the endpoint reference in a browser, or send a test request to /get. Keep the service on
    a trusted network.
  web:
    port: 8080
  scale:
  - httpbin
  options:
    PORT:
      label: HTTP port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  httpbin:
    image: ghcr.io/psf/httpbin:latest
    # Gunicorn cannot start the image's gevent worker with its bundled dependencies.
    command: [/opt/httpbin/bin/gunicorn, --bind, '0.0.0.0:8080', --worker-class, gthread, 'httpbin:app']
    ports:
    - ${PORT:-8080}:8080/tcp
    deploy:
      replicas: 1
