# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: AdGuard Home
  summary: Filter ads and trackers through your own DNS server
  description: DNS filtering for your LAN. In Install, Network choose Primary network, a registered cluster VLAN
    reachable by your clients, then Fixed with an unused address/prefix and Default gateway. After Install open
    http://APP-IP:3000, create the administrator, choose all DNS interfaces and web port 80; then use
    http://APP-IP/ for administration. Point router/client DNS to APP-IP on port 53, both TCP and UDP. The
    shared-network default alone cannot serve LAN DNS. DHCP and encrypted DNS are not configured. On Basics
    choose Runs on, Only these hosts and one host; keep state folders on This host. This keeps one copy on that
    host with no automatic failover. Use ACTIONS, Back up now with the stopped-copy option and select all state
    folders before updates.
  category: networking
  website: https://adguard.com/en/adguard-home/overview.html
  source: https://github.com/AdguardTeam/AdGuardHome
  license: GPL-3.0
  scalable: false
  tags:
  - dns
  - ad-blocking
  - privacy
  options:
    SETUP_PORT:
      label: Initial setup port
      help: The app listens on TCP port 3000 on its default Docker network. Nex does not publish it on host
        addresses.
    PORT:
      label: Web port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses. Configure LAN DNS clients to use APP-IP:53.
    WORK:
      label: DNS data
      help: Keep DNS data on This host. Nex creates /opt/adguardhome/work as persistent storage; no host folder
        setup is needed. Include this folder and Configuration together in a stopped Nex backup.
    CONFIG:
      label: Configuration
      help: Keep Configuration on This host. Nex creates /opt/adguardhome/conf; the wizard writes AdGuardHome.yaml
        and credentials. Include it with DNS data in a stopped Nex backup.
services:
  adguard-home:
    image: adguard/adguardhome:latest
    ports:
    - ${SETUP_PORT:-3000}:3000/tcp
    - ${PORT:-80}:80/tcp
    expose:
    - 53/tcp
    - 53/udp
    volumes:
    - ${WORK}:/opt/adguardhome/work
    - ${CONFIG}:/opt/adguardhome/conf
    deploy:
      replicas: 1
