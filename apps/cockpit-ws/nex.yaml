x-nex:
  name: Cockpit WS
  summary: Administer Linux systems through an SSH-backed web console
  description: This standalone Web Service connects to remote systems over SSH. It does not mount the Nex
    host filesystem or management sockets.
  category: management
  website: https://cockpit-project.org/
  source: https://github.com/cockpit-project/cockpit
  docs: https://cockpit-project.org/faq
  primary_service: cockpit-ws
  post_install: Open the HTTPS endpoint and use Connect To for a Linux host you administer. The remote Linux
    system must permit SSH and have cockpit-bridge available.
  license: GNU Lesser General Public License v2.1
  architectures:
  - amd64
  - arm64
  web:
    port: 9090
    scheme: https
  options:
    PORT:
      label: HTTP port
      help: The app listens on TCP port 9090 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  cockpit-ws:
    image: quay.io/cockpit/ws:latest
    ports:
    - ${PORT:-9090}:9090/tcp
    healthcheck:
      test:
      - CMD
      - /usr/bin/python3
      - -c
      - |
        import ssl
        import urllib.request
        from pathlib import Path

        certs = Path("/etc/cockpit/ws-certs.d")
        ca = certs / "0-self-signed-ca.pem"
        if not ca.is_file():
            ca = certs / "0-self-signed.cert"
        context = ssl.create_default_context(cafile=ca)
        with urllib.request.urlopen("https://localhost:9090/ping", context=context, timeout=3):
            pass
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
