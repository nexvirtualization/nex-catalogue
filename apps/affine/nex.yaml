x-nex:
  name: AFFiNE Community Edition
  summary: Collaborate in a workspace with pages and whiteboards
  description: Provision PostgreSQL and Redis, and run the upstream schema migration for this release before
    starting. Use HTTPS and back up workspace storage and the database.
  category: productivity
  website: https://affine.pro/
  source: https://github.com/toeverything/AFFiNE
  docs: https://docs.affine.pro/self-host-affine/install/docker-compose
  primary_service: affine
  post_install: Provision PostgreSQL and Redis, and run the upstream schema migration for this release before
    starting. Use HTTPS and back up workspace storage and the database.
  architectures:
  - amd64
  - arm64
  web:
    port: 3010
  options:
    DATABASE_URL:
      label: Database url
      help: Connection URL for the database. Percent-encode special characters in credentials.
      type: password
    REDIS_HOST:
      label: Redis host
      help: Enter the deployment value described in the upstream setup guide.
    REDIS_PORT:
      label: Redis port
      help: Enter the deployment value described in the upstream setup guide.
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 3010 inside Nex.
    DATA:
      label: Workspace attachments
      help: Managed directory mounted at /root/.affine/storage. Choose storage writable by the application.
    CONFIG:
      label: AFFiNE configuration
      help: Managed directory mounted at /root/.affine/config. Choose storage writable by the application.
services:
  affine:
    image: ghcr.io/toeverything/affine:stable
    ports:
    - ${PORT:-23575}:3010/tcp
    volumes:
    - ${DATA}:/root/.affine/storage
    - ${CONFIG}:/root/.affine/config
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_SERVER_HOST: ${REDIS_HOST}
      REDIS_SERVER_PORT: ${REDIS_PORT:-6379}
      AFFINE_SERVER_EXTERNAL_URL: ${PUBLIC_URL}
      AFFINE_SERVER_HTTPS: 'true'
    deploy:
      replicas: 1
