x-nex:
  name: PiGallery 2
  summary: Directory-first photo gallery website, with a rich UI, optimised for running on low resource servers
  description: Directory-first photo gallery website, with a rich UI, optimised for running on low resource
    servers.
  category: media
  source: https://github.com/bpatrik/pigallery2
  website: https://bpatrik.github.io/pigallery2/
  docs: https://bpatrik.github.io/pigallery2/
  primary_service: pigallery2
  options:
    CONFIG:
      label: Config folder
      help: Choose the Nex-managed folder mounted at /app/data/config.
    DB:
      label: Db folder
      help: Choose the Nex-managed folder mounted at /app/data/db.
    IMAGES:
      label: Images folder
      help: Choose the Nex-managed folder mounted at /app/data/images.
    THUMBNAILS:
      label: Thumbnails folder
      help: Choose the Nex-managed folder mounted at /app/data/tmp.
    PORT:
      label: Port 80/tcp
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
  post_install: Configure the images folder as a Nex share and change the initial administrator password. Back
    up the Config and database folders together.
  web:
    port: 80
services:
  pigallery2:
    image: docker.io/bpatrik/pigallery2:latest
    deploy:
      replicas: 1
    environment:
      NODE_ENV: production
    volumes:
    - ${CONFIG}:/app/data/config
    - ${DB}:/app/data/db
    - ${IMAGES}:/app/data/images:ro
    - ${THUMBNAILS}:/app/data/tmp
    ports:
    - ${PORT:-80}:80/tcp
