# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Actual Budget
  summary: Plan your spending with envelope budgeting
  description: >-
    Personal budgeting with local-first accounts and server synchronization.
  category: finance
  website: https://actualbudget.org
  source: https://github.com/actualbudget/actual
  license: MIT
  scalable: false
  primary_service: actual
  tags: [budget, finance, household]
  web:
    port: 5006
    scheme: http
  post_install: >-
    The address reported by Nex is the HTTP backend. For browser access from another device,
    use a reverse proxy with a browser-trusted HTTPS certificate and preserve Actual's
    cross-origin isolation headers. From the Applications network, forward to port 5006
    on the Name inside applications. From outside that network, use the reachable HTTP
    address reported by Nex.
  first_sign_in: >-
    Open the proxy's HTTPS URL and set the server password before sharing access.
  options:
    PORT:
      label: Web port
      help: The app listens on TCP port 5006 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Budgets and server settings
      help: Persistent budget files and server database at /data. Prefer This host for SQLite and back up this folder as well as exporting budgets regularly.
services:
  actual:
    image: ghcr.io/actualbudget/actual:latest
    ports:
      - "${PORT:-5006}:5006/tcp"
    volumes:
      - "${DATA}:/data"
    deploy:
      replicas: 1
