# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: SIPCAPTURE Homer
  summary: Collect and search HEP signaling data from your own voice infrastructure
  description: Check the logs for the initial Homer administrator credentials and change the password
    in the web interface. Send HEP traffic from your authorized voice infrastructure using the UDP ingest
    endpoint.
  category: monitoring
  website: https://github.com/sipcapture/homer
  source: https://github.com/sipcapture/homer
  docs: https://sipcapture.github.io/homer/
  primary_service: sipcapture-homer
  scalable: false
  license: AGPL-3.0
  web:
    port: 8080
  options:
    DATA:
      label: Homer data lake
      help: Capture data, local catalogue, accounts and configuration.
    PORT:
      label: Web port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
    HEP_PORT:
      label: HEP UDP ingest port
      help: The app listens on UDP port 9060 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  sipcapture-homer:
    image: ghcr.io/sipcapture/homer:latest
    command:
    - |
      if [ ! -s /data/homer/homer.json ]; then
        /homer wizard --profile all-in-one --output /data/homer/homer.json
      fi
      if [ ! -w /var/lib/homer ] &&
         [ "$$(/homer config show --config-path /data/homer/homer.json \
           --section coordinator.settings_db_path)" = '"/var/lib/homer/homer_settings.duckdb"' ]; then
        export HOMER_COORDINATOR_SETTINGS_DB_PATH=/data/homer/homer_settings.duckdb
      fi
      exec /homer --config-path /data/homer/homer.json
    entrypoint:
    - /bin/sh
    - -ec
    volumes:
    - ${DATA}:/data/homer
    ports:
    - ${PORT:-8080}:8080/tcp
    - ${HEP_PORT:-9060}:9060/udp
    deploy:
      replicas: 1
