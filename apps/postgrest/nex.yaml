x-nex:
  name: PostgREST
  summary: Turns tables, views, and functions in an existing PostgreSQL database into a REST API
  description: Turns tables, views, and functions in an existing PostgreSQL database into a REST API.
  category: development
  source: https://github.com/PostgREST/postgrest
  website: https://postgrest.org/
  docs: https://docs.postgrest.org/en/stable/references/configuration.html
  primary_service: postgrest
  options:
    DATABASE_URL:
      label: Database url
      type: password
      help: A PostgreSQL URI with the authenticator role and the database name.
    DB_SCHEMAS:
      label: Db schemas
    ANON_ROLE:
      label: Anon role
    JWT_SECRET:
      label: Jwt secret
      type: password
      generate: {format: alnum, length: 32, min_length: 32}
      help: Use Generate, which makes 32 letters and digits. It must be at least 32 characters. If Generate
        gives only 24 characters (older Nex), paste the output of openssl rand -hex 32 instead. Keep it with
        the application backups.
    PORT:
      label: Port 3000/tcp
      help: The app listens on TCP port 3000 on its default Docker network. Nex does not publish it on host
        addresses.
  post_install: Provision PostgreSQL roles and grants in advance. Include the database role password in the
    connection URI and use a JWT signing secret of at least 32 characters.
services:
  postgrest:
    image: docker.io/postgrest/postgrest:latest
    deploy:
      replicas: 1
    environment:
      PGRST_DB_URI: ${DATABASE_URL}
      PGRST_DB_SCHEMAS: ${DB_SCHEMAS:-public}
      PGRST_DB_ANON_ROLE: ${ANON_ROLE}
      PGRST_JWT_SECRET: ${JWT_SECRET}
    ports:
    - ${PORT:-3000}:3000/tcp
