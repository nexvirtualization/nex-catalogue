# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Nightingale
  summary: Host a private multiplayer Realm
  description: >-
    Keep the game folders on This host and choose a registered primary network that players can reach.
    Use a player-reachable private network and add the app’s Primary address on UDP 7777. To change
    the Realm password, copy ExampleServerSettings.ini to NWX/Config/ServerSettings.ini in the managed
    folder, edit it, and restart. The first boot downloads the dedicated server and subsequent starts
    check for updates. Make a stopped backup before applying game updates.
  category: games
  website: https://store.steampowered.com/app/1928980/
  source: https://github.com/Ekman/Nightingale-Docker
  docs: https://github.com/Ekman/Nightingale-Docker#readme
  license: Proprietary game server
  architectures:
    - amd64
  tags:
    - multiplayer
  options:
    DATA:
      label: Server data
      help: Choose This host and include this folder in stopped backups.
services:
  nightingale:
    image: ghcr.io/ekman/nightingale:1
    expose:
      - 7777/udp
    volumes:
      - ${DATA}:/home/steam/game
    stop_grace_period: 90s
    deploy:
      replicas: 1
