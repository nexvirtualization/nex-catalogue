# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Redis Insight
  summary: Inspect and manage Redis-compatible data from a browser
  description: Redis Insight connects to databases you configure and stores its connection list in a managed
    directory.
  category: development
  website: https://redis.io/insight/
  source: https://github.com/redis/RedisInsight
  docs: https://redis.io/docs/latest/operate/redisinsight/install/install-on-docker/
  primary_service: redis-insight
  post_install: Protect the web interface with an authenticated HTTPS proxy. Create a connection using the
    Nex application DNS name and database credentials.
  license: SSPL-1.0
  architectures:
  - amd64
  - arm64
  web:
    port: 5540
  options:
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 5540 inside Nex.
    DATA:
      label: Redis Insight settings
      help: Managed directory mounted at /data. Choose storage writable by the application.
services:
  redis-insight:
    image: docker.io/redis/redisinsight:latest
    ports:
    - ${PORT:-20250}:5540/tcp
    volumes:
    - ${DATA}:/data
    deploy:
      replicas: 1
