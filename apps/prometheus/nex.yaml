# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Prometheus
  summary: Collect and query time-series metrics
  description: Prometheus reads a prepared scrape configuration and retains its local time-series database
    in Nex storage.
  category: monitoring
  website: https://prometheus.io/
  source: https://github.com/prometheus/prometheus
  docs: https://prometheus.io/docs/prometheus/latest/installation/#using-docker
  primary_service: prometheus
  post_install: Place prometheus.yml in Configuration with your scrape jobs. Select local storage for metrics,
    then open the expression browser on a trusted network.
  license: Apache-2.0
  architectures:
  - amd64
  - arm64
  web:
    port: 9090
  options:
    PORT:
      label: HTTP port
      help: The app listens on TCP port 9090 on its default Docker network. Nex does not publish it on host
        addresses.
    CONFIG:
      label: Prepared scrape configuration
      help: Managed directory mounted at /etc/prometheus. Choose storage readable by the application.
    DATA:
      label: Time-series storage
      help: Managed directory mounted at /prometheus. Choose storage writable by the application.
services:
  prometheus:
    image: docker.io/prom/prometheus:latest
    ports:
    - ${PORT:-9090}:9090/tcp
    volumes:
    - ${CONFIG}:/etc/prometheus:ro
    - ${DATA}:/prometheus
    deploy:
      replicas: 1
