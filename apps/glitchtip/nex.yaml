x-nex:
  name: GlitchTip
  summary: Capture application errors and manage issue alerts
  description: Provision PostgreSQL and an email relay. Run the upstream migrations before the first startup,
    then create the first organization.
  category: monitoring
  website: https://glitchtip.com
  source: https://gitlab.com/glitchtip/glitchtip
  docs: https://glitchtip.com/documentation/install/
  primary_service: glitchtip
  post_install: Provision PostgreSQL and an email relay. Run the upstream migrations before the first startup,
    then create the first organization.
  architectures:
  - amd64
  - arm64
  web:
    port: 8000
  options:
    DATABASE_URL:
      label: Database url
      help: Connection URL for the database. Percent-encode special characters in credentials.
      type: password
    SIGNING_SECRET:
      label: Signing secret
      help: Use the credential or secret required by the upstream configuration.
      type: password
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    SMTP_URL:
      label: Smtp url
      help: Enter the deployment value described in the upstream setup guide.
    FROM_EMAIL:
      label: From email
      help: Enter the deployment value described in the upstream setup guide.
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 8000 inside Nex.
    UPLOADS:
      label: Application uploads
      help: Managed directory mounted at /code/uploads. Choose storage writable by the application.
services:
  glitchtip:
    image: docker.io/glitchtip/glitchtip:latest
    ports:
    - ${PORT:-23520}:8000/tcp
    volumes:
    - ${UPLOADS}:/code/uploads
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SIGNING_SECRET}
      GLITCHTIP_DOMAIN: ${PUBLIC_URL}
      EMAIL_URL: ${SMTP_URL}
      DEFAULT_FROM_EMAIL: ${FROM_EMAIL}
    deploy:
      replicas: 1
