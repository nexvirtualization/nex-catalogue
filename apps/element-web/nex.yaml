# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Element Web
  summary: Chat on an existing Matrix homeserver
  description: Serve the Element web client for Matrix rooms and direct messages. An existing Matrix homeserver
    handles accounts, messages and room history.
  category: communication
  website: https://element.io
  source: https://github.com/element-hq/element-web
  docs: https://github.com/element-hq/element-web/blob/develop/docs/install.md#docker
  license: AGPL-3.0-or-later OR GPL-3.0-or-later
  primary_service: element-web
  architectures:
  - amd64
  - arm64
  post_install: Use HTTPS for encrypted Matrix features. At sign-in choose your existing homeserver. Back up
    your encryption keys and recovery details using Element.
  web:
    port: 8080
  scale:
  - element-web
  options:
    PORT:
      label: HTTP port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  element-web:
    image: ghcr.io/element-hq/element-web:latest
    ports:
    - ${PORT:-8080}:8080/tcp
    environment:
      ELEMENT_WEB_PORT: '8080'
    deploy:
      replicas: 1
