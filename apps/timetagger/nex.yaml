# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: TimeTagger
  summary: Record and review time with tags and reports
  description: Use a bcrypt password hash for the configured user. Protect this endpoint with HTTPS
    and preserve the SQLite data in a stopped backup.
  category: productivity
  website: https://github.com/almarklein/timetagger
  source: https://github.com/almarklein/timetagger
  docs: https://timetagger.app/articles/selfhost2/
  primary_service: timetagger
  scalable: false
  license: GPL-3.0
  web:
    port: 80
  options:
    CREDENTIALS:
      label: User and bcrypt hash
      type: password
      help: Enter username followed by a colon and a bcrypt password hash, as described in upstream
        self-hosting documentation.
    DATA:
      label: Time records
      help: Keep time records in this managed folder between restarts.
    PORT:
      label: Web port
      help: Host-published TCP port. With a dedicated Primary network and host publishing off, use the
        application address on port 80.
services:
  timetagger:
    image: ghcr.io/almarklein/timetagger:latest
    environment:
      TIMETAGGER_BIND: 0.0.0.0:80
      TIMETAGGER_DATADIR: /root/_timetagger
      TIMETAGGER_CREDENTIALS: ${CREDENTIALS}
    volumes:
    - ${DATA}:/root/_timetagger
    ports:
    - ${PORT:-80}:80/tcp
    deploy:
      replicas: 1
