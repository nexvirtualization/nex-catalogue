# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Zulip
  summary: Host persistent team chat organized into streams and topics
  description: Provision the supported PostgreSQL, RabbitMQ, Redis and Memcached services. Use an HTTPS
    reverse proxy and complete Zulip’s organization and SMTP setup before inviting users.
  category: communication
  website: https://github.com/zulip/zulip
  source: https://github.com/zulip/zulip
  docs: https://zulip.readthedocs.io/en/stable/production/install.html
  primary_service: zulip
  scalable: false
  license: Apache-2.0
  web:
    port: 80
  options:
    SETTING_EXTERNAL_HOST:
      label: Public Zulip hostname
      help: Hostname of the client-facing HTTPS address.
    SETTING_ZULIP_ADMINISTRATOR:
      label: Administrator email
      help: Email address for the initial organizer.
    SETTING_REMOTE_POSTGRES_HOST:
      label: Database hostname
      help: Reachable Zulip PostgreSQL service.
    SETTING_RABBITMQ_HOST:
      label: RabbitMQ hostname
      help: Reachable private RabbitMQ server.
    SETTING_REDIS_HOST:
      label: Redis hostname
      help: Reachable private Redis service.
    SETTING_MEMCACHED_LOCATION:
      label: Memcached address
      help: Reachable hostname and port.
    SECRETS_POSTGRES_PASSWORD:
      label: Database password
      type: password
      help: Supply the configured Zulip database password.
    SECRETS_RABBITMQ_PASSWORD:
      label: RabbitMQ password
      type: password
      help: Supply the configured Zulip RabbitMQ password.
    SECRETS_REDIS_PASSWORD:
      label: Redis password
      type: password
      help: Supply the configured Zulip Redis password.
    SECRETS_MEMCACHED_PASSWORD:
      label: Memcached password
      type: password
      help: Supply the configured Zulip Memcached password.
    SECRETS_SECRET_KEY:
      label: Application signing secret
      type: password
      help: Use Nex Generate and preserve this secret across upgrades and restores.
    DATA:
      label: Zulip uploads and configuration
      help: Keep zulip uploads and configuration in this managed folder between restarts.
    PORT:
      label: Web port
      help: Host-published TCP port. With a dedicated Primary network and host publishing off, use the
        application address on port 80.
services:
  zulip:
    image: ghcr.io/zulip/zulip-server:latest
    environment:
      CONFIG_application_server__http_only: 'true'
      SETTING_EXTERNAL_HOST: ${SETTING_EXTERNAL_HOST}
      SETTING_ZULIP_ADMINISTRATOR: ${SETTING_ZULIP_ADMINISTRATOR}
      SETTING_REMOTE_POSTGRES_HOST: ${SETTING_REMOTE_POSTGRES_HOST}
      SETTING_RABBITMQ_HOST: ${SETTING_RABBITMQ_HOST}
      SETTING_REDIS_HOST: ${SETTING_REDIS_HOST}
      SETTING_MEMCACHED_LOCATION: ${SETTING_MEMCACHED_LOCATION}
      SECRETS_postgres_password: ${SECRETS_POSTGRES_PASSWORD}
      SECRETS_rabbitmq_password: ${SECRETS_RABBITMQ_PASSWORD}
      SECRETS_redis_password: ${SECRETS_REDIS_PASSWORD}
      SECRETS_memcached_password: ${SECRETS_MEMCACHED_PASSWORD}
      SECRETS_secret_key: ${SECRETS_SECRET_KEY}
    volumes:
    - ${DATA}:/data
    ports:
    - ${PORT:-80}:80/tcp
    deploy:
      replicas: 1
