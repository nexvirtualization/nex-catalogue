# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Plausible Analytics
  summary: Collect privacy-focused website traffic statistics
  description: Provision PostgreSQL and ClickHouse at the upstream-supported versions. Create the first account
    and add the tracking script to your site after setup.
  category: monitoring
  website: https://plausible.io/
  source: https://github.com/plausible/analytics/
  docs: https://github.com/plausible/community-edition
  primary_service: plausible-analytics
  post_install: Provision PostgreSQL and ClickHouse at the upstream-supported versions. Create the first
    account and add the tracking script to your site after setup.
  license: AGPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 8000
  options:
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    SIGNING_SECRET:
      label: Signing secret
      help: Use the credential or secret required by the upstream configuration.
      type: password
    DATABASE_URL:
      label: Database url
      help: Connection URL for the database. Percent-encode special characters in credentials.
      type: password
    CLICKHOUSE_URL:
      label: Clickhouse url
      help: Enter the deployment value described in the upstream setup guide.
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 8000 inside Nex.
services:
  plausible-analytics:
    image: ghcr.io/plausible/community-edition:v3.2.1
    ports:
    - ${PORT:-23490}:8000/tcp
    environment:
      BASE_URL: ${PUBLIC_URL}
      SECRET_KEY_BASE: ${SIGNING_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      CLICKHOUSE_DATABASE_URL: ${CLICKHOUSE_URL}
    command:
    - sh
    - -c
    - /entrypoint.sh db createdb && /entrypoint.sh db migrate && exec /entrypoint.sh run
    deploy:
      replicas: 1
