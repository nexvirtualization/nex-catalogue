# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Teampass
  summary: Share team credentials with role-based access
  description: Before installing, provision a reachable MySQL or MariaDB database and a dedicated non-root
    account. Use the same database settings in the installer over trusted HTTPS and retain recovery
    information separately.
  category: security
  website: https://github.com/nilsteampassnet/TeamPass
  source: https://github.com/nilsteampassnet/TeamPass
  docs: https://github.com/nilsteampassnet/TeamPass/blob/master/docs/DOCKER.md
  primary_service: teampass
  scalable: false
  license: GPL-3.0
  architectures:
  - amd64
  web:
    port: 80
  options:
    DB_HOST:
      label: Database host
      help: Hostname or address reachable from Teampass.
    DB_PORT:
      label: Database port
      help: Leave empty for 3306.
    DB_NAME:
      label: Database name
      help: Name of the prepared database. Leave empty for teampass.
    DB_USER:
      label: Database user
      help: Dedicated account for the prepared database. Leave empty for teampass.
    DB_PASSWORD:
      label: Database password
      type: password
    DATA:
      label: Teampass files and configuration
      help: Keep teampass files and configuration in this managed folder between restarts.
    PORT:
      label: Web port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  teampass:
    image: ghcr.io/nilsteampassnet/teampass:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-teampass}
      DB_USER: ${DB_USER:-teampass}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
    - ${DATA}:/var/www/html
    ports:
    - ${PORT:-80}:80/tcp
    deploy:
      replicas: 1
