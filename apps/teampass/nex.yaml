# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Teampass
  summary: Share team credentials with role-based access
  description: Provision a reachable MySQL or MariaDB database before installation. Complete the installer
    through a trusted HTTPS endpoint and retain recovery information separately.
  category: security
  website: https://github.com/nilsteampassnet/TeamPass
  source: https://github.com/nilsteampassnet/TeamPass
  docs: https://github.com/nilsteampassnet/TeamPass/blob/master/docs/DOCKER.md
  primary_service: teampass
  scalable: false
  license: GPL-3.0
  architectures:
  - amd64
  web:
    port: 80
  options:
    DATA:
      label: Teampass files and configuration
      help: Keep teampass files and configuration in this managed folder between restarts.
    PORT:
      label: Web port
      help: Host-published TCP port. With a dedicated Primary network and host publishing off, use the
        application address on port 80.
services:
  teampass:
    image: ghcr.io/nilsteampassnet/teampass:latest
    volumes:
    - ${DATA}:/var/www/html
    ports:
    - ${PORT:-80}:80/tcp
    deploy:
      replicas: 1
