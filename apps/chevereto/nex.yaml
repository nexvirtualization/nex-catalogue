x-nex:
  name: Chevereto
  summary: Ultimate image sharing software
  description: Ultimate image sharing software. Create your very own personal image hosting website in just
    minutes.
  category: media
  source: https://github.com/chevereto/chevereto
  website: https://chevereto.com/
  docs: https://v4-docs.chevereto.com/guides/docker/
  primary_service: chevereto
  options:
    DB_HOST:
      label: Db host
    DB_PORT:
      label: Db port
    DB_USER:
      label: Db user
    DB_PASSWORD:
      label: Db password
      type: password
      help: Use a unique value and keep it with the application backups.
    DB_NAME:
      label: Db name
    PUBLIC_HOST:
      label: Public host
    IMAGES:
      label: Images folder
      help: Choose the Nex-managed folder mounted at /var/www/html/images.
    PORT:
      label: Published 80/tcp port
      help: Host port for application listener 80/tcp. Leave host publishing off to use only the assigned app
        address.
  post_install: Provision an empty MySQL database, configure the client-facing hostname, then complete the web
    installer. Chevereto edition and feature availability depend on its license.
  web:
    port: 80
services:
  chevereto:
    image: docker.io/chevereto/chevereto:4
    deploy:
      replicas: 1
    environment:
      CHEVERETO_DB_HOST: ${DB_HOST}
      CHEVERETO_DB_PORT: ${DB_PORT:-3306}
      CHEVERETO_DB_USER: ${DB_USER}
      CHEVERETO_DB_PASS: ${DB_PASSWORD}
      CHEVERETO_DB_NAME: ${DB_NAME:-chevereto}
      CHEVERETO_HOSTNAME: ${PUBLIC_HOST}
    volumes:
    - ${IMAGES}:/var/www/html/images
    ports:
    - ${PORT:-19516}:80/tcp
