# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Traccar
  summary: Track GPS devices and review location history
  description: Complete the initial web login and use TLS for browser access. This profile uses the bundled
    H2 database. Connect OsmAnd-compatible devices to TCP port 5055 on the dedicated application address.
    For other device protocols, use the upstream port list and a client-reachable Primary network.
  category: tools
  website: https://www.traccar.org/
  source: https://github.com/traccar/traccar
  docs: https://www.traccar.org/docker/
  scalable: false
  primary_service: traccar
  architectures:
  - amd64
  - arm64
  web:
    service: traccar
    scheme: http
    port: 8082
  options:
    PORT:
      label: Web port
      help: The app listens on TCP port 8082 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Device database
      help: Select This host. Stores locations, users and device state. Include this folder in a stopped
        Nex backup.
    CONFIG:
      label: Traccar configuration
      help: Select This host. Stores server settings. Include this folder in a stopped Nex backup.
    LOGS:
      label: Traccar logs
      help: Select This host. Stores diagnostics and protocol logs. Include this folder in a stopped Nex
        backup.
services:
  traccar:
    image: traccar/traccar:latest
    ports:
    - ${PORT:-8082}:8082/tcp
    expose:
    - 5055/tcp
    volumes:
    - ${DATA}:/opt/traccar/data
    - ${CONFIG}:/opt/traccar/conf
    - ${LOGS}:/opt/traccar/logs
    deploy:
      replicas: 1
