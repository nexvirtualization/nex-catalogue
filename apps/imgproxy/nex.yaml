# Deployment reference: https://github.com/imgproxy/imgproxy#readme
x-nex:
  name: imgproxy
  summary: Fast and secure standalone server for resizing and converting remote images
  category: media
  description: Fast and secure standalone server for resizing and converting remote images.
  source: https://github.com/imgproxy/imgproxy
  website: https://imgproxy.net/
  docs: https://docs.imgproxy.net/usage/signing_url
  primary_service: app
  options:
    PORT:
      label: TCP port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
    SIGNING_KEY:
      label: Hex signing key
      type: password
      generate: {format: hex, length: 64}
      help: Use Generate, which makes 64 hexadecimal characters. If Generate gives letters and digits only
        (older Nex), paste the output of openssl rand -hex 32 instead. Use a different value for the salt.
    SIGNING_SALT:
      label: Hex signing salt
      type: password
      generate: {format: hex, length: 64}
      help: Use Generate, which makes 64 hexadecimal characters. If Generate gives letters and digits only
        (older Nex), paste the output of openssl rand -hex 32 instead. Use a different value from the signing
        key.
  post_install: Use separate 64-character hexadecimal strings for the signing key and salt. Sign image requests
    with those values.
services:
  app:
    image: ghcr.io/imgproxy/imgproxy:latest
    deploy:
      replicas: 1
    ports:
    - ${PORT:-8080}:8080/tcp
    environment:
      IMGPROXY_KEY: ${SIGNING_KEY}
      IMGPROXY_SALT: ${SIGNING_SALT}
