x-nex:
  name: BunkerWeb
  summary: Next-gen Web Application Firewall (WAF) that will protect your web services
  description: Next-gen Web Application Firewall (WAF) that will protect your web services.
  category: security
  source: https://github.com/bunkerity/bunkerweb
  website: https://www.bunkerweb.io
  docs: https://docs.bunkerweb.io/latest/integrations/
  primary_service: bunkerweb
  options:
    DATA:
      label: Data folder
      help: Choose the Nex-managed folder mounted at /data.
    PORT:
      label: Port 8080/tcp
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
    PORT_2:
      label: Port 8443/tcp
      help: The app listens on TCP port 8443 on its default Docker network. Nex does not publish it on host
        addresses.
    PORT_3:
      label: Port 8443/udp
      help: The app listens on UDP port 8443 on its default Docker network. Nex does not publish it on host
        addresses.
    UI_PORT:
      label: 7000/tcp Web UI port
      help: The app listens on TCP port 7000 on its default Docker network. Nex does not publish it on host
        addresses.
  post_install: Complete the built-in setup wizard on the Web UI (port 7000) using a trusted network. Use
    Nex service names for the protected backends. Ensure the Data folder is writable by UID and GID 101.
  web:
    port: 7000
services:
  bunkerweb:
    image: docker.io/bunkerity/bunkerweb-all-in-one:latest
    deploy:
      replicas: 1
    environment:
      AUTOCONF_MODE: 'no'
      SERVICE_API: 'no'
    volumes:
    - ${DATA}:/data
    ports:
    - ${PORT:-8080}:8080/tcp
    - ${PORT_2:-8443}:8443/tcp
    - ${PORT_3:-21913}:8443/udp
    - ${UI_PORT:-7000}:7000/tcp
