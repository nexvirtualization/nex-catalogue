# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: ddns-go
  summary: Keep dynamic DNS records up to date
  description: Open the setup page on a trusted network and configure an upstream DNS provider. Use the
    HTTP public-IP lookup method for bridge networking. Host interfaces and IPv6 availability depend on
    the selected Nex network.
  category: networking
  website: https://github.com/IceWhaleTech/CasaOS-AppStore/tree/main/Apps/Ddns-go
  source: https://github.com/jeessy2/ddns-go
  docs: https://github.com/jeessy2/ddns-go#readme
  scalable: false
  primary_service: ddns-go
  architectures:
  - amd64
  - arm64
  web:
    service: ddns-go
    scheme: http
    port: 9876
  options:
    PORT:
      label: Web port
      help: The app listens on TCP port 9876 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: DNS updater configuration
      help: Select This host. Holds DNS provider credentials and updater preferences. Include this folder
        in a stopped Nex backup.
services:
  ddns-go:
    image: ghcr.io/jeessy2/ddns-go:latest
    ports:
    - ${PORT:-9876}:9876/tcp
    volumes:
    - ${DATA}:/root
    deploy:
      replicas: 1
