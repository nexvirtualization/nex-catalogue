# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Audioserve
  summary: Stream audiobooks from your own organized folders
  description: Select the audiobook library and sign in with the configured shared secret. Keep the
    data folder in stopped backups.
  category: media
  website: https://github.com/izderadicka/audioserve
  source: https://github.com/izderadicka/audioserve
  docs: https://github.com/izderadicka/audioserve
  primary_service: audioserve
  scalable: false
  license: MIT
  architectures:
  - amd64
  web:
    port: 3000
  options:
    SHARED_SECRET:
      label: Audiobook shared secret
      type: password
      help: Use Nex Generate. Configure HTTPS for client access.
    LIBRARY:
      label: Audiobooks
      help: Keep audiobooks in this managed folder between restarts.
    DATA:
      label: Playback state and cache
      help: Keep playback state and cache in this managed folder between restarts. If using a share,
        select a folder writable by Audioserve (UID 1000).
    PORT:
      label: Web port
      help: The app listens on TCP port 3000 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  audioserve:
    image: docker.io/izderadicka/audioserve:latest
    command:
    - /audiobooks
    environment:
      AUDIOSERVE_SHARED_SECRET: ${SHARED_SECRET}
      AUDIOSERVE_DATA_DIR: /home/audioserve
    volumes:
    - ${LIBRARY}:/audiobooks
    - ${DATA}:/home/audioserve
    ports:
    - ${PORT:-3000}:3000/tcp
    deploy:
      replicas: 1
