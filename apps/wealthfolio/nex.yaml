# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Wealthfolio
  summary: Track investments and analyze portfolio performance
  description: Wealthfolio runs as a browser service with SQLite data on Nex storage. A signing key and Argon2id
    password hash secure access.
  category: finance
  website: https://wealthfolio.app/
  source: https://github.com/wealthfolio/wealthfolio
  docs: https://github.com/wealthfolio/wealthfolio
  primary_service: wealthfolio
  post_install: Use the specified origin at your HTTPS reverse proxy. Sign in with the plaintext password
    represented by the configured hash.
  license: AGPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 8088
  options:
    SECRET_KEY:
      label: Signing secret
      help: Use a base64-encoded random 32-byte key.
      type: password
    PASSWORD_HASH:
      label: Argon2id password hash
      help: Paste an Argon2id PHC hash, including its dollar signs.
      type: password
    PUBLIC_ORIGIN:
      label: Browser origin
      help: Exact scheme and hostname for the origin that browsers use.
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 8088 inside Nex.
    DATA:
      label: Portfolio database
      help: Managed directory mounted at /data. Choose storage writable by the application.
services:
  wealthfolio:
    image: docker.io/wealthfolio/wealthfolio:latest
    ports:
    - ${PORT:-20237}:8088/tcp
    volumes:
    - ${DATA}:/data
    environment:
      WF_LISTEN_ADDR: 0.0.0.0:8088
      WF_DB_PATH: /data/wealthfolio.db
      WF_SECRET_KEY: ${SECRET_KEY}
      WF_AUTH_PASSWORD_HASH: ${PASSWORD_HASH}
      WF_CORS_ALLOW_ORIGINS: ${PUBLIC_ORIGIN}
    deploy:
      replicas: 1
