# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: MindsDB
  summary: Query connected data sources through MindsDB
  description: Open the MindsDB dashboard and add a supported data source. Keep query execution and stored
    connection credentials behind trusted ingress.
  category: ai
  website: https://mindsdb.com/
  source: https://github.com/mindsdb/mindshub
  docs: https://docs.mindsdb.com/setup/self-hosted/docker
  primary_service: mindsdb
  post_install: Open the MindsDB dashboard and add a supported data source. Keep query execution and stored
    connection credentials behind trusted ingress.
  license: MIT
  architectures:
  - amd64
  - arm64
  web:
    port: 47334
  options:
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 47334 inside Nex.
    DATA:
      label: MindsDB data
      help: Managed directory mounted at /mindsdb/var. Choose storage writable by the application.
services:
  mindsdb:
    image: docker.io/mindsdb/mindsdb:latest
    ports:
    - ${PORT:-23489}:47334/tcp
    volumes:
    - ${DATA}:/mindsdb/var
    environment:
      MINDSDB_DOCKER_ENV: 'true'
      MINDSDB_STORAGE_DIR: /mindsdb/var
    deploy:
      replicas: 1
