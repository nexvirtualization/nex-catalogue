# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: RomM
  summary: Browse and catalog a local game library
  description: Provision a supported MariaDB database and dedicated user. Open RomM on a trusted network
    and add your directories and metadata providers.
  category: media
  website: https://romm.app/
  source: https://github.com/rommapp/romm
  docs: https://docs.romm.app/latest/Getting-Started/Quick-Start-Guide/
  primary_service: romm
  post_install: Provision a supported MariaDB database and dedicated user. Open RomM on a trusted network
    and add your directories and metadata providers.
  license: AGPL-3.0
  architectures:
  - amd64
  - arm64
  web:
    port: 8080
  options:
    DB_HOST:
      label: Db host
      help: Hostname or Nex connection name of the database service.
    DB_NAME:
      label: Db name
      help: Enter the deployment value described in the upstream setup guide.
    DB_USER:
      label: Db user
      help: Enter the deployment value described in the upstream setup guide.
    DB_PASSWORD:
      label: Db password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    SIGNING_SECRET:
      label: Signing secret
      help: Use the credential or secret required by the upstream configuration.
      type: password
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 8080 inside Nex.
    LIBRARY:
      label: Game library
      help: Managed directory mounted at /romm/library. Choose storage readable by the application.
    ASSETS:
      label: Library assets
      help: Managed directory mounted at /romm/assets. Choose storage writable by the application.
    CONFIG:
      label: Configuration
      help: Managed directory mounted at /romm/config. Choose storage writable by the application.
    RESOURCES:
      label: Artwork and metadata
      help: Managed directory mounted at /romm/resources. Choose storage writable by the application.
services:
  romm:
    image: ghcr.io/rommapp/romm:latest
    ports:
    - ${PORT:-23478}:8080/tcp
    volumes:
    - ${LIBRARY}:/romm/library:ro
    - ${ASSETS}:/romm/assets
    - ${CONFIG}:/romm/config
    - ${RESOURCES}:/romm/resources
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME:-romm}
      DB_USER: ${DB_USER}
      DB_PASSWD: ${DB_PASSWORD}
      ROMM_AUTH_SECRET_KEY: ${SIGNING_SECRET}
    deploy:
      replicas: 1
