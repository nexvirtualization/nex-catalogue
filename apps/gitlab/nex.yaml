# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: GitLab
  summary: Host source repositories, issues and build projects
  description: Use a trusted HTTPS proxy, verify the public URL, and sign in as root with the configured
    initial password. Review memory, storage and upgrade requirements before installing.
  category: development
  website: https://gitlab.com/gitlab-org/gitlab-foss
  source: https://gitlab.com/gitlab-org/gitlab-foss
  docs: https://docs.gitlab.com/install/docker/installation/
  primary_service: gitlab
  scalable: false
  license: MIT
  web:
    port: 80
  options:
    GITLAB_ROOT_PASSWORD:
      label: Initial root password
      type: password
      help: Use Nex Generate and keep the password secure.
    PUBLIC_URL:
      label: Public web address
      help: Full browser-facing URL, including scheme and any port.
    CONFIG:
      label: GitLab configuration and keys
      help: Keep gitlab configuration and keys in this managed folder between restarts.
    LOGS:
      label: GitLab logs
      help: Keep gitlab logs in this managed folder between restarts.
    DATA:
      label: Repositories and GitLab databases
      help: Keep repositories and gitlab databases in this managed folder between restarts.
    PORT:
      label: Web port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  gitlab:
    image: docker.io/gitlab/gitlab-ce:latest
    environment:
      GITLAB_OMNIBUS_CONFIG: nginx['listen_https'] = false; nginx['listen_port'] = 80; letsencrypt['enable']
        = false
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD}
      EXTERNAL_URL: ${PUBLIC_URL}
    volumes:
    - ${CONFIG}:/etc/gitlab
    - ${LOGS}:/var/log/gitlab
    - ${DATA}:/var/opt/gitlab
    ports:
    - ${PORT:-80}:80/tcp
    deploy:
      replicas: 1
