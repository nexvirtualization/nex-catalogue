# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Longvinter
  summary: Host a persistent island survival server
  description: >-
    Keep the game folders on This host and choose a registered primary network that players can reach.
    Join through the Longvinter server browser. Game traffic uses UDP 7777. The image fetches the Uuvana
    dedicated server through SteamCMD on first start (about 2 GB) and checks for updates on restart.
    Make a stopped backup before applying game updates.
  category: games
  website: https://store.steampowered.com/app/1635450/
  source: https://github.com/kimzuni/longvinter-docker-server
  docs: https://github.com/kimzuni/longvinter-docker-server#readme
  license: Proprietary game server
  architectures:
    - amd64
  tags:
    - multiplayer
  options:
    JOIN_PASSWORD:
      label: Join password
      type: password
      help: Choose a password and share it with your players.
    DATA:
      label: Server data
      help: Choose This host and include this folder in stopped backups.
services:
  longvinter:
    image: ghcr.io/kimzuni/longvinter-docker-server:latest
    # The image forces SteamCMD to 64-bit, which Steam rejects for this app ("Failed to install app ...
    # Missing configuration"), and Steam also refuses the first anonymous install now and then. Drop that
    # option and retry the install up to four times.
    entrypoint:
    - /bin/bash
    - -ec
    - |
      cat > /usr/local/bin/steamcmd-retry <<'WRAP'
      #!/bin/bash
      for try in 1 2 3 4; do
        /home/steam/steamcmd/steamcmd.sh "$$@" && [ -e "$${DATA_DIR:-/data}/LongvinterServer.sh" ] && exit 0
        sleep 10
      done
      exit 1
      WRAP
      chmod 755 /usr/local/bin/steamcmd-retry
      steamcmd=/home/steam/steamcmd/steamcmd.sh
      sed -i -e 's/ +@sSteamCmdForcePlatformBitness 64//' \
        -e "s#$$steamcmd#/usr/local/bin/steamcmd-retry#" /home/steam/server/helper_install.sh
      exec /home/steam/server/init.sh
    environment:
      PUID: '1000'
      PGID: '1000'
      PORT: '7777'
      CFG_SERVER_NAME: Nex Longvinter
      CFG_PASSWORD: ${JOIN_PASSWORD}
    expose:
      - 7777/udp
    volumes:
      - ${DATA}:/data
    stop_grace_period: 90s
    deploy:
      replicas: 1
