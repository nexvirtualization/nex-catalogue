# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: 4ga Boards
  summary: Manage projects and tasks on shared boards
  description: Provision PostgreSQL and Redis. Open the configured HTTPS URL and complete first-user setup.
  category: productivity
  website: https://4gaboards.com
  source: https://github.com/RARgames/4gaBoards
  docs: https://docs.4gaboards.com/docs/dev/install/docker-install
  primary_service: fourga-boards
  post_install: Provision PostgreSQL and Redis. Open the configured HTTPS URL and complete first-user setup.
  license: MIT
  architectures:
  - amd64
  - arm64
  web:
    port: 1337
  options:
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    SIGNING_SECRET:
      label: Signing secret
      help: Use the credential or secret required by the upstream configuration.
      type: password
    DATABASE_URL:
      label: Database url
      help: Connection URL for the database. Percent-encode special characters in credentials.
      type: password
    REDIS_URL:
      label: Redis url
      help: Enter the deployment value described in the upstream setup guide.
    PORT:
      label: HTTP port
      help: The app listens on TCP port 1337 on its default Docker network. Nex does not publish it on host
        addresses.
    AVATARS:
      label: User avatars
      help: Managed directory mounted at /app/public/user-avatars. Choose storage writable by the application.
    BACKGROUNDS:
      label: Project backgrounds
      help: Managed directory mounted at /app/public/project-background-images. Choose storage writable by
        the application.
    ATTACHMENTS:
      label: Task attachments
      help: Managed directory mounted at /app/private/attachments. Choose storage writable by the application.
services:
  fourga-boards:
    image: ghcr.io/rargames/4gaboards:latest
    ports:
    - ${PORT:-1337}:1337/tcp
    volumes:
    - ${AVATARS}:/app/public/user-avatars
    - ${BACKGROUNDS}:/app/public/project-background-images
    - ${ATTACHMENTS}:/app/private/attachments
    environment:
      BASE_URL: ${PUBLIC_URL}
      SECRET_KEY: ${SIGNING_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      UPLOAD_RATE_LIMIT_STORE: redis
      UPLOAD_RATE_LIMIT_REDIS_URL: ${REDIS_URL}
    deploy:
      replicas: 1
