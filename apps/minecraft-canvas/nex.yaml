# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Minecraft Canvas
  summary: Run a region-threaded Java Edition server for Canvas plugins
  description: >-
    Keep the server folders on This host and choose a registered primary network that players can
    reach. Join using the app’s Primary address on TCP 25565 in Java Edition. The server installs
    the current Canvas stable build. Use Canvas-compatible plugins and match your Java Edition
    clients to the release shown in the logs. Make a stopped backup before applying updates.
  category: games
  website: https://canvasmc.io/
  source: https://github.com/itzg/docker-minecraft-server
  docs: https://docs.canvasmc.io/
  license: Minecraft EULA and upstream server license
  architectures: [amd64, arm64, riscv64]
  tags: [minecraft, sandbox]
  options:
    EULA:
      label: Accept the Minecraft EULA
      type: bool
      help: >-
        Read https://www.minecraft.net/eula and turn this on to start the server.
    PLAYERS:
      label: Allowed Java players
      help: >-
        Comma-separated Java Edition usernames. Edit this list in Nex to grant or revoke access.
    DATA:
      label: World, extensions and settings
      help: >-
        Choose This host and include this folder in stopped backups.
services:
  minecraft-canvas:
    image: ghcr.io/itzg/minecraft-server:latest
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        set -o pipefail
        CUSTOM_SERVER=$$(curl -fsSL --retry 3 'https://canvasmc.io/api/v2/builds/latest?project=canvas' | jq -er '.downloadUrl | select(startswith("https://jenkins.canvasmc.io/"))')
        export CUSTOM_SERVER
        exec /image/scripts/start
    environment:
      EULA: ${EULA}
      TYPE: CUSTOM
      MEMORY: 3G
      ENABLE_RCON: 'false'
      ONLINE_MODE: 'true'
      ENABLE_WHITELIST: 'true'
      ENFORCE_WHITELIST: 'true'
      EXISTING_WHITELIST_FILE: SYNCHRONIZE
      WHITELIST: ${PLAYERS}
      FAMILY: PAPER
      JVM_OPTS: --add-modules=jdk.incubator.vector
    expose:
      - 25565/tcp
    volumes:
      - ${DATA}:/data
    stop_grace_period: 90s
    deploy:
      replicas: 1
    healthcheck:
      start_period: 15m
