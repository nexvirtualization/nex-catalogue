# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Killing Floor 2
  summary: Host a wave-survival co-op server
  description: >-
    Keep the game folders on This host and choose a registered primary network that players can reach.
    Find the server in the game browser. UDP 7777 serves players and UDP 27015 handles queries. First
    boot downloads the server through SteamCMD. Restarts check for updates. Make a stopped backup
    before applying game updates.
  category: games
  website: https://store.steampowered.com/app/232090/
  source: https://github.com/GameServerManagers/docker-gameserver
  docs: https://linuxgsm.com/servers/kf2server/
  license: Proprietary game server
  architectures:
    - amd64
  tags:
    - steam
    - co-op
  options:
    DATA:
      label: Server data
      help: Choose This host and include this folder in stopped backups.
services:
  killing-floor-2:
    image: ghcr.io/gameservermanagers/gameserver:kf2
    environment:
      UPDATE_CHECK: '0'
      UPDATE_ON_START: 'true'
    expose:
      - 7777/udp
      - 27015/udp
    volumes:
      - ${DATA}:/data
    healthcheck:
      start_period: 25m
    stop_grace_period: 90s
    deploy:
      replicas: 1
