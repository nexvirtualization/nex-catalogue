x-nex:
  name: Postal
  summary: Operate a transactional email delivery server
  description: Before starting Postal, provision MariaDB 10.6 or later, prepare postal.yml and signing.key,
    then initialize the database and create the first administrator.
  category: communication
  website: https://docs.postalserver.io/
  source: https://github.com/postalserver/postal
  docs: https://docs.postalserver.io/other/containers/
  primary_service: postal
  post_install: Configure public DNS and route HTTPS to port 5000 and public TCP 25 to port 2525 on
    the application address. Configure Postal's SMTP certificate if required. Back up the configuration
    and both the main and message databases.
  license: MIT
  architectures:
  - amd64
  web:
    port: 5000
  options:
    PORT:
      label: HTTP port
      help: The app listens on TCP port 5000 on its default Docker network. Nex does not publish it on host
        addresses.
    SMTP_PORT:
      label: SMTP port
      help: The app listens on TCP port 2525 on its default Docker network. Nex does not publish it on host
        addresses.
    CONFIG:
      label: Postal configuration
      help: Select the folder with postal.yml, signing.key and any SMTP TLS files readable by Postal
        (UID 999). Use /config for container paths. Run postal initialize and postal make-user using the
        Postal 3.4.0 image with the same configuration and access to MariaDB before starting the app.
services:
  postal:
    image: docker.io/library/haproxy:latest
    ports:
    - ${PORT:-5000}:5000/tcp
    - ${SMTP_PORT:-2525}:2525/tcp
    entrypoint:
    - /bin/sh
    command:
    - -ec
    - |-
      cat > /tmp/postal-proxy.cfg <<'EOF'
      resolvers docker
        nameserver embedded 127.0.0.11:53
      defaults
        timeout connect 5s
        timeout client 120s
        timeout server 120s
        default-server resolvers docker init-addr none
      listen web
        bind :5000
        mode http
        server postal postal-web:5000
      listen smtp
        bind :2525
        mode tcp
        server postal postal-smtp:2525 send-proxy
      EOF
      exec haproxy -W -db -f /tmp/postal-proxy.cfg
    deploy:
      replicas: 1
  postal-web:
    image: ghcr.io/postalserver/postal:3.4.0
    command:
    - postal
    - web-server
    environment:
      PORT: '5000'
      BIND_ADDRESS: 0.0.0.0
    volumes:
    - ${CONFIG}:/config:ro
    deploy:
      replicas: 1
  postal-smtp:
    image: ghcr.io/postalserver/postal:3.4.0
    command:
    - postal
    - smtp-server
    environment:
      PORT: '2525'
      BIND_ADDRESS: 0.0.0.0
      SMTP_SERVER_PROXY_PROTOCOL: 'true'
    volumes:
    - ${CONFIG}:/config:ro
    deploy:
      replicas: 1
  postal-worker:
    image: ghcr.io/postalserver/postal:3.4.0
    command:
    - postal
    - worker
    environment: {}
    volumes:
    - ${CONFIG}:/config:ro
    deploy:
      replicas: 1
