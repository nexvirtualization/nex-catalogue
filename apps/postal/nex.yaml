# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Postal
  summary: Operate a transactional email delivery server
  description: Provision MariaDB and DNS. Prepare postal.yml and signing.key in Configuration and run Postal
    initialization and user creation. Route HTTPS to the web endpoint and public TCP 25 to the SMTP port.
    Configure the upstream SMTP certificate if required.
  category: communication
  website: https://docs.postalserver.io/
  source: https://github.com/postalserver/postal
  docs: https://docs.postalserver.io/other/containers/
  primary_service: postal
  post_install: Provision MariaDB and DNS. Prepare postal.yml and signing.key in Configuration and run Postal
    initialization and user creation. Route HTTPS to the web endpoint and public TCP 25 to the SMTP port.
    Configure the upstream SMTP certificate if required.
  license: MIT
  architectures:
  - amd64
  web:
    port: 5000
  options:
    PORT:
      label: Published HTTP port
      help: Host-published port. The app listens on TCP port 5000 inside Nex.
    SMTP_PORT:
      label: Published SMTP port
      help: Host-published port for the internal 2525/tcp endpoint.
    CONFIG:
      label: Postal configuration
      help: Managed directory containing postal.yml, signing.key, and any SMTP TLS files. Mounted at /config.
services:
  postal:
    image: docker.io/library/haproxy:latest
    ports:
    - ${PORT:-23492}:5000/tcp
    - ${SMTP_PORT:-24492}:2525/tcp
    entrypoint:
    - /bin/sh
    command:
    - -ec
    - |-
      cat > /tmp/postal-proxy.cfg <<'EOF'
      defaults
        timeout connect 5s
        timeout client 120s
        timeout server 120s
      listen web
        bind :5000
        mode http
        server postal postal-web:5000
      listen smtp
        bind :2525
        mode tcp
        server postal postal-smtp:2525 send-proxy
      EOF
      exec haproxy -W -db -f /tmp/postal-proxy.cfg
    deploy:
      replicas: 1
  postal-web:
    image: ghcr.io/postalserver/postal:3.4.0
    command:
    - postal
    - web-server
    environment:
      PORT: '5000'
      BIND_ADDRESS: 0.0.0.0
    volumes:
    - ${CONFIG}:/config:ro
    deploy:
      replicas: 1
  postal-smtp:
    image: ghcr.io/postalserver/postal:3.4.0
    command:
    - postal
    - smtp-server
    environment:
      PORT: '2525'
      BIND_ADDRESS: 0.0.0.0
      SMTP_SERVER_PROXY_PROTOCOL: 'true'
    volumes:
    - ${CONFIG}:/config:ro
    deploy:
      replicas: 1
  postal-worker:
    image: ghcr.io/postalserver/postal:3.4.0
    command:
    - postal
    - worker
    environment: {}
    volumes:
    - ${CONFIG}:/config:ro
    deploy:
      replicas: 1
