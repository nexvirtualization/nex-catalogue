x-nex:
  name: miniserve
  summary: Serve selected files from a browser
  description: Sign in with the configured credentials. Keep the folder on a trusted network or place
    the endpoint behind HTTPS.
  category: documents
  website: https://github.com/svenstaro/miniserve
  source: https://github.com/svenstaro/miniserve
  docs: https://github.com/svenstaro/miniserve
  primary_service: miniserve
  scalable: false
  license: MIT
  web:
    port: 8080
  options:
    USERNAME:
      label: File browser username
      help: Username for HTTP Basic authentication.
    PASSWORD:
      label: File browser password
      type: password
      help: Use Nex Generate and configure HTTPS for remote access.
    FILES:
      label: Files to serve
      help: Keep files to serve in this managed folder between restarts.
    PORT:
      label: Web port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
services:
  miniserve:
    image: docker.io/svenstaro/miniserve:latest
    command:
    - --auth
    - ${USERNAME:-nex}:${PASSWORD}
    - /files
    volumes:
    - ${FILES}:/files
    ports:
    - ${PORT:-8080}:8080/tcp
    deploy:
      replicas: 1
