# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: wildduck
  summary: Serve mailboxes over IMAP, POP3, and the WildDuck API
  description: >-
    Provision MongoDB and Redis and give their addresses below. A self-signed certificate for the mail
    domain is created in Mail TLS files on first start when no certificate is there; replace it with
    your own fullchain.pem and privkey.pem and restart for mail clients to trust it. Protect the
    management API with its access token. Connect separate SMTP delivery and submission services if
    you need a full mail stack.
  category: communication
  website: https://wildduck.email/
  source: https://github.com/zone-eu/wildduck
  docs: https://docs.wildduck.email/docs/getting-started/installation/
  primary_service: wildduck
  post_install: >-
    To use your own certificate, replace fullchain.pem and privkey.pem in Mail TLS files and restart.
    Keep the API access token private. Connect separate SMTP delivery and submission services if you
    need a full mail stack.
  license: EUPL-1.2
  architectures:
  - amd64
  - arm64
  options:
    MONGO_URI:
      label: MongoDB connection URL
      help: Address of your MongoDB database, for example mongodb://user:password@host:27017/wildduck. It
        contains the password, so keep it private.
      type: password
    REDIS_URL:
      label: Redis connection URL
      help: Address of your Redis server, for example redis://host:6379/3.
    MAIL_DOMAIN:
      label: Mail domain
      help: Domain of the mailboxes, also the IMAP and POP3 server name and the name on the generated certificate.
    API_TOKEN:
      label: API access token
      help: Token that management API requests must send. Use Generate.
      type: password
    TOTP_SECRET:
      label: Two-factor secret
      help: Encrypts the stored two-factor seeds. Use Generate. Changing it later invalidates enrolled two-factor setups.
      type: password
    PORT:
      label: HTTP port
      help: The app listens on TCP port 8080 on its default Docker network. Nex does not publish it on host
        addresses.
    IMAP_PORT:
      label: IMAP TLS port
      help: The app listens on TCP port 9993 on its default Docker network. Nex does not publish it on host
        addresses.
    POP_PORT:
      label: POP3 TLS port
      help: The app listens on TCP port 9995 on its default Docker network. Nex does not publish it on host
        addresses.
    TLS_FILES:
      label: Mail TLS files
      help: Holds fullchain.pem and privkey.pem. A self-signed pair is created here on first start if both are missing; replace it with your own and restrict access to the key.
services:
  wildduck:
    image: ghcr.io/zone-eu/wildduck:latest
    ports:
    - ${PORT:-8080}:8080/tcp
    - ${IMAP_PORT:-9993}:9993/tcp
    - ${POP_PORT:-9995}:9995/tcp
    command:
    - /bin/sh
    - -ec
    - |
      if [ ! -e /certificates/fullchain.pem ] && [ ! -e /certificates/privkey.pem ]; then
        openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
          -subj "/CN=$$APPCONF_emailDomain" -addext "subjectAltName=DNS:$$APPCONF_emailDomain" \
          -keyout /certificates/privkey.pem -out /certificates/fullchain.pem
        chmod 600 /certificates/privkey.pem
      fi
      exec node /wildduck/server.js --config=/wildduck/config/default.toml
    volumes:
    - ${TLS_FILES}:/certificates
    environment:
      APPCONF_dbs_mongo: ${MONGO_URI}
      APPCONF_dbs_redis: ${REDIS_URL}
      APPCONF_emailDomain: ${MAIL_DOMAIN}
      APPCONF_imap_setup_hostname: ${MAIL_DOMAIN}
      APPCONF_pop3_setup_hostname: ${MAIL_DOMAIN}
      APPCONF_api_host: 0.0.0.0
      APPCONF_api_accessToken: ${API_TOKEN}
      APPCONF_totp_secret: ${TOTP_SECRET}
      APPCONF_tls_cert: /certificates/fullchain.pem
      APPCONF_tls_key: /certificates/privkey.pem
    deploy:
      replicas: 1
