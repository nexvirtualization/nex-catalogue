x-nex:
  name: ShellHub
  summary: Connect and manage enrolled systems from a web console
  description: Provision PostgreSQL. The API keys and SSH host key are generated on first start and kept
    in the key folder. Forward HTTPS through a proxy that supports WebSockets and route SSH separately.
    Use the first-run setup to create the administrator and enroll devices.
  category: management
  website: https://www.shellhub.io
  source: https://github.com/shellhub-io/shellhub
  docs: https://docs.shellhub.io/selfhosted/quickstart
  primary_service: shellhub
  post_install: Provision PostgreSQL. The API keys and SSH host key are generated on first start and kept
    in the key folder. Forward HTTPS through a proxy that supports WebSockets and route SSH separately.
    Use the first-run setup to create the administrator and enroll devices.
  license: Apache-2.0
  architectures:
  - amd64
  web:
    port: 80
  options:
    PUBLIC_URL:
      label: Public url
      help: Full browser-facing URL, including scheme and any nonstandard port.
    PUBLIC_HOST:
      label: Public host
      help: Hostname clients use to reach ShellHub, without scheme or port, such as shellhub.example.com.
        An IP address is not accepted. Leave empty for localhost, which works only on this host.
    PUBLIC_SSH_PORT:
      label: Public ssh port
      help: Enter the deployment value described in the upstream setup guide.
    DB_HOST:
      label: Db host
      help: Hostname or Nex connection name of the database service.
    DB_PORT:
      label: Db port
      help: Enter the deployment value described in the upstream setup guide.
    DB_USER:
      label: Db user
      help: Enter the deployment value described in the upstream setup guide.
    DB_PASSWORD:
      label: Db password
      help: Use the credential or secret required by the upstream configuration.
      type: password
    DB_NAME:
      label: Db name
      help: Enter the deployment value described in the upstream setup guide.
    PORT:
      label: HTTP port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
    SSH_PORT:
      label: ShellHub SSH port
      help: The app listens on TCP port 2222 on its default Docker network. Nex does not publish it on host
        addresses.
    DATA:
      label: Gateway persistent files
      help: Managed directory mounted at /data. Choose storage writable by the application.
    CONFIG:
      label: ShellHub key files
      help: Select This host. ShellHub's API keys and SSH host key are generated here on first start.
        Keep this folder across updates and include it in a stopped Nex backup.
services:
  shellhub:
    image: docker.io/shellhubio/server:v0.30.1
    ports:
    - ${PORT:-80}:80/tcp
    - ${SSH_PORT:-2222}:2222/tcp
    # The keygen service writes the keys; start only once the last one exists.
    entrypoint:
    - /bin/sh
    - -c
    - until [ -s /nex-keys/ssh_private_key ]; do sleep 1; done; exec /server server
    volumes:
    - ${DATA}:/data
    - ${CONFIG}:/nex-keys:ro
    environment:
      SHELLHUB_VERSION: v0.30.1
      SHELLHUB_EDITION: community
      SHELLHUB_GATEWAY: 'true'
      SHELLHUB_AUTO_SSL: 'false'
      SHELLHUB_PUBLIC_URL: ${PUBLIC_URL}
      SHELLHUB_DOMAIN: ${PUBLIC_HOST:-localhost}
      SHELLHUB_SSH_PORT: ${PUBLIC_SSH_PORT:-2222}
      SHELLHUB_TELEMETRY: 'false'
      PRIVATE_KEY: /nex-keys/api_private_key
      PUBLIC_KEY: /nex-keys/api_public_key
      SSH_HOST_KEY_FILE: /nex-keys/ssh_private_key
      POSTGRES_HOST: ${DB_HOST}
      POSTGRES_PORT: ${DB_PORT:-5432}
      POSTGRES_USERNAME: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DATABASE: ${DB_NAME:-shellhub}
    deploy:
      replicas: 1
  keygen:
    image: docker.io/alpine/openssl:latest
    entrypoint:
    - /bin/sh
    - -ec
    - |
      cd /keys
      [ -s api_private_key ] || openssl genrsa -traditional -out api_private_key 2048
      [ -s api_public_key ] || openssl rsa -in api_private_key -pubout -out api_public_key
      [ -s ssh_private_key ] || { openssl genrsa -traditional -out ssh_private_key.new 2048 && mv ssh_private_key.new ssh_private_key; }
      exec su -s /bin/sh nobody -c 'exec sleep infinity'
    volumes:
    - ${CONFIG}:/keys
    deploy:
      replicas: 1
  ui:
    image: docker.io/shellhubio/ui:v0.30.1
    environment:
      SHELLHUB_EDITION: community
      SHELLHUB_VERSION: v0.30.1
    deploy:
      replicas: 1
  redis:
    image: docker.io/valkey/valkey:9.1-alpine
    command:
    - valkey-server
    - --appendonly
    - 'no'
    - --save
    - ''
    deploy:
      replicas: 1
