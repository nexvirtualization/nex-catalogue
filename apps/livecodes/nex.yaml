# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: LiveCodes
  summary: Run a browser playground for web languages and frameworks
  description: Serve the official v49 browser build. Editing, compilation and preview run in the browser. Some
    languages and optional services, including external embeds and sharing, contact external services.
  category: development
  website: https://livecodes.io/docs/features/self-hosting
  source: https://github.com/live-codes/livecodes
  docs: https://livecodes.io/docs/features/self-hosting/
  license: MIT
  primary_service: livecodes
  architectures:
  - amd64
  - arm64
  post_install: Open the playground from an HTTPS address for the full set of browser features. Export projects
    to keep them outside browser storage.
  web:
    port: 80
  options:
    PORT:
      label: HTTP port
      help: The app listens on TCP port 80 on its default Docker network. Nex does not publish it on host
        addresses.
  version: '49'
services:
  livecodes:
    image: docker.io/library/nginx:latest
    ports:
    - ${PORT:-80}:80/tcp
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - |-
      stage=$$(mktemp -d)
      trap 'rm -rf "$$stage"' EXIT
      curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 120 --max-filesize 125829120   https://github.com/live-codes/livecodes/releases/download/v49/livecodes-v49.tar.gz -o "$$stage/upstream.tgz"
      (
        cd "$$stage"
        printf '%s\n' 'e8ede45a372217283222f68ec0f0234d6d73524add88bb0b7a547f70d9fe9864  upstream.tgz' | sha256sum -c -
      )
      tar -xzf "$$stage/upstream.tgz" -C /usr/share/nginx/html --strip-components=1
      test -s /usr/share/nginx/html/index.html
      rm -rf "$$stage"
      trap - EXIT
      exec /docker-entrypoint.sh nginx -g 'daemon off;'
    deploy:
      replicas: 1
